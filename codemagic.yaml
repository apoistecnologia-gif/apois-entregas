workflows:
  android-customer-debug:
    name: APOIS Cliente - APK Assinado
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 21
      android_signing:
        - apois_entregas_release
      groups:
        - apois_android
      vars:
        APOIS_MOBILE_PRODUCT: customer
        APOIS_MOBILE_BUILD: "1"
        VITE_APOIS_PRODUCT_MODE: customer
        APP_ROUTE: "/"
        APP_PACKAGE: "br.com.apois.cliente"
        APP_LABEL: "APOIS Cliente"
        EXPECTED_SIGNING_SHA1: "98:7C:6A:7A:BE:26:9C:1E:5A:01:B5:B7:98:A9:6D:56:66:D8:5E:69"
    scripts:
      - name: Install Bun and dependencies
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun --version
          java -version
          bun install --frozen-lockfile
          npm install --no-save @capacitor/app@8 @capacitor/browser@8
      - name: Validate required environment
        script: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required in Codemagic group apois_android}"
          : "${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required in Codemagic group apois_android}"
          : "${FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_BASE64:?FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_BASE64 is required in Codemagic group apois_android}"
          : "${CM_KEYSTORE_PATH:?Codemagic permanent keystore was not loaded}"
          : "${CM_KEYSTORE_PASSWORD:?Codemagic keystore password is missing}"
          : "${CM_KEY_ALIAS:?Codemagic key alias is missing}"
          : "${CM_KEY_PASSWORD:?Codemagic key password is missing}"
          test -s "$CM_KEYSTORE_PATH"
      - name: Build isolated web app
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun run build
      - name: Render Capacitor index.html
        script: |
          set -euo pipefail
          HOST=127.0.0.1 PORT=4173 node .output/server/index.mjs >/tmp/apois-mobile-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "http://127.0.0.1:4173${APP_ROUTE}" -o .output/public/index.html; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/apois-mobile-server.log; exit 1; fi
            sleep 1
          done
          test -s .output/public/index.html
      - name: Create and configure Android project
        script: |
          set -euo pipefail
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          rm -rf android
          npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2 @capacitor/geolocation@8.2.0 @capacitor/push-notifications@8.1.2 @capacitor/app@8 @capacitor/browser@8
          npx cap add android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          printf '%s' "$FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          grep -Fq "$APP_PACKAGE" android/app/google-services.json
          npx cap sync android
          bun run android:configure
      - name: Apply APOIS Android branding
        script: |
          set -euo pipefail
          node scripts/apply-android-branding.mjs
          grep -Fq '@drawable/apois_launcher' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:scheme="br.com.apois.cliente"' android/app/src/main/AndroidManifest.xml
      - name: Build and sign APK
        script: |
          set -euo pipefail
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          BUILD_TOOLS="$(python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['ANDROID_SDK_ROOT']) / 'build-tools'
          def ver(p):
              out=[]
              for part in p.name.split('.'):
                  try: out.append(int(part))
                  except ValueError: out.append(0)
              return tuple(out)
          print(max((p for p in root.iterdir() if p.is_dir()), key=ver))
          PY
          )"
          ALIGNED="$CM_BUILD_DIR/APOIS-Cliente-release-aligned.apk"
          SIGNED="$CM_BUILD_DIR/APOIS-Cliente.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee /tmp/apois-signing.txt
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_NORMALIZED="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {print $2}' /tmp/apois-signing.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_NORMALIZED"
          test "$ACTUAL_NORMALIZED" = "$EXPECTED_NORMALIZED"
          rm -f "$ALIGNED"
          test -s "$SIGNED"
    artifacts:
      - APOIS-Cliente.apk

