# External payment providers call these endpoints directly and authenticate with their
# own provider-specific credentials/signatures. Internal async callbacks may also
# disable Supabase JWT verification when they enforce a dedicated secret header.
# Keep this file aligned with production deploys.
[functions.mercadopago-webhook]
verify_jwt = false

[functions.openpix-webhook]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

# Called only by the protected Postgres push outbox trigger. The function validates
# x-apois-push-dispatch-key against PUSH_DISPATCH_WEBHOOK_SECRET before doing work.
[functions.dispatch-push-outbox]
verify_jwt = false

# Called by admins (Bearer JWT) or by the protected pg_cron/pg_net retry job via
# x-apois-payout-dispatch-key, verified against private.runtime_settings before any
# dispatch happens. Remains inert while courier_payout_mode != marketplace_direct_live.
[functions.mercadopago-payout]
verify_jwt = false
