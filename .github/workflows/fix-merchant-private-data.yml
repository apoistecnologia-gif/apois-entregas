name: Fix Merchant Private Data

on:
  push:
    paths:
      - ".github/workflows/fix-merchant-private-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Isolate private merchant fields from customer catalog reads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          safe = "id,category_id,name,slug,description,logo_url,cover_url,tags,delivery_fee,delivery_min_minutes,delivery_max_minutes,rating,review_count,is_open,closes_at,is_active,address_line,neighborhood,city,state,latitude,longitude,created_at,updated_at,minimum_order,pickup_enabled,delivery_enabled,approval_status,temporarily_closed,city_id"

          catalog = Path('src/lib/catalog.ts')
          text = catalog.read_text()
          text = text.replace(
              'import { supabase } from "@/integrations/supabase/client";\n',
              f'import {{ supabase }} from "@/integrations/supabase/client";\n\nconst PUBLIC_MERCHANT_COLUMNS =\n  "{safe}";\n',
              1,
          )
          if 'from("merchants").select("*").eq("is_active", true)' not in text:
              raise SystemExit('catalog list marker not found')
          text = text.replace(
              'from("merchants").select("*").eq("is_active", true)',
              'from("merchants").select(PUBLIC_MERCHANT_COLUMNS).eq("is_active", true)',
              1,
          )
          if '.from("merchants")\n    .select("*")' not in text:
              raise SystemExit('catalog detail marker not found')
          text = text.replace(
              '.from("merchants")\n    .select("*")',
              '.from("merchants")\n    .select(PUBLIC_MERCHANT_COLUMNS)',
              1,
          )
          catalog.write_text(text)

          orders = Path('src/lib/orders.ts')
          text = orders.read_text()
          if 'merchants (*),' not in text:
              raise SystemExit('order merchant wildcard marker not found')
          text = text.replace(
              'merchants (*),',
              'merchants (id,name,logo_url,cover_url,address_line,neighborhood,city,state,latitude,longitude,delivery_fee,delivery_min_minutes,delivery_max_minutes,pickup_enabled,delivery_enabled,temporarily_closed),',
              1,
          )
          orders.write_text(text)

          merchant = Path('src/routes/merchant.tsx')
          text = merchant.read_text()
          old = '''        const [merchantRes, docsRes, subscriptionRes] = await Promise.all([\n          from("merchants").select("*").eq("id", member.merchant_id).maybeSingle(),'''
          new = f'''        const [merchantRes, docsRes, subscriptionRes, privateRes] = await Promise.all([\n          from("merchants")\n            .select("{safe}")\n            .eq("id", member.merchant_id)\n            .maybeSingle(),'''
          if old not in text: raise SystemExit('merchant load marker not found')
          text = text.replace(old,new,1)
          old = '''          from("merchant_subscriptions")\n            .select("*")\n            .eq("merchant_id", member.merchant_id)\n            .maybeSingle(),\n        ]);\n        if (merchantRes.error || !merchantRes.data)\n          throw merchantRes.error ?? new Error("Estabelecimento não encontrado.");\n        setMerchant(merchantRes.data);\n        setSubscription(subscriptionRes.data ?? null);\n        setDocuments(docsRes.data ?? []);\n        setSettingsDraft({\n          name: String(merchantRes.data.name ?? ""),\n          description: String(merchantRes.data.description ?? ""),\n          contactPhone: String(merchantRes.data.contact_phone ?? ""),\n          contactEmail: String(merchantRes.data.contact_email ?? ""),\n          addressLine: String(merchantRes.data.address_line ?? ""),\n          neighborhood: String(merchantRes.data.neighborhood ?? ""),\n          deliveryFee: String(merchantRes.data.delivery_fee ?? 0),\n          minimumOrder: String(merchantRes.data.minimum_order ?? 0),\n          minMinutes: String(merchantRes.data.delivery_min_minutes ?? ""),\n          maxMinutes: String(merchantRes.data.delivery_max_minutes ?? ""),\n          temporarilyClosed: Boolean(merchantRes.data.temporarily_closed),\n        });'''
          new = '''          from("merchant_subscriptions")\n            .select("*")\n            .eq("merchant_id", member.merchant_id)\n            .maybeSingle(),\n          rpc("get_authorized_merchant_private_data", { _merchant_id: member.merchant_id }),\n        ]);\n        if (merchantRes.error || !merchantRes.data)\n          throw merchantRes.error ?? new Error("Estabelecimento não encontrado.");\n        if (privateRes.error) throw privateRes.error;\n        const privateMerchant = Array.isArray(privateRes.data) ? privateRes.data[0] : null;\n        const merchantData = { ...merchantRes.data, ...(privateMerchant ?? {}) };\n        setMerchant(merchantData);\n        setSubscription(subscriptionRes.data ?? null);\n        setDocuments(docsRes.data ?? []);\n        setSettingsDraft({\n          name: String(merchantData.name ?? ""),\n          description: String(merchantData.description ?? ""),\n          contactPhone: String(merchantData.contact_phone ?? ""),\n          contactEmail: String(merchantData.contact_email ?? ""),\n          addressLine: String(merchantData.address_line ?? ""),\n          neighborhood: String(merchantData.neighborhood ?? ""),\n          deliveryFee: String(merchantData.delivery_fee ?? 0),\n          minimumOrder: String(merchantData.minimum_order ?? 0),\n          minMinutes: String(merchantData.delivery_min_minutes ?? ""),\n          maxMinutes: String(merchantData.delivery_max_minutes ?? ""),\n          temporarilyClosed: Boolean(merchantData.temporarily_closed),\n        });'''
          if old not in text: raise SystemExit('merchant private merge marker not found')
          text = text.replace(old,new,1)
          text = text.replace(
              '''        const periodEnd = subscriptionRes.data?.current_period_end;\n        const subscriptionAllowed = Boolean(\n          periodEnd && new Date(periodEnd).getTime() > Date.now(),\n        );\n''',
              '',
              1,
          )
          merchant.write_text(text)

          admin = Path('src/routes/admin.tsx')
          text = admin.read_text()
          old = '''        from("merchants")\n          .select("*, merchant_documents(*), merchant_categories(name)")'''
          new = f'''        from("merchants")\n          .select("{safe}, merchant_documents(*), merchant_categories(name)")'''
          if old not in text: raise SystemExit('admin merchant wildcard marker not found')
          text = text.replace(old,new,1)
          old = '''        from("admin_audit_logs").select("*").order("created_at", { ascending: false }).limit(100),\n      ]);'''
          new = '''        from("admin_audit_logs").select("*").order("created_at", { ascending: false }).limit(100),\n        rpc("get_authorized_merchant_private_data", { _merchant_id: null }),\n      ]);'''
          if old not in text: raise SystemExit('admin private rpc marker not found')
          text = text.replace(old,new,1)
          old = '''      setProfiles(checks[0].data ?? []);\n      setRoles(checks[1].data ?? []);\n      setMerchants(checks[2].data ?? []);'''
          new = '''      setProfiles(checks[0].data ?? []);\n      setRoles(checks[1].data ?? []);\n      const privateMerchantById = new Map(\n        (checks[14].data ?? []).map((row: any) => [row.merchant_id, row]),\n      );\n      setMerchants(\n        (checks[2].data ?? []).map((row: any) => ({\n          ...row,\n          ...(privateMerchantById.get(row.id) ?? {}),\n        })),\n      );'''
          if old not in text: raise SystemExit('admin merchant merge marker not found')
          text = text.replace(old,new,1)
          admin.write_text(text)
          PY
      - name: Format and verify
        run: |
          bunx prettier --write src/lib/catalog.ts src/lib/orders.ts src/routes/merchant.tsx src/routes/admin.tsx
          bun run typecheck
          bun run test
          bun run build
          bun run lint
          bun run format:check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog.ts src/lib/orders.ts src/routes/merchant.tsx src/routes/admin.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): isolate merchant private data"
          git push
