name: Wire Asaas Checkout CPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wire-asaas-checkout-cpf.yml"

permissions:
  contents: write

jobs:
  wire:
    if: "github.event.head_commit.message != 'feat(customer): wire Asaas PIX provider and CPF'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Wire checkout provider and CPF
        run: |
          node <<'NODE'
          const fs = require('fs');

          {
            const path = 'src/routes/checkout.tsx';
            let text = fs.readFileSync(path, 'utf8');
            const oldBlock = `      const { data: pixResponse, error: pixError } = await supabase.functions.invoke(\n        "create-pix-charge",\n        {\n          body: { orderId },\n        },\n      );`;
            const newBlock = `      const { data: providerSetting } = await (supabase.from as any)("platform_settings")\n        .select("value")\n        .eq("key", "order_payment_provider")\n        .maybeSingle();\n      const configuredProvider =\n        typeof providerSetting?.value === "string"\n          ? providerSetting.value.trim().toLowerCase()\n          : "mercadopago";\n      const pixFunction =\n        configuredProvider === "asaas" ? "create-asaas-pix-charge" : "create-pix-charge";\n      const { data: pixResponse, error: pixError } = await supabase.functions.invoke(pixFunction, {\n        body: { orderId },\n      });`;
            if (!text.includes(newBlock)) {
              if (!text.includes(oldBlock)) throw new Error('Checkout PIX invoke anchor not found');
              text = text.replace(oldBlock, newBlock);
            }
            text = text.replace(
              'throw new Error("O Mercado Pago não retornou os dados completos do PIX.");',
              'throw new Error("O provedor de pagamento não retornou os dados completos do PIX.");',
            );
            fs.writeFileSync(path, text);
          }

          {
            const path = 'src/routes/perfil/dados-pessoais.tsx';
            let text = fs.readFileSync(path, 'utf8');
            text = text.replace(
              '  phone: string;\n  email: string;',
              '  phone: string;\n  cpf: string;\n  email: string;',
            );
            text = text.replace(
              '    phone: "",\n    email: "",',
              '    phone: "",\n    cpf: "",\n    email: "",',
            );
            text = text.replace(
              '.select("full_name,phone,birth_date,avatar_url")',
              '.select("full_name,phone,cpf,birth_date,avatar_url")',
            );
            text = text.replace(
              '            phone: data?.phone || "",\n            email:',
              '            phone: data?.phone || "",\n            cpf: data?.cpf || "",\n            email:',
            );

            const validationNeedle = `    const requestedEmail = profile.email.trim().toLowerCase();\n    if (!emailPattern.test(requestedEmail)) {`;
            const validationReplacement = `    const normalizedCpf = profile.cpf.replace(/\\D/g, "");\n    if (normalizedCpf.length !== 11) {\n      toast.error("Informe um CPF válido com 11 dígitos.");\n      return;\n    }\n\n    const requestedEmail = profile.email.trim().toLowerCase();\n    if (!emailPattern.test(requestedEmail)) {`;
            if (!text.includes('const normalizedCpf = profile.cpf.replace')) {
              if (!text.includes(validationNeedle)) throw new Error('CPF validation anchor not found');
              text = text.replace(validationNeedle, validationReplacement);
            }

            text = text.replace(
              '          phone: profile.phone.trim() || null,\n          birth_date:',
              '          phone: profile.phone.trim() || null,\n          cpf: normalizedCpf,\n          birth_date:',
            );

            const phoneField = `                <Field label="Telefone" icon={Phone}>\n                  <input\n                    type="tel"\n                    value={profile.phone}\n                    onChange={(event) =>\n                      setProfile((current) => ({ ...current, phone: event.target.value }))\n                    }\n                    className="profile-input"\n                    placeholder="(00) 00000-0000"\n                    autoComplete="tel"\n                  />\n                </Field>\n`;
            const cpfField = `${phoneField}\n                <Field label="CPF" icon={User}>\n                  <input\n                    type="text"\n                    inputMode="numeric"\n                    value={profile.cpf}\n                    onChange={(event) =>\n                      setProfile((current) => ({ ...current, cpf: event.target.value }))\n                    }\n                    className="profile-input"\n                    placeholder="000.000.000-00"\n                    autoComplete="off"\n                    maxLength={14}\n                    required\n                  />\n                </Field>\n`;
            if (!text.includes('<Field label="CPF"')) {
              if (!text.includes(phoneField)) throw new Error('CPF UI anchor not found');
              text = text.replace(phoneField, cpfField);
            }
            fs.writeFileSync(path, text);
          }
          NODE
          bunx prettier --write src/routes/checkout.tsx src/routes/perfil/dados-pessoais.tsx
      - name: Commit customer wiring
        run: |
          if git diff --quiet; then
            echo "No checkout/CPF changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx src/routes/perfil/dados-pessoais.tsx
          git commit -m "feat(customer): wire Asaas PIX provider and CPF"
          git push origin main
