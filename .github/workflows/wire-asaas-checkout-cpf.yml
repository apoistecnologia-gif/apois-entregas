name: Wire Asaas Checkout CPF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wire-asaas-checkout-cpf.yml"

permissions:
  contents: write

jobs:
  wire:
    if: "github.event.head_commit.message != 'fix(customer): use safe payment provider selector'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Use safe provider selector
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/routes/checkout.tsx';
          let text = fs.readFileSync(path, 'utf8');
          const oldBlock = `      const { data: providerSetting } = await (supabase.from as any)("platform_settings")\n        .select("value")\n        .eq("key", "order_payment_provider")\n        .maybeSingle();\n      const configuredProvider =\n        typeof providerSetting?.value === "string"\n          ? providerSetting.value.trim().toLowerCase()\n          : "mercadopago";`;
          const newBlock = `      const { data: providerSetting } = await (supabase.rpc as any)(\n        "get_order_payment_provider",\n      );\n      const configuredProvider =\n        typeof providerSetting === "string" ? providerSetting.trim().toLowerCase() : "mercadopago";`;
          if (!text.includes(newBlock)) {
            if (!text.includes(oldBlock)) throw new Error('Payment provider selector anchor not found');
            text = text.replace(oldBlock, newBlock);
          }
          fs.writeFileSync(path, text);
          NODE
          bunx prettier --write src/routes/checkout.tsx
      - name: Commit safe selector
        run: |
          if git diff --quiet; then
            echo "No payment provider selector changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx
          git commit -m "fix(customer): use safe payment provider selector"
          git push origin main
