name: One-time product root routing fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-product-root-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Remove SSR redirect from shared root
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/index.tsx')
          text = path.read_text()
          text = text.replace(
            'import { createFileRoute, redirect, useNavigate } from "@tanstack/react-router";',
            'import { createFileRoute, useNavigate } from "@tanstack/react-router";',
            1,
          )
          text = text.replace(
            'import { ArrowRight, Bike, MapPin, PackageCheck, Store } from "lucide-react";\n',
            'import { ArrowRight, Bike, MapPin, PackageCheck, Store } from "lucide-react";\nimport { useEffect } from "react";\n',
            1,
          )
          block = '''  beforeLoad: () => {
    const landingRoute = getProductLandingRoute();
    if (landingRoute !== "/") throw redirect({ to: landingRoute });
  },
'''
          if block not in text:
            raise SystemExit('root beforeLoad redirect block not found')
          text = text.replace(block, '', 1)
          marker = 'function Index() {\n  const navigate = useNavigate();\n'
          replacement = '''function Index() {
  const navigate = useNavigate();
  const landingRoute = getProductLandingRoute();

  useEffect(() => {
    if (landingRoute !== "/") {
      void navigate({ to: landingRoute, replace: true });
    }
  }, [landingRoute, navigate]);

  if (landingRoute !== "/") {
    return (
      <div className="flex min-h-dvh items-center justify-center bg-black text-sm text-zinc-500">
        Abrindo o produto correto…
      </div>
    );
  }
'''
          if marker not in text:
            raise SystemExit('Index marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - run: bunx prettier --write src/routes/index.tsx
      - run: bun run typecheck
      - name: Commit root routing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "fix(routing): keep product roots HTTP-safe"
          git push origin HEAD:main
