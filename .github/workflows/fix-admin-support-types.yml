name: Fix admin support callback types

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-support-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fix callback return types
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/routes/admin.tsx')
          text = path.read_text(encoding='utf-8')

          def patch_function(text: str, name: str) -> str:
              start = text.index(f'  const {name} = async ')
              end = text.index('\n  const ', start + 10)
              block = text[start:end]
              old = '    if (error) return toast.error(error.message);'
              if old not in block:
                  raise SystemExit(f'expected error return not found in {name}')
              block = block.replace(
                  old,
                  '    if (error) {\n      toast.error(error.message);\n      return;\n    }',
                  1,
              )
              return text[:start] + block + text[end:]

          text = patch_function(text, 'updateTicket')
          text = patch_function(text, 'replyTicket')
          path.write_text(text, encoding='utf-8')
          PY
          bunx prettier src/routes/admin.tsx --write
      - name: Verify types
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-admin-support-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx .github/workflows/fix-admin-support-types.yml
          git commit -m "fix(admin): normalize support callback return types"
          git push
