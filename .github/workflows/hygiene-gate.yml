name: Repository hygiene gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hygiene-gate.yml

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Clean temporary workflows and dead local-order storage
        run: |
          rm -f .github/workflows/continuation-gate.yml
          rm -f .github/workflows/full-green-gate.yml
          rm -f .github/workflows/merchant-settings-integration.yml
          rm -f .github/workflows/customer-live-tracking.yml
          rm -f .github/workflows/courier-live-route-integration.yml
          rm -f .github/workflows/customer-support-conversation-link.yml
          rm -f .github/workflows/courier-navigation-history.yml
          rm -f .github/workflows/courier-metrics-ui.yml
          rm -f .github/workflows/admin-support-conversations.yml
          rm -f .github/workflows/admin-operational-audit-fix.yml

          if [ -f src/lib/local-orders.ts ]; then
            if ! grep -R --exclude=local-orders.ts -E '@/lib/local-orders|from ["'"''].*local-orders' src >/dev/null; then
              rm src/lib/local-orders.ts
            fi
          fi
      - name: Reject retired backend references
        run: |
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'hampouulutorqkgpnhzc' .; then
            echo 'Retired Lovable Supabase reference detected.'
            exit 1
          fi
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git 'MOCK_MERCHANTS' src; then
            echo 'Legacy merchant mock detected.'
            exit 1
          fi
      - name: Verify
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit hygiene changes and remove gate
        run: |
          rm -f .github/workflows/hygiene-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove temporary workflows and dead legacy storage"
          git push
