name: Format Helper

on:
  push:
    paths:
      - ".github/workflows/format-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format billing files
        run: bunx prettier --write src/components/MerchantSubscriptionGate.tsx supabase/functions/merchant-subscription/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-billing-files
          path: |
            src/components/MerchantSubscriptionGate.tsx
            supabase/functions/merchant-subscription/index.ts
          if-no-files-found: error
