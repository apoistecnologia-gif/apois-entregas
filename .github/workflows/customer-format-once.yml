name: Customer format once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format customer closure files
        run: bunx prettier --write src/routes/buscar.tsx supabase/functions/openpix-webhook/index.ts supabase/functions/process-refund/index.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routes/buscar.tsx supabase/functions/openpix-webhook/index.ts supabase/functions/process-refund/index.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/buscar.tsx supabase/functions/openpix-webhook/index.ts supabase/functions/process-refund/index.ts
          git commit -m "style(customer): format customer closure changes"
          git push origin HEAD:main
