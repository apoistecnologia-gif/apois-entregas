name: Format CI blockers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-ci-blockers.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format CI blockers
        run: bunx prettier --write src/routes/__root.tsx src/routes/admin.tsx src/server.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/__root.tsx src/routes/admin.tsx src/server.ts
          git commit -m "style: format CI blockers"
          git push origin HEAD:main
