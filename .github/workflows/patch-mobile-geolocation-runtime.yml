name: Patch Android Geolocation Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mobile-geolocation-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile Android runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mobile-android.yml')
          text = path.read_text(encoding='utf-8')
          old = 'npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2 @capacitor/push-notifications@8.1.2'
          new = old + ' @capacitor/geolocation@8.2.0'
          if new not in text:
              if old not in text:
                  raise SystemExit('Android runtime install command not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mobile-android.yml
          if git diff --cached --quiet; then
            echo "Runtime already patched"
            exit 0
          fi
          git commit -m "fix(android): install native geolocation plugin"
          git push origin HEAD:main
