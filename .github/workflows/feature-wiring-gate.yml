name: Feature wiring verification gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feature-wiring-gate.yml

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Ensure customer and merchant feature wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          # Customer support conversation link.
          help_path = Path("src/routes/perfil/ajuda.tsx")
          help_text = help_path.read_text(encoding="utf-8")
          if "Ver conversa" not in help_text:
              anchor = '''                  <p className="mt-3 line-clamp-2 text-xs leading-relaxed text-zinc-500">
                    {ticket.description}
                  </p>'''
              if anchor not in help_text:
                  raise SystemExit("help ticket card anchor not found")
              help_text = help_text.replace(
                  anchor,
                  anchor
                  + '''
                  <button
                    type="button"
                    onClick={() => navigate({ to: `/perfil/ajuda/chamado/${ticket.id}` })}
                    className="mt-3 text-xs font-black text-primary"
                  >
                    Ver conversa
                  </button>''',
                  1,
              )
              help_path.write_text(help_text, encoding="utf-8")

          # Customer live tracking in order details.
          order_path = Path("src/routes/pedido/$orderId/index.tsx")
          order_text = order_path.read_text(encoding="utf-8")
          import_line = 'import { CustomerDeliveryMap } from "@/components/CustomerDeliveryMap";\n'
          if import_line not in order_text:
              anchor = 'import { toast } from "sonner";\n'
              if anchor not in order_text:
                  raise SystemExit("order import anchor not found")
              order_text = order_text.replace(anchor, anchor + import_line, 1)
          old_select = '.select("*, merchants (*), order_items (*)")'
          if old_select in order_text:
              order_text = order_text.replace(
                  old_select,
                  '.select("*, merchants (*), order_items (*), delivery_jobs(id,courier_id,status,delivery_latitude,delivery_longitude)")',
                  1,
              )
          if "<CustomerDeliveryMap" not in order_text:
              anchor = '''        {canCancel ? (
          <button'''
              if anchor not in order_text:
                  raise SystemExit("order tracking render anchor not found")
              order_text = order_text.replace(
                  anchor,
                  '        <CustomerDeliveryMap job={order.delivery_jobs?.[0] ?? null} />\n\n' + anchor,
                  1,
              )
          order_path.write_text(order_text, encoding="utf-8")

          # Merchant settings shortcut inside WorkspaceShell children.
          merchant_path = Path("src/routes/merchant.tsx")
          merchant_text = merchant_path.read_text(encoding="utf-8")
          if 'aria-label="Configurações do estabelecimento"' not in merchant_text:
              start = merchant_text.find("<WorkspaceShell")
              if start < 0:
                  raise SystemExit("WorkspaceShell not found")
              end = merchant_text.find(">", start)
              if end < 0:
                  raise SystemExit("WorkspaceShell opening tag incomplete")
              insertion = '''
        <button
          type="button"
          onClick={() => window.location.assign("/configuracoes-estabelecimento")}
          className="fixed right-4 top-4 z-[80] rounded-xl border border-primary/20 bg-black/90 px-3 py-2 text-xs font-black text-primary shadow-xl backdrop-blur lg:right-6 lg:top-5"
          aria-label="Configurações do estabelecimento"
        >
          Configurações
        </button>'''
              merchant_text = merchant_text[: end + 1] + insertion + merchant_text[end + 1 :]
              merchant_path.write_text(merchant_text, encoding="utf-8")
          PY
      - name: Ensure courier live route wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/courier.tsx")
          text = path.read_text(encoding="utf-8")

          route_import = 'import { CourierRouteMap, type CourierPosition } from "@/components/CourierRouteMap";\n'
          if route_import not in text:
              anchor = 'import { clearPayoutAttemptKey, getPayoutAttemptKey } from "@/lib/payout-attempt";\n'
              if anchor not in text:
                  raise SystemExit("courier import anchor not found")
              text = text.replace(anchor, anchor + route_import, 1)

          if 'const [currentPosition, setCurrentPosition]' not in text:
              anchor = '  const [availability, setAvailability] = useState<any>(null);\n'
              if anchor not in text:
                  raise SystemExit("courier state anchor not found")
              text = text.replace(
                  anchor,
                  anchor
                  + '  const [currentPosition, setCurrentPosition] = useState<CourierPosition | null>(null);\n'
                  + '  const [locationError, setLocationError] = useState<string | null>(null);\n',
                  1,
              )

          send_anchor = '  const sendLocation = useCallback((position: GeolocationPosition) => {\n'
          if 'setCurrentPosition(nextPosition);' not in text:
              if send_anchor not in text:
                  raise SystemExit("sendLocation anchor not found")
              body = '''  const sendLocation = useCallback((position: GeolocationPosition) => {
    const nextPosition: CourierPosition = {
      lat: position.coords.latitude,
      lng: position.coords.longitude,
      accuracy: Number.isFinite(position.coords.accuracy) ? position.coords.accuracy : null,
      heading:
        position.coords.heading !== null && Number.isFinite(position.coords.heading)
          ? position.coords.heading
          : null,
      speed:
        position.coords.speed !== null && Number.isFinite(position.coords.speed)
          ? position.coords.speed
          : null,
      recordedAt: Date.now(),
    };
    setCurrentPosition(nextPosition);
    setLocationError(null);
'''
              text = text.replace(send_anchor, body, 1)

          if 'currentPosition={currentPosition}' not in text:
              anchor = '''          <ActiveDelivery
            job={activeJob}'''
              if anchor not in text:
                  raise SystemExit("ActiveDelivery invocation not found")
              text = text.replace(anchor, anchor + '\n            currentPosition={currentPosition}', 1)

          sig = '''function ActiveDelivery({
  job,
  busy,'''
          if sig in text:
              text = text.replace(
                  sig,
                  '''function ActiveDelivery({
  job,
  currentPosition,
  busy,''',
                  1,
              )

          if '<CourierRouteMap job={job} currentPosition={currentPosition} />' not in text:
              anchor = '''      <div className="mt-5 space-y-3">
        <AddressRow'''
              if anchor not in text:
                  raise SystemExit("ActiveDelivery route map anchor not found")
              text = text.replace(
                  anchor,
                  '      <CourierRouteMap job={job} currentPosition={currentPosition} />\n' + anchor,
                  1,
              )

          path.write_text(text, encoding="utf-8")

          duplicate = Path("src/components/CourierLocationTracker.tsx")
          if duplicate.exists():
              duplicate.unlink()
          PY
      - name: Format
        run: |
          bunx prettier src/routes/merchant.tsx src/routes/configuracoes-estabelecimento.tsx src/routes/courier.tsx src/components/CourierRouteMap.tsx src/components/CustomerDeliveryMap.tsx 'src/routes/pedido/$orderId/index.tsx' src/routes/perfil/ajuda.tsx 'src/routes/perfil/ajuda/chamado/$ticketId.tsx' --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit verified wiring and cleanup
        run: |
          rm -f .github/workflows/feature-wiring-gate.yml
          rm -f .github/workflows/current-green-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: wire customer tracking support and merchant settings"
          git push
