name: One-time courier map and footer navigation fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-courier-map-nav-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/one-time-courier-map-nav-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx src/components/CourierPanels.tsx src/components/CourierRouteMap.tsx
          git commit -m "fix(courier): show live map and keep bottom navigation"
          git push origin HEAD:main
