name: Patch Customer Local QR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-customer-local-qr.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Install existing dependencies
        run: bun install --frozen-lockfile
      - name: Add QR renderer
        run: bun add qrcode @types/qrcode
      - name: Apply customer QR fix
        run: python .github/scripts/patch-customer-local-qr.py
      - name: Format and validate
        run: |
          bunx prettier --write src/routes/checkout.tsx package.json bun.lock
          bun run typecheck
          bun run lint
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx package.json bun.lock
          git commit -m "fix(customer): render Pix QR locally from brCode"
          git pull --rebase origin main
          git push origin HEAD:main
