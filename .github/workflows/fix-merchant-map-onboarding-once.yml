name: Fix merchant map onboarding once

on:
  push:
    paths:
      - ".github/workflows/fix-merchant-map-onboarding-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch merchant location flow
        run: python scripts/fix-merchant-map-onboarding.py
      - name: Commit fix and cleanup helper files
        run: |
          rm .github/workflows/fix-merchant-map-onboarding-once.yml
          rm scripts/fix-merchant-map-onboarding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx .github/workflows/fix-merchant-map-onboarding-once.yml scripts/fix-merchant-map-onboarding.py
          git commit -m "fix(merchant): confirm store location only through map"
          git push origin HEAD:main
      - name: Dispatch merchant production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merchant-web-build.yml --repo "$GITHUB_REPOSITORY" --ref main
