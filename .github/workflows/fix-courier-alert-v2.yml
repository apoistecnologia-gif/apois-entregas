name: Fix courier alert v2

on:
  push:
    paths:
      - ".github/workflows/fix-courier-alert-v2.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Harden courier foreground alert
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/CourierOfferOverlay.tsx")
          s = path.read_text(encoding="utf-8")

          old = "    const context = audioContextRef.current;\n    if (!context || !audioUnlockedRef.current) return;\n    if (context.state === \"suspended\") void context.resume();\n\n    const startAt = context.currentTime + 0.03;"
          new = "    let context = audioContextRef.current;\n    if (!context) {\n      const audioWindow = window as WindowWithWebkitAudioContext;\n      const AudioContextCtor = audioWindow.AudioContext || audioWindow.webkitAudioContext;\n      if (!AudioContextCtor) return;\n      context = new AudioContextCtor();\n      audioContextRef.current = context;\n    }\n    if (context.state === \"suspended\") {\n      void context.resume().then(() => {\n        audioUnlockedRef.current = context?.state === \"running\";\n      });\n      return;\n    }\n    if (context.state !== \"running\") return;\n    audioUnlockedRef.current = true;\n\n    const startAt = context.currentTime + 0.03;"
          if old not in s:
              raise SystemExit("pulse alert block not found")
          s = s.replace(old, new, 1)

          old = "    const poll = window.setInterval(refresh, 2500);\n\n    return () => {\n      window.clearInterval(poll);\n      void supabase.removeChannel(offersChannel);\n      void supabase.removeChannel(availabilityChannel);\n    };"
          new = "    const poll = window.setInterval(refresh, 1000);\n    const onForeground = () => {\n      if (document.visibilityState === \"visible\") refresh();\n    };\n    window.addEventListener(\"focus\", refresh);\n    document.addEventListener(\"visibilitychange\", onForeground);\n\n    return () => {\n      window.clearInterval(poll);\n      window.removeEventListener(\"focus\", refresh);\n      document.removeEventListener(\"visibilitychange\", onForeground);\n      void supabase.removeChannel(offersChannel);\n      void supabase.removeChannel(availabilityChannel);\n    };"
          if old not in s:
              raise SystemExit("poll block not found")
          s = s.replace(old, new, 1)

          old = "  useEffect(() => {\n    stopAlert();\n    if (!offerId) return;\n    pulseAlert();\n    alertTimerRef.current = window.setInterval(pulseAlert, 2800);\n    return stopAlert;\n  }, [offerId, pulseAlert, stopAlert]);"
          new = "  useEffect(() => {\n    stopAlert();\n    if (!offerId) return;\n    void callRpc(\"ack_courier_offer_seen\", {\n      _offer_id: offerId,\n      _channel: \"courier_offer_overlay\",\n    });\n    pulseAlert();\n    window.setTimeout(pulseAlert, 220);\n    alertTimerRef.current = window.setInterval(pulseAlert, 2800);\n    return stopAlert;\n  }, [offerId, pulseAlert, stopAlert]);"
          if old not in s:
              raise SystemExit("offer alert effect not found")
          s = s.replace(old, new, 1)
          path.write_text(s, encoding="utf-8")

          wf = Path(".github/workflows/mobile-android.yml")
          w = wf.read_text(encoding="utf-8")
          old = "              '    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\\n'\n              '    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />\\n'"
          new = "              '    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\\n'\n              '    <uses-permission android:name=\"android.permission.VIBRATE\" />\\n'\n              '    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />\\n'"
          if old not in w:
              raise SystemExit("manifest permission block not found")
          w = w.replace(old, new, 1)

          old = "          if not package_path.exists():\n              raise SystemExit(f\"Expected Android package directory not found: {package_path}\")\n"
          new = old + "\n          if product == \"courier\":\n              main_activity = package_path / \"MainActivity.java\"\n              java_text = (\n                  \"package \" + expected_package + \";\\n\\n\"\n                  \"import android.os.Bundle;\\n\"\n                  \"import com.getcapacitor.BridgeActivity;\\n\\n\"\n                  \"public class MainActivity extends BridgeActivity {\\n\"\n                  \"    @Override\\n\"\n                  \"    protected void onCreate(Bundle savedInstanceState) {\\n\"\n                  \"        super.onCreate(savedInstanceState);\\n\"\n                  \"        if (getBridge() != null && getBridge().getWebView() != null) {\\n\"\n                  \"            getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);\\n\"\n                  \"        }\\n\"\n                  \"    }\\n\"\n                  \"}\\n\"\n              )\n              main_activity.write_text(java_text, encoding=\"utf-8\")\n"
          if old not in w:
              raise SystemExit("package validation block not found")
          w = w.replace(old, new, 1)

          old = "          grep -q 'android.permission.ACCESS_FINE_LOCATION' \"$MANIFEST\"\n          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' \"$MANIFEST\""
          new = "          grep -q 'android.permission.ACCESS_FINE_LOCATION' \"$MANIFEST\"\n          grep -q 'android.permission.VIBRATE' \"$MANIFEST\"\n          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' \"$MANIFEST\""
          if old not in w:
              raise SystemExit("manifest validation block not found")
          w = w.replace(old, new, 1)
          wf.write_text(w, encoding="utf-8")
          PY

      - uses: oven-sh/setup-bun@v2

      - name: Validate courier alert fix
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/components/CourierOfferOverlay.tsx
          bun run typecheck
          bun run build:courier

      - name: Commit fix and rebuild courier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-courier-alert-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierOfferOverlay.tsx .github/workflows/mobile-android.yml .github/workflows/fix-courier-alert-v2.yml
          git commit -m "fix(courier): make incoming delivery alert reliable"
          git push origin HEAD:main
          gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f product=courier
