name: Payment Hardening Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/payment-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Harden payment credential selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          webhook_path = Path("supabase/functions/mercadopago-webhook/index.ts")
          webhook = webhook_path.read_text()
          webhook = replace_once(
              webhook,
              '  const accessToken = Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN");\n',
              '  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n'
              '  const accessTokenTest =\n'
              '    Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_TEST")?.trim() ||\n'
              '    Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN")?.trim() ||\n'
              '    null;\n'
              '  const accessTokenProduction =\n'
              '    Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim() || null;\n',
              "webhook access token env",
          )
          webhook = replace_once(
              webhook,
              '  if (!supabaseUrl || !serviceRoleKey || !accessToken || webhookSecrets.length === 0) {\n',
              '  if (!supabaseUrl || !serviceRoleKey || webhookSecrets.length === 0) {\n',
              "webhook environment guard",
          )
          webhook = replace_once(
              webhook,
              '  const signatureValid = await validSignature(request, dataId, webhookSecrets);\n'
              '  const sandboxVerifiedByProvider = !signatureValid && isSandboxOrderId(dataId);\n',
              '  const sandboxOrder = isSandboxOrderId(dataId);\n'
              '  const signatureSecrets = sandboxOrder\n'
              '    ? Array.from(new Set([webhookSecretTest, webhookSecretLegacy, webhookSecretProduction].filter((value): value is string => Boolean(value))))\n'
              '    : Array.from(new Set([webhookSecretProduction, webhookSecretLegacy].filter((value): value is string => Boolean(value))));\n'
              '  const signatureValid = await validSignature(request, dataId, signatureSecrets);\n'
              '  const sandboxVerifiedByProvider =\n'
              '    !signatureValid && environment !== "production" && sandboxOrder;\n'
              '  const accessToken = sandboxOrder ? accessTokenTest : accessTokenProduction;\n'
              '  if (!accessToken) {\n'
              '    console.error("mercadopago-webhook provider credential missing", { sandboxOrder });\n'
              '    return response(500, { error: "provider_configuration" });\n'
              '  }\n',
              "webhook verification block",
          )
          webhook = replace_once(
              webhook,
              '      sandbox: false,\n',
              '      sandbox: sandboxOrder,\n',
              "webhook log sandbox",
          )
          webhook_path.write_text(webhook)

          refund_path = Path("supabase/functions/process-refund/index.ts")
          refund = refund_path.read_text()
          refund = replace_once(
              refund,
              'function response(status: number, body: JsonRecord) {\n'
              '  return new Response(JSON.stringify(body), { status, headers: jsonHeaders });\n'
              '}\n',
              'function response(status: number, body: JsonRecord) {\n'
              '  return new Response(JSON.stringify(body), { status, headers: jsonHeaders });\n'
              '}\n\n'
              'function accessTokenForOrder(providerOrderId: string): string | null {\n'
              '  if (/^ORDTST/i.test(providerOrderId)) {\n'
              '    return (\n'
              '      Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_TEST")?.trim() ||\n'
              '      Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN")?.trim() ||\n'
              '      null\n'
              '    );\n'
              '  }\n'
              '  return Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim() || null;\n'
              '}\n',
              "refund helper",
          )
          refund = replace_once(
              refund,
              '  const accessToken = Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN");\n',
              '',
              "refund legacy token",
          )
          refund = replace_once(
              refund,
              '  if (!accessToken) {\n'
              '    return response(503, {\n'
              '      error: "Estornos ainda não estão habilitados.",\n'
              '      code: "PAYMENT_PROVIDER_NOT_CONFIGURED",\n'
              '    });\n'
              '  }\n\n',
              '',
              "refund early token guard",
          )
          refund = replace_once(
              refund,
              '  if (Math.round(Number(payment.amount) * 100) !== Math.round(Number(refund.amount) * 100)) {\n',
              '  const accessToken = accessTokenForOrder(payment.provider_charge_id);\n'
              '  if (!accessToken) {\n'
              '    return response(503, {\n'
              '      error: "Estornos ainda não estão habilitados para este ambiente.",\n'
              '      code: "PAYMENT_PROVIDER_NOT_CONFIGURED",\n'
              '    });\n'
              '  }\n\n'
              '  if (Math.round(Number(payment.amount) * 100) !== Math.round(Number(refund.amount) * 100)) {\n',
              "refund token selection",
          )
          refund = replace_once(
              refund,
              '  let { response: currentProviderResponse, body: providerPayload } = await readProviderOrder();\n',
              '  const providerLookup = await readProviderOrder();\n'
              '  const currentProviderResponse = providerLookup.response;\n'
              '  let providerPayload = providerLookup.body;\n',
              "refund provider lookup typing",
          )
          refund_path.write_text(refund)

          sync_path = Path("supabase/functions/sync-payment-status/index.ts")
          sync = sync_path.read_text()
          sync = replace_once(
              sync,
              '  return (\n'
              '    Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim() ||\n'
              '    Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN")?.trim() ||\n'
              '    null\n'
              '  );\n',
              '  return Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim() || null;\n',
              "sync production token",
          )
          sync_path.write_text(sync)
          PY

      - name: Format hardened files
        run: npx --yes prettier@3.6.2 --write supabase/functions/mercadopago-webhook/index.ts supabase/functions/process-refund/index.ts supabase/functions/sync-payment-status/index.ts

      - name: Remove one-shot workflow
        run: rm .github/workflows/payment-hardening-once.yml

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security(payments): isolate test and production credentials"
          git push origin HEAD:main
