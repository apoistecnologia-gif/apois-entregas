name: Integrate merchant split and special hours

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-special-hours.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire merchant schedule exceptions
        run: |
          python <<'PY'
          from pathlib import Path

          # Merchant panel
          path = Path('src/routes/merchant.tsx')
          text = path.read_text(encoding='utf-8')
          state_anchor = '  const [hours, setHours] = useState<any[]>([]);\n'
          if 'const [specialHours, setSpecialHours]' not in text:
              text = text.replace(
                  state_anchor,
                  state_anchor + '  const [specialHours, setSpecialHours] = useState<any[]>([]);\n',
                  1,
              )

          settings_end = '''  const [settingsDraft, setSettingsDraft] = useState({\n    deliveryFee: "",\n    minimumOrder: "",\n    minMinutes: "",\n    maxMinutes: "",\n    temporarilyClosed: false,\n  });\n'''
          special_state = '''  const [specialDraft, setSpecialDraft] = useState({\n    serviceDate: "",\n    note: "",\n    isClosed: true,\n    opensAt: "08:00",\n    closesAt: "22:00",\n    secondEnabled: false,\n    secondOpensAt: "",\n    secondClosesAt: "",\n  });\n'''
          if special_state not in text:
              if settings_end not in text:
                  raise SystemExit('settings state anchor missing')
              text = text.replace(settings_end, settings_end + special_state, 1)

          old_destructure = '    const [ordersRes, categoriesRes, productsRes, hoursRes, walletRes, reviewsRes] =\n      await Promise.all(['
          new_destructure = '    const [ordersRes, categoriesRes, productsRes, hoursRes, walletRes, reviewsRes, specialHoursRes] =\n      await Promise.all(['
          if new_destructure not in text:
              if old_destructure not in text:
                  raise SystemExit('loadOperations destructuring anchor missing')
              text = text.replace(old_destructure, new_destructure, 1)

          reviews_query_end = '''        from("reviews")\n          .select("*")\n          .eq("merchant_id", merchantId)\n          .order("created_at", { ascending: false })\n          .limit(50),\n      ]);'''
          special_query_end = '''        from("reviews")\n          .select("*")\n          .eq("merchant_id", merchantId)\n          .order("created_at", { ascending: false })\n          .limit(50),\n        from("merchant_special_hours")\n          .select("*")\n          .eq("merchant_id", merchantId)\n          .gte("service_date", new Date().toISOString().slice(0, 10))\n          .order("service_date")\n          .limit(90),\n      ]);'''
          if special_query_end not in text:
              if reviews_query_end not in text:
                  raise SystemExit('reviews query anchor missing')
              text = text.replace(reviews_query_end, special_query_end, 1)

          set_hours_anchor = '    setHours(hoursRes.data ?? []);\n    setReviews(reviewsRes.data ?? []);\n'
          set_hours_new = '    setHours(hoursRes.data ?? []);\n    setReviews(reviewsRes.data ?? []);\n    setSpecialHours(specialHoursRes.data ?? []);\n'
          if set_hours_new not in text:
              if set_hours_anchor not in text:
                  raise SystemExit('setHours anchor missing')
              text = text.replace(set_hours_anchor, set_hours_new, 1)

          row_anchor = '''      closes_at: current?.closes_at ?? "22:00:00",\n      is_closed: current?.is_closed ?? false,\n      ...patch,'''
          row_new = '''      closes_at: current?.closes_at ?? "22:00:00",\n      second_opens_at: current?.second_opens_at ?? null,\n      second_closes_at: current?.second_closes_at ?? null,\n      is_closed: current?.is_closed ?? false,\n      ...patch,'''
          if row_new not in text:
              if row_anchor not in text:
                  raise SystemExit('saveHours row anchor missing')
              text = text.replace(row_anchor, row_new, 1)

          settings_fn_anchor = '  const saveSettings = async () => {\n'
          special_functions = '''  const saveSpecialHours = async (event: React.FormEvent) => {\n    event.preventDefault();\n    if (!merchant?.id || !specialDraft.serviceDate) {\n      toast.error("Informe a data especial.");\n      return;\n    }\n    if (!specialDraft.isClosed && (!specialDraft.opensAt || !specialDraft.closesAt)) {\n      toast.error("Informe abertura e fechamento da data especial.");\n      return;\n    }\n    if (\n      specialDraft.secondEnabled &&\n      (!specialDraft.secondOpensAt || !specialDraft.secondClosesAt)\n    ) {\n      toast.error("Complete o segundo horário ou desative o intervalo adicional.");\n      return;\n    }\n\n    setBusyAction("special-hours");\n    const closed = specialDraft.isClosed;\n    const { error } = await from("merchant_special_hours").upsert(\n      {\n        merchant_id: merchant.id,\n        service_date: specialDraft.serviceDate,\n        is_closed: closed,\n        opens_at: closed ? null : `${specialDraft.opensAt}:00`,\n        closes_at: closed ? null : `${specialDraft.closesAt}:00`,\n        second_opens_at:\n          closed || !specialDraft.secondEnabled ? null : `${specialDraft.secondOpensAt}:00`,\n        second_closes_at:\n          closed || !specialDraft.secondEnabled ? null : `${specialDraft.secondClosesAt}:00`,\n        note: specialDraft.note.trim() || null,\n        updated_at: new Date().toISOString(),\n      },\n      { onConflict: "merchant_id,service_date" },\n    );\n    setBusyAction(null);\n    if (error) return toast.error(error.message || "Não foi possível salvar a data especial.");\n    toast.success("Data especial salva.");\n    setSpecialDraft({\n      serviceDate: "",\n      note: "",\n      isClosed: true,\n      opensAt: "08:00",\n      closesAt: "22:00",\n      secondEnabled: false,\n      secondOpensAt: "",\n      secondClosesAt: "",\n    });\n    await loadOperations(merchant.id);\n  };\n\n  const deleteSpecialHours = async (row: any) => {\n    if (!merchant?.id || !window.confirm(`Remover a exceção de ${row.service_date}?`)) return;\n    const { error } = await from("merchant_special_hours")\n      .delete()\n      .eq("id", row.id)\n      .eq("merchant_id", merchant.id);\n    if (error) return toast.error(error.message || "Não foi possível remover a data especial.");\n    toast.success("Data especial removida.");\n    await loadOperations(merchant.id);\n  };\n\n'''
          if special_functions not in text:
              if settings_fn_anchor not in text:
                  raise SystemExit('saveSettings anchor missing')
              text = text.replace(settings_fn_anchor, special_functions + settings_fn_anchor, 1)

          hours_start = text.index('      {activeTab === "hours" && (')
          hours_end = text.index('      {activeTab === "promotions" && (', hours_start)
          new_hours = '''      {activeTab === "hours" && (\n        <div className="space-y-6">\n          <section className="rounded-2xl border border-zinc-900 bg-zinc-950 p-5">\n            <h2 className="font-black">Horários de funcionamento</h2>\n            <p className="mt-1 text-sm text-zinc-500">\n              Configure o expediente principal e, quando necessário, um segundo período no mesmo dia.\n            </p>\n            <div className="mt-5 space-y-3">\n              {week.map((label, weekday) => {\n                const row = hours.find((item) => Number(item.weekday) === weekday);\n                const closed = row?.is_closed ?? true;\n                const hasSecond = Boolean(row?.second_opens_at && row?.second_closes_at);\n                return (\n                  <div key={label} className="rounded-xl border border-zinc-900 bg-black p-3">\n                    <div className="flex flex-wrap items-center justify-between gap-3">\n                      <span className="text-sm font-bold">{label}</span>\n                      <button\n                        type="button"\n                        onClick={() =>\n                          void saveHours(\n                            weekday,\n                            closed\n                              ? {\n                                  is_closed: false,\n                                  opens_at: row?.opens_at ?? "08:00:00",\n                                  closes_at: row?.closes_at ?? "22:00:00",\n                                }\n                              : {\n                                  is_closed: true,\n                                  opens_at: null,\n                                  closes_at: null,\n                                  second_opens_at: null,\n                                  second_closes_at: null,\n                                },\n                          )\n                        }\n                        className={`rounded-lg px-3 py-2 text-xs font-black ${\n                          closed ? "bg-zinc-900 text-zinc-500" : "bg-emerald-500/15 text-emerald-400"\n                        }`}\n                      >\n                        {closed ? "Fechado" : "Aberto"}\n                      </button>\n                    </div>\n                    {!closed ? (\n                      <div className="mt-3 space-y-3">\n                        <div className="grid gap-2 sm:grid-cols-2">\n                          <label className="text-[10px] font-bold uppercase text-zinc-600">\n                            Abertura\n                            <input\n                              type="time"\n                              value={(row?.opens_at ?? "08:00").slice(0, 5)}\n                              onChange={(event) =>\n                                void saveHours(weekday, { opens_at: `${event.target.value}:00` })\n                              }\n                              className="mt-1 w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm"\n                            />\n                          </label>\n                          <label className="text-[10px] font-bold uppercase text-zinc-600">\n                            Fechamento\n                            <input\n                              type="time"\n                              value={(row?.closes_at ?? "22:00").slice(0, 5)}\n                              onChange={(event) =>\n                                void saveHours(weekday, { closes_at: `${event.target.value}:00` })\n                              }\n                              className="mt-1 w-full rounded-lg border border-zinc-800 bg-zinc-950 px-3 py-2 text-sm"\n                            />\n                          </label>\n                        </div>\n                        {hasSecond ? (\n                          <div className="grid gap-2 rounded-xl border border-primary/10 bg-primary/5 p-3 sm:grid-cols-[1fr_1fr_auto]">\n                            <label className="text-[10px] font-bold uppercase text-zinc-600">\n                              2ª abertura\n                              <input\n                                type="time"\n                                value={row.second_opens_at.slice(0, 5)}\n                                onChange={(event) =>\n                                  void saveHours(weekday, {\n                                    second_opens_at: `${event.target.value}:00`,\n                                  })\n                                }\n                                className="mt-1 w-full rounded-lg border border-zinc-800 bg-black px-3 py-2 text-sm"\n                              />\n                            </label>\n                            <label className="text-[10px] font-bold uppercase text-zinc-600">\n                              2º fechamento\n                              <input\n                                type="time"\n                                value={row.second_closes_at.slice(0, 5)}\n                                onChange={(event) =>\n                                  void saveHours(weekday, {\n                                    second_closes_at: `${event.target.value}:00`,\n                                  })\n                                }\n                                className="mt-1 w-full rounded-lg border border-zinc-800 bg-black px-3 py-2 text-sm"\n                              />\n                            </label>\n                            <button\n                              type="button"\n                              onClick={() =>\n                                void saveHours(weekday, {\n                                  second_opens_at: null,\n                                  second_closes_at: null,\n                                })\n                              }\n                              className="self-end rounded-lg border border-red-500/20 px-3 py-2 text-xs font-bold text-red-400"\n                            >\n                              Remover\n                            </button>\n                          </div>\n                        ) : (\n                          <button\n                            type="button"\n                            onClick={() =>\n                              void saveHours(weekday, {\n                                second_opens_at: "14:00:00",\n                                second_closes_at: "22:00:00",\n                              })\n                            }\n                            className="text-xs font-bold text-primary"\n                          >\n                            + Adicionar segundo período\n                          </button>\n                        )}\n                      </div>\n                    ) : null}\n                  </div>\n                );\n              })}\n            </div>\n          </section>\n\n          <div className="grid gap-6 lg:grid-cols-[360px_1fr]">\n            <form\n              onSubmit={saveSpecialHours}\n              className="space-y-3 rounded-2xl border border-zinc-900 bg-zinc-950 p-5"\n            >\n              <div>\n                <h2 className="font-black">Feriados e datas especiais</h2>\n                <p className="mt-1 text-xs text-zinc-500">\n                  Uma exceção por data substitui o horário semanal daquele dia.\n                </p>\n              </div>\n              <input\n                type="date"\n                required\n                min={new Date().toISOString().slice(0, 10)}\n                value={specialDraft.serviceDate}\n                onChange={(event) =>\n                  setSpecialDraft((current) => ({\n                    ...current,\n                    serviceDate: event.target.value,\n                  }))\n                }\n                className="w-full rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm"\n              />\n              <Field\n                value={specialDraft.note}\n                onChange={(value) => setSpecialDraft((current) => ({ ...current, note: value }))}\n                placeholder="Motivo (ex.: feriado municipal)"\n              />\n              <label className="flex items-center gap-2 rounded-xl border border-zinc-900 bg-black p-3 text-sm">\n                <input\n                  type="checkbox"\n                  checked={specialDraft.isClosed}\n                  onChange={(event) =>\n                    setSpecialDraft((current) => ({\n                      ...current,\n                      isClosed: event.target.checked,\n                    }))\n                  }\n                />\n                Fechado o dia inteiro\n              </label>\n              {!specialDraft.isClosed ? (\n                <>\n                  <div className="grid grid-cols-2 gap-2">\n                    <input\n                      type="time"\n                      value={specialDraft.opensAt}\n                      onChange={(event) =>\n                        setSpecialDraft((current) => ({\n                          ...current,\n                          opensAt: event.target.value,\n                        }))\n                      }\n                      className="rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm"\n                    />\n                    <input\n                      type="time"\n                      value={specialDraft.closesAt}\n                      onChange={(event) =>\n                        setSpecialDraft((current) => ({\n                          ...current,\n                          closesAt: event.target.value,\n                        }))\n                      }\n                      className="rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm"\n                    />\n                  </div>\n                  <label className="flex items-center gap-2 text-xs text-zinc-500">\n                    <input\n                      type="checkbox"\n                      checked={specialDraft.secondEnabled}\n                      onChange={(event) =>\n                        setSpecialDraft((current) => ({\n                          ...current,\n                          secondEnabled: event.target.checked,\n                        }))\n                      }\n                    />\n                    Adicionar segundo período\n                  </label>\n                  {specialDraft.secondEnabled ? (\n                    <div className="grid grid-cols-2 gap-2">\n                      <input\n                        type="time"\n                        value={specialDraft.secondOpensAt}\n                        onChange={(event) =>\n                          setSpecialDraft((current) => ({\n                            ...current,\n                            secondOpensAt: event.target.value,\n                          }))\n                        }\n                        className="rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm"\n                      />\n                      <input\n                        type="time"\n                        value={specialDraft.secondClosesAt}\n                        onChange={(event) =>\n                          setSpecialDraft((current) => ({\n                            ...current,\n                            secondClosesAt: event.target.value,\n                          }))\n                        }\n                        className="rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm"\n                      />\n                    </div>\n                  ) : null}\n                </>\n              ) : null}\n              <Button disabled={busyAction === "special-hours"} className="w-full">\n                {busyAction === "special-hours" ? (\n                  <Loader2 className="mr-2 h-4 w-4 animate-spin" />\n                ) : null}\n                Salvar data especial\n              </Button>\n            </form>\n\n            <section className="rounded-2xl border border-zinc-900 bg-zinc-950 p-5">\n              <h2 className="font-black">Próximas exceções</h2>\n              <div className="mt-4 space-y-2">\n                {specialHours.map((row) => (\n                  <div\n                    key={row.id}\n                    className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-zinc-900 bg-black p-3"\n                  >\n                    <div>\n                      <p className="text-sm font-bold">\n                        {new Date(`${row.service_date}T12:00:00`).toLocaleDateString("pt-BR")}\n                      </p>\n                      <p className="text-xs text-zinc-500">\n                        {row.is_closed\n                          ? row.note || "Fechado"\n                          : `${row.opens_at?.slice(0, 5)}–${row.closes_at?.slice(0, 5)}${\n                              row.second_opens_at && row.second_closes_at\n                                ? ` · ${row.second_opens_at.slice(0, 5)}–${row.second_closes_at.slice(0, 5)}`\n                                : ""\n                            }`}\n                      </p>\n                    </div>\n                    <button\n                      type="button"\n                      onClick={() => void deleteSpecialHours(row)}\n                      className="rounded-lg border border-red-500/20 px-3 py-2 text-xs font-bold text-red-400"\n                    >\n                      Remover\n                    </button>\n                  </div>\n                ))}\n                {specialHours.length === 0 ? (\n                  <p className="text-sm text-zinc-500">Nenhuma data especial futura cadastrada.</p>\n                ) : null}\n              </div>\n            </section>\n          </div>\n        </div>\n      )}\n\n'''
          text = text[:hours_start] + new_hours + text[hours_end:]
          path.write_text(text, encoding='utf-8')

          # Home and search listing
          for filename in ['src/routes/inicio.tsx', 'src/routes/buscar.tsx']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'import { fetchMerchantsHoursBatch, calculateMerchantStatus } from "@/lib/merchant-hours";',
                  'import {\n  fetchMerchantsHoursBatch,\n  fetchMerchantsSpecialHoursBatch,\n  calculateMerchantStatus,\n} from "@/lib/merchant-hours";',
                  1,
              )
              if 'const [merchantsSpecialHours, setMerchantsSpecialHours]' not in text:
                  text = text.replace(
                      '  const [merchantsHours, setMerchantsHours] = useState<any[]>([]);\n',
                      '  const [merchantsHours, setMerchantsHours] = useState<any[]>([]);\n  const [merchantsSpecialHours, setMerchantsSpecialHours] = useState<any[]>([]);\n',
                      1,
                  )
              old_fetch = '''            const hours = await fetchMerchantsHoursBatch(mers.map((m) => m.id));\n            setMerchantsHours(hours);'''
              new_fetch = '''            const merchantIds = mers.map((m) => m.id);\n            const [hours, specialHours] = await Promise.all([\n              fetchMerchantsHoursBatch(merchantIds),\n              fetchMerchantsSpecialHoursBatch(merchantIds),\n            ]);\n            setMerchantsHours(hours);\n            setMerchantsSpecialHours(specialHours);'''
              text = text.replace(old_fetch, new_fetch, 1)
              text = text.replace('            setMerchantsHours([]);', '            setMerchantsHours([]);\n            setMerchantsSpecialHours([]);', 1)
              text = text.replace('          setMerchantsHours([]);', '          setMerchantsHours([]);\n          setMerchantsSpecialHours([]);', 1)
              old_calc = 'const status = calculateMerchantStatus(mHours);'
              new_calc = '''const mSpecialHours = merchantsSpecialHours.filter(\n                              (h) => h.merchant_id === merchant.id,\n                            );\n                            const status = calculateMerchantStatus(\n                              mHours,\n                              undefined,\n                              mSpecialHours,\n                            );'''
              text = text.replace(old_calc, new_calc)
              path.write_text(text, encoding='utf-8')

          # Merchant detail
          path = Path('src/routes/estabelecimento.$merchantId.tsx')
          text = path.read_text(encoding='utf-8')
          old_import = 'import { fetchMerchantHours, calculateMerchantStatus, MerchantHours } from "@/lib/merchant-hours";'
          new_import = '''import {\n  fetchMerchantHours,\n  fetchMerchantSpecialHours,\n  calculateMerchantStatus,\n  MerchantHours,\n  MerchantSpecialHours,\n} from "@/lib/merchant-hours";'''
          text = text.replace(old_import, new_import, 1)
          if 'const [merchantSpecialHours, setMerchantSpecialHours]' not in text:
              text = text.replace(
                  '  const [merchantHours, setMerchantHours] = useState<MerchantHours[]>([]);\n',
                  '  const [merchantHours, setMerchantHours] = useState<MerchantHours[]>([]);\n  const [merchantSpecialHours, setMerchantSpecialHours] = useState<MerchantSpecialHours[]>([]);\n',
                  1,
              )
          old_promise = '''        const [merchantData, menuCatsData, prodsData, hoursData] = await Promise.all([\n          fetchMerchantById(merchantId),\n          fetchMenuCategoriesByMerchant(merchantId),\n          fetchProductsByMerchant(merchantId),\n          fetchMerchantHours(merchantId),\n        ]);'''
          new_promise = '''        const [merchantData, menuCatsData, prodsData, hoursData, specialHoursData] =\n          await Promise.all([\n            fetchMerchantById(merchantId),\n            fetchMenuCategoriesByMerchant(merchantId),\n            fetchProductsByMerchant(merchantId),\n            fetchMerchantHours(merchantId),\n            fetchMerchantSpecialHours(merchantId),\n          ]);'''
          if new_promise not in text:
              if old_promise not in text:
                  raise SystemExit('merchant detail Promise anchor missing')
              text = text.replace(old_promise, new_promise, 1)
          if 'setMerchantSpecialHours(specialHoursData);' not in text:
              text = text.replace('        setMerchantHours(hoursData);\n', '        setMerchantHours(hoursData);\n        setMerchantSpecialHours(specialHoursData);\n', 1)
          text = text.replace(
              'calculateMerchantStatus(merchantHours)',
              'calculateMerchantStatus(merchantHours, undefined, merchantSpecialHours)',
          )
          path.write_text(text, encoding='utf-8')
          PY
          bunx prettier \
            src/lib/merchant-hours.ts \
            src/routes/merchant.tsx \
            src/routes/inicio.tsx \
            src/routes/buscar.tsx \
            'src/routes/estabelecimento.$merchantId.tsx' \
            --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit integration and remove workflow
        run: |
          rm .github/workflows/integrate-special-hours.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hours): integrate split and special merchant schedules"
          git push
