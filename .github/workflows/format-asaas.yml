name: Format Asaas Integration

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/asaas-*/**"
      - "supabase/functions/create-asaas-pix-charge/**"
      - ".github/workflows/format-asaas.yml"

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message != 'style: format Asaas functions'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format Asaas sources
        run: bunx prettier --write "supabase/functions/asaas-*/**/*.{ts,json}" "supabase/functions/create-asaas-pix-charge/**/*.{ts,json}"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/asaas-* supabase/functions/create-asaas-pix-charge
          git commit -m "style: format Asaas functions"
          git push origin main
