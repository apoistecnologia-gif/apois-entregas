name: Fix Courier Native Geolocation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-courier-native-geolocation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply native geolocation bridge
        shell: python
        run: |
          from pathlib import Path

          helper = Path("src/lib/native-geolocation-bridge.ts")
          helper.write_text(r'''import { Capacitor, registerPlugin } from "@capacitor/core";

type NativePermissionState = "prompt" | "prompt-with-rationale" | "granted" | "denied";

type NativePosition = {
  timestamp: number;
  coords: {
    latitude: number;
    longitude: number;
    accuracy: number;
    altitudeAccuracy?: number | null;
    altitude?: number | null;
    speed?: number | null;
    heading?: number | null;
  };
};

type NativeGeolocationPlugin = {
  checkPermissions: () => Promise<{
    location: NativePermissionState;
    coarseLocation: NativePermissionState;
  }>;
  requestPermissions: (options?: { permissions?: Array<"location" | "coarseLocation"> }) => Promise<{
    location: NativePermissionState;
    coarseLocation: NativePermissionState;
  }>;
  getCurrentPosition: (options?: {
    enableHighAccuracy?: boolean;
    timeout?: number;
    maximumAge?: number;
    enableLocationFallback?: boolean;
  }) => Promise<NativePosition>;
  watchPosition: (
    options: {
      enableHighAccuracy?: boolean;
      timeout?: number;
      maximumAge?: number;
      minimumUpdateInterval?: number;
      interval?: number;
      enableLocationFallback?: boolean;
    },
    callback: (position: NativePosition | null, error?: { code?: string; message?: string }) => void,
  ) => Promise<string>;
  clearWatch: (options: { id: string }) => Promise<void>;
};

const NativeGeolocation = registerPlugin<NativeGeolocationPlugin>("Geolocation");

const toWebPosition = (position: NativePosition): GeolocationPosition =>
  ({
    coords: {
      latitude: position.coords.latitude,
      longitude: position.coords.longitude,
      accuracy: position.coords.accuracy,
      altitude: position.coords.altitude ?? null,
      altitudeAccuracy: position.coords.altitudeAccuracy ?? null,
      heading: position.coords.heading ?? null,
      speed: position.coords.speed ?? null,
      toJSON: () => ({}),
    },
    timestamp: position.timestamp || Date.now(),
    toJSON: () => ({}),
  }) as GeolocationPosition;

const toWebError = (error: unknown): GeolocationPositionError => {
  const source = error as { code?: string | number; message?: string } | null;
  const codeText = String(source?.code ?? "");
  const permissionDenied = codeText.includes("0003");
  const timeout = codeText.includes("0010");
  const code = permissionDenied ? 1 : timeout ? 3 : 2;
  return {
    code,
    message:
      source?.message ||
      (permissionDenied
        ? "Permissão de localização negada."
        : timeout
          ? "Tempo esgotado ao obter localização."
          : "Não foi possível obter a localização."),
    PERMISSION_DENIED: 1,
    POSITION_UNAVAILABLE: 2,
    TIMEOUT: 3,
  } as GeolocationPositionError;
};

export const installNativeGeolocationBridge = () => {
  if (typeof navigator === "undefined" || !Capacitor.isNativePlatform() || Capacitor.getPlatform() !== "android") {
    return;
  }

  let nextWatchId = 1;
  const watches = new Map<number, { nativeId?: string; cancelled: boolean }>();

  const adapter: Geolocation = {
    getCurrentPosition(success, failure, options) {
      void (async () => {
        try {
          let permission = await NativeGeolocation.checkPermissions();
          if (permission.location !== "granted") {
            permission = await NativeGeolocation.requestPermissions({ permissions: ["location"] });
          }
          if (permission.location !== "granted") {
            throw { code: "OS-PLUG-GLOC-0003", message: "Permissão de localização negada." };
          }
          const position = await NativeGeolocation.getCurrentPosition({
            enableHighAccuracy: options?.enableHighAccuracy ?? true,
            timeout: options?.timeout ?? 20000,
            maximumAge: options?.maximumAge ?? 0,
            enableLocationFallback: true,
          });
          success(toWebPosition(position));
        } catch (error) {
          failure?.(toWebError(error));
        }
      })();
    },

    watchPosition(success, failure, options) {
      const webId = nextWatchId++;
      const state = { cancelled: false as boolean, nativeId: undefined as string | undefined };
      watches.set(webId, state);
      void (async () => {
        try {
          let permission = await NativeGeolocation.checkPermissions();
          if (permission.location !== "granted") {
            permission = await NativeGeolocation.requestPermissions({ permissions: ["location"] });
          }
          if (permission.location !== "granted") {
            throw { code: "OS-PLUG-GLOC-0003", message: "Permissão de localização negada." };
          }
          const nativeId = await NativeGeolocation.watchPosition(
            {
              enableHighAccuracy: options?.enableHighAccuracy ?? true,
              timeout: options?.timeout ?? 20000,
              maximumAge: options?.maximumAge ?? 0,
              minimumUpdateInterval: 5000,
              interval: 10000,
              enableLocationFallback: true,
            },
            (position, error) => {
              if (state.cancelled) return;
              if (error) {
                failure?.(toWebError(error));
                return;
              }
              if (position) success(toWebPosition(position));
            },
          );
          state.nativeId = nativeId;
          if (state.cancelled) {
            await NativeGeolocation.clearWatch({ id: nativeId });
            watches.delete(webId);
          }
        } catch (error) {
          if (!state.cancelled) failure?.(toWebError(error));
          watches.delete(webId);
        }
      })();
      return webId;
    },

    clearWatch(id) {
      const state = watches.get(id);
      if (!state) return;
      state.cancelled = true;
      if (state.nativeId) {
        void NativeGeolocation.clearWatch({ id: state.nativeId }).finally(() => watches.delete(id));
      }
    },
  };

  try {
    Object.defineProperty(navigator, "geolocation", {
      configurable: true,
      enumerable: true,
      value: adapter,
    });
  } catch {
    console.warn("Não foi possível instalar a ponte nativa de localização.");
  }
};
''', encoding="utf-8")

          router = Path("src/router.tsx")
          text = router.read_text(encoding="utf-8")
          import_line = 'import { installNativeGeolocationBridge } from "./lib/native-geolocation-bridge";\n'
          if import_line not in text:
            text = text.replace('import { routeTree } from "./routeTree.gen";\n', 'import { routeTree } from "./routeTree.gen";\n' + import_line)
          marker = 'export const getRouter = () => {\n'
          replacement = 'export const getRouter = () => {\n  installNativeGeolocationBridge();\n'
          if replacement not in text:
            text = text.replace(marker, replacement, 1)
          router.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/mobile-android.yml")
          text = workflow.read_text(encoding="utf-8")
          old = 'npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2 @capacitor/push-notifications@8.1.2'
          new = old + ' @capacitor/geolocation@8.2.0'
          if new not in text:
            if old not in text:
              raise SystemExit("Capacitor Android runtime install command not found")
            text = text.replace(old, new, 1)
          workflow.write_text(text, encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/native-geolocation-bridge.ts src/router.tsx .github/workflows/mobile-android.yml
          if git diff --cached --quiet; then
            echo "Fix already applied"
            exit 0
          fi
          git commit -m "fix(courier): use native Android geolocation"
          git push origin HEAD:main
