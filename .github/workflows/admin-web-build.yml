name: Admin Web Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: admin
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated admin product
        run: bun run build:admin

      - name: Validate admin build identity
        shell: bash
        run: |
          set -euo pipefail
          OUT=".output/public"
          if [ ! -d "$OUT" ]; then OUT="dist"; fi
          test -d "$OUT"
          test -f "$OUT/index.html"

          find "$OUT/assets" -maxdepth 1 -type f -name 'admin-*.js' | grep -q . || {
            echo "ERROR: admin route chunk was not generated"
            exit 1
          }

          echo "ADMIN_BUILD_DIR=$OUT" >> "$GITHUB_ENV"
          echo "APOIS_ENTREGAS_ADMIN_BUILD_OK"

      - name: Upload admin web bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-admin-web
          path: ${{ env.ADMIN_BUILD_DIR }}
          if-no-files-found: error
          retention-days: 7
