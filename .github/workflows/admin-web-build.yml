name: Admin Web Build
# Audited production redeploy after the complete source/backend review.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "vite.config.ts"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: admin
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated admin product
        run: bun run build:admin

      - name: Validate admin Nitro build
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          test -f .output/server/index.mjs
          ADMIN_CHUNK="$(find .output/public/assets -maxdepth 1 -type f -name 'admin-*.js' -print -quit)"
          if [ -z "$ADMIN_CHUNK" ]; then
            echo "ERROR: admin route chunk was not generated"
            exit 1
          fi
          echo "Admin chunk: $ADMIN_CHUNK"
          echo "APOIS_ENTREGAS_ADMIN_BUILD_OK"

      - name: Upload admin Nitro prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-admin-prebuilt
          path: .output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        env:
          APOIS_VERCEL_BUILD: "1"
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Install HTTP-safe Admin root entry in Build Output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path('.vercel/output')
          config_path = output / 'config.json'
          static_dir = output / 'static'
          if not config_path.is_file():
              raise SystemExit('Vercel Build Output config.json was not generated')
          static_dir.mkdir(parents=True, exist_ok=True)

          # Nitro/Vercel scopes framework redirects to the generated Admin function
          # prefix, which turned /login into /admin/login. Keep `/` outside that
          # redirect machinery: serve a tiny Admin-only static entry with HTTP 200,
          # then let the browser open the canonical authentication route.
          entry = '''<!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
              <meta name="robots" content="noindex,nofollow" />
              <meta http-equiv="refresh" content="0;url=https://admin.apoisbrasil.com.br/login" />
              <title>APOIS Administração</title>
              <style>
                html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                body{min-height:100vh;display:grid;place-items:center}
                main{text-align:center;padding:28px}
                strong{display:block;letter-spacing:.08em;font-size:22px}
                span{display:block;margin-top:8px;color:#f6b900;font-weight:700}
                p{margin:18px 0 0;color:#a1a1aa;font-size:14px}
                a{color:#f6b900}
              </style>
              <script>window.location.replace('https://admin.apoisbrasil.com.br/login');</script>
            </head>
            <body>
              <main data-apois-admin-root="true">
                <strong>APOIS</strong><span>ADMINISTRAÇÃO</span>
                <p>Abrindo a autenticação administrativa…</p>
                <noscript><p><a href="https://admin.apoisbrasil.com.br/login">Entrar no painel administrativo</a></p></noscript>
              </main>
            </body>
          </html>
          '''
          (static_dir / 'admin-root.html').write_text(entry, encoding='utf-8')

          config = json.loads(config_path.read_text(encoding='utf-8'))
          if config.get('version') != 3:
              raise SystemExit(f"Unexpected Vercel Build Output version: {config.get('version')!r}")
          routes = config.get('routes')
          if not isinstance(routes, list):
              raise SystemExit('Vercel Build Output routes array is missing')

          # Build Output API route src values use path regexes such as `/redirect`.
          # A literal root matcher avoids the adapter interpreting anchored forms
          # relative to the generated function prefix.
          routes = [
              r for r in routes
              if not (isinstance(r, dict) and r.get('src') in ('/', '^/$', '^\\/$'))
          ]
          routes.insert(0, {'src': '/', 'dest': '/admin-root.html'})
          config['routes'] = routes
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          if not (static_dir / 'admin-root.html').is_file():
              raise SystemExit('Admin root static entry missing')
          if routes[0] != {'src': '/', 'dest': '/admin-root.html'}:
              raise SystemExit('Admin root route was not installed first')
          print('APOIS_ADMIN_STATIC_ROOT_BUILD_OUTPUT_OK')
          print(json.dumps(routes[0], sort_keys=True))
          PY

      - name: Detach Git metadata for Hobby CLI deployment
        shell: bash
        run: rm -rf .git

      - name: Deploy admin to Vercel production
        run: bunx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Gate Admin production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://admin.apoisbrasil.com.br"

          for attempt in $(seq 1 20); do
            ROOT_STATUS="$(curl -sS -o /tmp/apois-admin-root.html -w '%{http_code}' "$BASE/")"
            LOGIN_STATUS="$(curl -sS -o /tmp/apois-admin-login.html -w '%{http_code}' "$BASE/login")"
            ADMIN_STATUS="$(curl -sS -o /tmp/apois-admin-workspace.html -w '%{http_code}' "$BASE/admin")"

            if [ "$ROOT_STATUS" = "200" ] && [ "$LOGIN_STATUS" = "200" ] && [ "$ADMIN_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Admin route gate failed: root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS" >&2
              exit 1
            fi
            sleep 3
          done

          grep -Fq 'data-apois-admin-root="true"' /tmp/apois-admin-root.html
          grep -Fq 'admin.apoisbrasil.com.br/login' /tmp/apois-admin-root.html
          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-root.html
          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-login.html
          grep -Fq '<title>Administração | APOIS ENTREGA</title>' /tmp/apois-admin-workspace.html
          ! grep -Fq 'Seu delivery do seu jeito' /tmp/apois-admin-root.html
          echo "APOIS_ADMIN_PRODUCTION_ROUTES_OK root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS"
