name: Admin Web Build
# Audited production redeploy after the complete source/backend review.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "vite.config.ts"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: admin
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated admin product
        run: bun run build:admin

      - name: Validate admin Nitro build
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          test -f .output/server/index.mjs
          ADMIN_CHUNK="$(find .output/public/assets -maxdepth 1 -type f -name 'admin-*.js' -print -quit)"
          if [ -z "$ADMIN_CHUNK" ]; then
            echo "ERROR: admin route chunk was not generated"
            exit 1
          fi
          echo "Admin chunk: $ADMIN_CHUNK"
          echo "APOIS_ENTREGAS_ADMIN_BUILD_OK"

      - name: Upload admin Nitro prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-admin-prebuilt
          path: .output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        env:
          APOIS_VERCEL_BUILD: "1"
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Enforce Admin root redirect in Vercel Build Output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(".vercel/output/config.json")
          if not path.is_file():
              raise SystemExit("Vercel Build Output config.json was not generated")

          config = json.loads(path.read_text(encoding="utf-8"))
          if config.get("version") != 3:
              raise SystemExit(f"Unexpected Vercel Build Output version: {config.get('version')!r}")

          routes = config.get("routes")
          if not isinstance(routes, list):
              raise SystemExit("Vercel Build Output routes array is missing")

          # Vercel's Build Output API evaluates routes in order. Keep this exact-root
          # redirect ahead of Nitro's generated filesystem/function fallbacks so `/`
          # can never be interpreted as a missing admin route.
          routes = [
              route
              for route in routes
              if not (
                  isinstance(route, dict)
                  and route.get("src") in {"/", "^/$", "^\\/$"}
                  and route.get("status") in {301, 302, 307, 308}
              )
          ]
          routes.insert(
              0,
              {
                  "src": "^/$",
                  "status": 307,
                  "headers": {"Location": "/login"},
              },
          )
          config["routes"] = routes
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          first = routes[0]
          if first.get("src") != "^/$" or first.get("status") != 307:
              raise SystemExit("Admin root redirect was not installed as the first Vercel route")
          print("APOIS_ADMIN_ROOT_REDIRECT_OK", json.dumps(first, sort_keys=True))
          PY

      - name: Detach Git metadata for Hobby CLI deployment
        shell: bash
        run: rm -rf .git

      - name: Deploy admin to Vercel production
        run: bunx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
