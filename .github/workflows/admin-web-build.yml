name: Admin Web Build
# Audited production redeploy after the complete source/backend review.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "vite.config.ts"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: admin
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated admin product
        run: bun run build:admin

      - name: Validate admin Nitro build
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          test -f .output/server/index.mjs
          ADMIN_CHUNK="$(find .output/public/assets -maxdepth 1 -type f -name 'admin-*.js' -print -quit)"
          if [ -z "$ADMIN_CHUNK" ]; then
            echo "ERROR: admin route chunk was not generated"
            exit 1
          fi
          echo "Admin chunk: $ADMIN_CHUNK"
          echo "APOIS_ENTREGAS_ADMIN_BUILD_OK"

      - name: Upload admin Nitro prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-admin-prebuilt
          path: .output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Write Admin-only Vercel root redirect
        shell: bash
        run: |
          set -euo pipefail
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "outputDirectory": null,
            "redirects": [
              {
                "source": "/",
                "destination": "https://admin.apoisbrasil.com.br/login",
                "permanent": false
              }
            ]
          }
          JSON
          python3 -m json.tool vercel.json >/dev/null

      - name: Build Vercel production bundle
        env:
          APOIS_VERCEL_BUILD: "1"
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Detach Git metadata for Hobby CLI deployment
        shell: bash
        run: rm -rf .git

      - name: Deploy admin to Vercel production
        run: bunx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Gate Admin production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://admin.apoisbrasil.com.br"
          EXPECTED_LOCATION="https://admin.apoisbrasil.com.br/login"

          for attempt in $(seq 1 20); do
            curl -sS -D /tmp/apois-admin-root.headers -o /tmp/apois-admin-root-first.html "$BASE/"
            ROOT_STATUS="$(awk 'NR==1 {print $2}' /tmp/apois-admin-root.headers)"
            ROOT_LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $2); print $2; exit}' /tmp/apois-admin-root.headers)"
            ROOT_FINAL_STATUS="$(curl -sS -L -o /tmp/apois-admin-root-followed.html -w '%{http_code}' "$BASE/")"
            LOGIN_STATUS="$(curl -sS -o /tmp/apois-admin-login.html -w '%{http_code}' "$BASE/login")"
            ADMIN_STATUS="$(curl -sS -o /tmp/apois-admin-workspace.html -w '%{http_code}' "$BASE/admin")"

            ROOT_OK=false
            if [ "$ROOT_STATUS" = "200" ]; then
              ROOT_OK=true
            elif { [ "$ROOT_STATUS" = "307" ] || [ "$ROOT_STATUS" = "308" ] || [ "$ROOT_STATUS" = "302" ]; } && [ "$ROOT_LOCATION" = "$EXPECTED_LOCATION" ]; then
              ROOT_OK=true
            fi

            if [ "$ROOT_OK" = "true" ] && [ "$ROOT_FINAL_STATUS" = "200" ] && [ "$LOGIN_STATUS" = "200" ] && [ "$ADMIN_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Admin route gate failed: root=$ROOT_STATUS location=$ROOT_LOCATION followed=$ROOT_FINAL_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS" >&2
              cat /tmp/apois-admin-root.headers >&2 || true
              exit 1
            fi
            sleep 3
          done

          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-root-followed.html
          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-login.html
          grep -Fq '<title>Administração | APOIS ENTREGA</title>' /tmp/apois-admin-workspace.html
          ! grep -Fq 'Seu delivery do seu jeito' /tmp/apois-admin-root-followed.html
          echo "APOIS_ADMIN_PRODUCTION_ROUTES_OK root=$ROOT_STATUS location=$ROOT_LOCATION followed=$ROOT_FINAL_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS"
