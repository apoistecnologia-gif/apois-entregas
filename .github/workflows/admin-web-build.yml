name: Admin Web Build
# Audited production redeploy after the complete source/backend review. Review workspace gate 2026-08-15.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "vite.config.ts"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: admin
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply merchant lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.tsx')
          text = path.read_text(encoding='utf-8')
          changed = text

          # Keep the earlier template-literal repair idempotent.
          repairs = {
              r'busyKey === \`merchant:\${merchant.id}\`': 'busyKey === `merchant:${merchant.id}`',
              r'busyKey === \`doc:\${doc.id}\`': 'busyKey === `doc:${doc.id}`',
              r'busyKey === \`doc:\${preview.doc.id}\`': 'busyKey === `doc:${preview.doc.id}`',
          }
          for broken, fixed in repairs.items():
              changed = changed.replace(broken, fixed)

          old = '''  const reviewCourier = async (courierId: string, status: "approved" | "rejected" | "blocked") => {'''
          lifecycle = '''  const suspendMerchant = async (merchantId: string, suspended: boolean) => {
    const reason = suspended ? window.prompt("Motivo da suspensão:")?.trim() : null;
    if (suspended && !reason) return;
    setBusy(`merchant:${merchantId}`);
    const { error } = await rpc("admin_suspend_merchant", {
      _merchant_id: merchantId,
      _suspended: suspended,
      _reason: reason,
    });
    setBusy(null);
    if (error) return toast.error(error.message);
    toast.success(suspended ? "Estabelecimento suspenso." : "Estabelecimento reativado.");
    await loadAll(true);
  };

  const deleteMerchant = async (merchantId: string, merchantName: string) => {
    const confirmed = window.confirm(
      `Excluir definitivamente ${merchantName}? Esta ação só será permitida se não houver histórico de pedidos.`,
    );
    if (!confirmed) return;
    const typed = window.prompt(`Digite EXCLUIR para confirmar a exclusão de ${merchantName}:`)?.trim();
    if (typed !== "EXCLUIR") {
      toast.error("Exclusão cancelada: confirmação inválida.");
      return;
    }
    setBusy(`merchant:${merchantId}`);
    const { error } = await rpc("admin_delete_merchant", { _merchant_id: merchantId });
    setBusy(null);
    if (error) return toast.error(error.message);
    toast.success("Estabelecimento excluído.");
    if (selectedMerchantId === merchantId) setSelectedMerchantId(null);
    await loadAll(true);
  };

  const reviewCourier = async (courierId: string, status: "approved" | "rejected" | "blocked") => {'''
          if old in changed and 'const suspendMerchant = async' not in changed:
              changed = changed.replace(old, lifecycle, 1)

          changed = changed.replace(
'''            onReview={reviewMerchant}
            onDocument={reviewDocument}
          />''',
'''            onReview={reviewMerchant}
            onSuspend={suspendMerchant}
            onDelete={deleteMerchant}
            onDocument={reviewDocument}
          />''',
1,
          )

          changed = changed.replace(
'''                onReview={reviewMerchant}
                onDocument={reviewDocument}
                onOpenDocument={openDocument}''',
'''                onReview={reviewMerchant}
                onSuspend={suspendMerchant}
                onDelete={deleteMerchant}
                onDocument={reviewDocument}
                onOpenDocument={openDocument}''',
1,
          )

          changed = changed.replace(
'function ApplicationCard({ kind, item, profile, busy, onReview, onDocument, onOpenDocument, onOpenDetails }: any) {',
'function ApplicationCard({ kind, item, profile, busy, onReview, onSuspend, onDelete, onDocument, onOpenDocument, onOpenDetails }: any) {',
1,
          )

          old_buttons = '''          <Button
            type="button"
            size="sm"
            disabled={busy || !approvalReady}
            title={
              approvalReady
                ? "Aprovar parceiro"
                : "Aprove primeiro todos os documentos e dados obrigatórios."
            }
            onClick={() => void onReview(item.id, "approved")}
          >
            Aprovar
          </Button>
          <Button
            type="button"
            size="sm"
            variant="outline"
            disabled={busy}
            onClick={() => void onReview(item.id, "rejected")}
            className="border-red-500/20 text-red-400"
          >
            Reprovar
          </Button>
          {status === "approved" ? (
            <Button
              type="button"
              size="sm"
              variant="outline"
              disabled={busy}
              onClick={() => void onReview(item.id, "blocked")}
              className="border-zinc-800"
            >
              Bloquear
            </Button>
          ) : null}'''
          new_buttons = '''          <Button
            type="button"
            size="sm"
            disabled={busy || !approvalReady || status === "approved"}
            title={
              status === "approved"
                ? "Estabelecimento já aprovado"
                : approvalReady
                  ? "Aprovar parceiro"
                  : "Aprove primeiro todos os documentos e dados obrigatórios."
            }
            onClick={() => void onReview(item.id, "approved")}
          >
            {status === "approved" ? "Aprovado" : "Aprovar"}
          </Button>
          {status !== "approved" ? (
            <Button
              type="button"
              size="sm"
              variant="outline"
              disabled={busy}
              onClick={() => void onReview(item.id, "rejected")}
              className="border-red-500/20 text-red-400"
            >
              Reprovar
            </Button>
          ) : null}
          {isMerchant && status === "approved" ? (
            <>
              <Button
                type="button"
                size="sm"
                variant="outline"
                disabled={busy}
                onClick={() => void onSuspend(item.id, item.is_active)}
                className="border-amber-500/30 text-amber-300"
              >
                {item.is_active ? "Suspender" : "Reativar"}
              </Button>
              <Button
                type="button"
                size="sm"
                variant="outline"
                disabled={busy}
                onClick={() => void onReview(item.id, "blocked")}
                className="border-red-500/30 text-red-400"
              >
                Bloquear
              </Button>
              <Button
                type="button"
                size="sm"
                variant="outline"
                disabled={busy}
                onClick={() => void onDelete(item.id, title)}
                className="border-red-700/50 text-red-500"
              >
                Excluir
              </Button>
            </>
          ) : null}
          {!isMerchant && status === "approved" ? (
            <Button
              type="button"
              size="sm"
              variant="outline"
              disabled={busy}
              onClick={() => void onReview(item.id, "blocked")}
              className="border-zinc-800"
            >
              Bloquear
            </Button>
          ) : null}'''
          if old_buttons in changed:
              changed = changed.replace(old_buttons, new_buttons, 1)

          changed = changed.replace(
'function MerchantApplicationDetails({ merchant, profile, busyKey, onBack, onReview, onDocument }: any) {',
'function MerchantApplicationDetails({ merchant, profile, busyKey, onBack, onReview, onSuspend, onDelete, onDocument }: any) {',
1,
          )

          old_detail_buttons = '''          <Button
            type="button"
            disabled={merchantBusy || !approvalReady}
            title={approvalReady ? "Aprovar estabelecimento" : "Aprove primeiro todos os documentos obrigatórios."}
            onClick={() => void onReview(merchant.id, "approved")}
          >
            Aprovar estabelecimento
          </Button>
          <Button
            type="button"
            variant="outline"
            disabled={merchantBusy}
            onClick={() => void onReview(merchant.id, "rejected")}
            className="border-red-500/30 text-red-400"
          >
            Recusar cadastro
          </Button>'''
          new_detail_buttons = '''          <Button
            type="button"
            disabled={merchantBusy || !approvalReady || merchant.approval_status === "approved"}
            title={
              merchant.approval_status === "approved"
                ? "Estabelecimento já aprovado"
                : approvalReady
                  ? "Aprovar estabelecimento"
                  : "Aprove primeiro todos os documentos obrigatórios."
            }
            onClick={() => void onReview(merchant.id, "approved")}
          >
            {merchant.approval_status === "approved" ? "Estabelecimento aprovado" : "Aprovar estabelecimento"}
          </Button>
          {merchant.approval_status !== "approved" ? (
            <Button
              type="button"
              variant="outline"
              disabled={merchantBusy}
              onClick={() => void onReview(merchant.id, "rejected")}
              className="border-red-500/30 text-red-400"
            >
              Recusar cadastro
            </Button>
          ) : (
            <>
              <Button
                type="button"
                variant="outline"
                disabled={merchantBusy}
                onClick={() => void onSuspend(merchant.id, merchant.is_active)}
                className="border-amber-500/30 text-amber-300"
              >
                {merchant.is_active ? "Suspender" : "Reativar"}
              </Button>
              <Button
                type="button"
                variant="outline"
                disabled={merchantBusy}
                onClick={() => void onReview(merchant.id, "blocked")}
                className="border-red-500/30 text-red-400"
              >
                Bloquear
              </Button>
              <Button
                type="button"
                variant="outline"
                disabled={merchantBusy}
                onClick={() => void onDelete(merchant.id, merchant.name)}
                className="border-red-700/50 text-red-500"
              >
                Excluir
              </Button>
            </>
          )}'''
          if old_detail_buttons in changed:
              changed = changed.replace(old_detail_buttons, new_detail_buttons, 1)

          if changed == text:
              raise SystemExit('merchant lifecycle patch did not change admin.tsx')
          path.write_text(changed, encoding='utf-8')
          print('APOIS_ADMIN_MERCHANT_LIFECYCLE_PATCH_APPLIED')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx
          git commit -m "feat(admin): add merchant suspend block delete lifecycle"
          git push origin HEAD:main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated admin product
        run: bun run build:admin

      - name: Validate admin Nitro build
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          test -f .output/server/index.mjs
          ADMIN_CHUNK="$(find .output/public/assets -maxdepth 1 -type f -name 'admin-*.js' -print -quit)"
          if [ -z "$ADMIN_CHUNK" ]; then
            echo "ERROR: admin route chunk was not generated"
            exit 1
          fi
          echo "Admin chunk: $ADMIN_CHUNK"
          echo "APOIS_ENTREGAS_ADMIN_BUILD_OK"

      - name: Upload admin Nitro prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-admin-prebuilt
          path: .output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        env:
          APOIS_VERCEL_BUILD: "1"
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Install HTTP-safe Admin root filesystem entry
        shell: bash
        run: |
          set -euo pipefail
          test -s .vercel/output/config.json
          mkdir -p .vercel/output/static
          cat > .vercel/output/static/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
              <meta name="robots" content="noindex,nofollow" />
              <meta http-equiv="refresh" content="0;url=/login" />
              <title>APOIS Administração</title>
              <style>
                html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                body{min-height:100vh;display:grid;place-items:center}
                main{text-align:center;padding:28px}
                strong{display:block;font-size:22px;letter-spacing:.08em}
                span{display:block;margin-top:8px;color:#f6b900;font-size:12px;font-weight:800;letter-spacing:.2em}
                p{margin:18px 0 0;color:#71717a;font-size:14px}
                a{color:#f6b900}
              </style>
              <script>window.location.replace('/login');</script>
            </head>
            <body>
              <main data-apois-admin-root="true">
                <strong>APOIS</strong>
                <span>ADMINISTRAÇÃO</span>
                <p>Abrindo o acesso correto…</p>
                <noscript><p><a href="/login">Entrar no painel administrativo</a></p></noscript>
              </main>
            </body>
          </html>
          HTML
          test -s .vercel/output/static/index.html
          grep -Fq 'data-apois-admin-root="true"' .vercel/output/static/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('.vercel/output/config.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          routes = config.get('routes')
          if not isinstance(routes, list):
              raise SystemExit('Vercel Build Output routes array is missing')

          filesystem_index = next(
              (i for i, route in enumerate(routes)
               if isinstance(route, dict) and route.get('handle') == 'filesystem'),
              None,
          )
          if filesystem_index is None:
              raise SystemExit('Vercel Build Output has no filesystem phase')

          root_route = {'src': '^/$', 'dest': '/index.html'}
          routes = [
              route for route in routes
              if not (
                  isinstance(route, dict)
                  and route.get('src') in ('/', '^/$', '^\\/$')
                  and route.get('dest') == '/index.html'
              )
          ]
          filesystem_index = next(
              i for i, route in enumerate(routes)
              if isinstance(route, dict) and route.get('handle') == 'filesystem'
          )
          routes.insert(filesystem_index + 1, root_route)
          config['routes'] = routes
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          if routes[filesystem_index + 1] != root_route:
              raise SystemExit('Exact Admin root route was not installed after filesystem phase')
          print('APOIS_ADMIN_ROOT_ROUTE_OK', json.dumps(root_route, sort_keys=True))
          PY

      - name: Detach Git metadata for Hobby CLI deployment
        shell: bash
        run: rm -rf .git

      - name: Deploy admin to Vercel production
        run: bunx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Gate Admin production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://admin.apoisbrasil.com.br"

          for attempt in $(seq 1 20); do
            ROOT_STATUS="$(curl -sS -o /tmp/apois-admin-root.html -w '%{http_code}' "$BASE/")"
            LOGIN_STATUS="$(curl -sS -o /tmp/apois-admin-login.html -w '%{http_code}' "$BASE/login")"
            ADMIN_STATUS="$(curl -sS -o /tmp/apois-admin-workspace.html -w '%{http_code}' "$BASE/admin")"

            if [ "$ROOT_STATUS" = "200" ] && [ "$LOGIN_STATUS" = "200" ] && [ "$ADMIN_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Admin route gate failed: root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS" >&2
              exit 1
            fi
            sleep 3
          done

          grep -Fq 'data-apois-admin-root="true"' /tmp/apois-admin-root.html
          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-root.html
          grep -Fq 'href="/login"' /tmp/apois-admin-root.html
          grep -Fq '<title>APOIS Administração</title>' /tmp/apois-admin-login.html
          grep -Fq '<title>Administração | APOIS ENTREGA</title>' /tmp/apois-admin-workspace.html
          ! grep -Fq 'Seu delivery do seu jeito' /tmp/apois-admin-root.html
          echo "APOIS_ADMIN_PRODUCTION_ROUTES_OK root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS"
