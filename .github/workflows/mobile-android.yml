name: Mobile Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
    inputs:
      product:
        description: Produto Android para empacotar
        required: true
        default: both
        type: choice
        options:
          - both
          - customer
          - courier

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.product == 'customer' && '["customer"]' || inputs.product == 'courier' && '["courier"]' || '["customer","courier"]') }}
    env:
      APOIS_MOBILE_PRODUCT: ${{ matrix.product }}
      APOIS_MOBILE_BUILD: "1"
      VITE_APOIS_PRODUCT_MODE: ${{ matrix.product }}
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_COURIER_KEYSTORE_BASE64: ${{ secrets.ANDROID_COURIER_KEYSTORE_BASE64 }}
      ANDROID_COURIER_STORE_PASSWORD: ${{ secrets.ANDROID_COURIER_STORE_PASSWORD }}
      ANDROID_COURIER_KEY_ALIAS: ${{ secrets.ANDROID_COURIER_KEY_ALIAS }}
      ANDROID_COURIER_KEY_PASSWORD: ${{ secrets.ANDROID_COURIER_KEY_PASSWORD }}
      ANDROID_CUSTOMER_KEYSTORE_BASE64: ${{ secrets.ANDROID_CUSTOMER_KEYSTORE_BASE64 }}
      ANDROID_CUSTOMER_STORE_PASSWORD: ${{ secrets.ANDROID_CUSTOMER_STORE_PASSWORD }}
      ANDROID_CUSTOMER_KEY_ALIAS: ${{ secrets.ANDROID_CUSTOMER_KEY_ALIAS }}
      ANDROID_CUSTOMER_KEY_PASSWORD: ${{ secrets.ANDROID_CUSTOMER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate production release inputs
        shell: bash
        run: |
          set -euo pipefail

          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            KS_B64="$ANDROID_COURIER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
            KEY_PASS="$ANDROID_COURIER_KEY_PASSWORD"
          else
            KS_B64="$ANDROID_CUSTOMER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
            KEY_PASS="$ANDROID_CUSTOMER_KEY_PASSWORD"
          fi

          if [ -z "$KS_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "$APOIS_MOBILE_PRODUCT production signing is mandatory." >&2
            exit 1
          fi

          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ] && [ -z "$FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 is required for APOIS Entregador." >&2
            exit 1
          fi

          test -n "$VITE_SUPABASE_URL"
          test "$VITE_SUPABASE_URL" = "https://sbvhdgyuuperszlsllji.supabase.co"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test "$VITE_SUPABASE_PUBLISHABLE_KEY" != "ci-placeholder"
          test -n "$VITE_GOOGLE_MAPS_BROWSER_KEY"
          test "$VITE_GOOGLE_MAPS_BROWSER_KEY" != "ci-placeholder"
          test -n "$VITE_GOOGLE_MAPS_MAP_ID"
          test "$VITE_GOOGLE_MAPS_MAP_ID" != "ci-placeholder"

      - name: Build isolated product web bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            bun run build:courier
          else
            bun run build:customer
          fi

      - name: Render Capacitor entry from built app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            PRODUCT_PATH="/courier"
            EXPECTED_TITLE="APOIS Entregador"
          else
            PRODUCT_PATH="/"
            EXPECTED_TITLE="APOIS Cliente"
          fi

          HOST=127.0.0.1 PORT=4173 node .output/server/index.mjs > /tmp/apois-mobile-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "http://127.0.0.1:4173${PRODUCT_PATH}" -o .output/public/index.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/apois-mobile-server.log
              exit 1
            fi
            sleep 1
          done

          test -s .output/public/index.html
          grep -qi '<html' .output/public/index.html
          grep -qi '<script' .output/public/index.html
          grep -Fq "$EXPECTED_TITLE" .output/public/index.html

      - name: Install Capacitor Android runtime
        run: npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2 @capacitor/push-notifications@8.1.2

      - name: Create Android native project
        run: npx cap add android

      - name: Install and validate courier Firebase configuration
        if: matrix.product == 'courier'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          packages = {
              str(client.get("client_info", {}).get("android_client_info", {}).get("package_name", ""))
              for client in (data.get("client") or [])
          }
          if "br.com.apois.entregador" not in packages:
              raise SystemExit("google-services.json is not registered for br.com.apois.entregador")
          project_id = str(data.get("project_info", {}).get("project_id", "")).strip()
          project_number = str(data.get("project_info", {}).get("project_number", "")).strip()
          if not project_id or not project_number:
              raise SystemExit("google-services.json is missing Firebase project identity")
          print("Firebase configuration validated for br.com.apois.entregador")
          PY

      - name: Configure Android identity, monotonic version, permissions and branding
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          product = "courier" if os.environ["APOIS_MOBILE_PRODUCT"] == "courier" else "customer"
          app_name = "APOIS Entregador" if product == "courier" else "APOIS Cliente"
          expected_package = "br.com.apois.entregador" if product == "courier" else "br.com.apois.cliente"
          version_code = int(os.environ["GITHUB_RUN_NUMBER"])
          version_name = f"1.0.{version_code}"

          if version_code <= 1:
              raise SystemExit("GITHUB_RUN_NUMBER must produce a versionCode greater than 1")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
          additions = []
          if "android.permission.ACCESS_COARSE_LOCATION" not in text:
              additions.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />')
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              additions.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />')
          if product == "courier" and "android.permission.VIBRATE" not in text:
              additions.append('    <uses-permission android:name="android.permission.VIBRATE" />')
          if "android.hardware.location.gps" not in text:
              additions.append('    <uses-feature android:name="android.hardware.location.gps" android:required="false" />')
          if additions:
              text = text.replace(marker, marker + "\n".join(additions) + "\n", 1)
          if "android:usesCleartextTraffic" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="false"', 1)
          manifest.write_text(text, encoding="utf-8")

          strings = Path("android/app/src/main/res/values/strings.xml")
          strings_text = strings.read_text(encoding="utf-8")
          strings_text = re.sub(r'(<string name="app_name">).*?(</string>)', rf'\1{app_name}\2', strings_text)
          strings_text = re.sub(r'(<string name="title_activity_main">).*?(</string>)', rf'\1{app_name}\2', strings_text)
          strings.write_text(strings_text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          gradle_text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", gradle_text, count=1)
          gradle_text = re.sub(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding="utf-8")

          res = Path("android/app/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          icon_source = Path("public/favicon.png")
          if not icon_source.exists():
              raise SystemExit("public/favicon.png is required for Android branding")
          (drawable / "apois_icon.png").write_bytes(icon_source.read_bytes())

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="apois_black">#000000</color>\n    <color name="apois_gold">#F6B900</color>\n</resources>\n',
              encoding="utf-8",
          )

          for png in res.glob("drawable*/splash.png"):
              png.unlink()
          (drawable / "splash.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:drawable="@color/apois_black" />\n    <item android:gravity="center">\n        <bitmap android:src="@drawable/apois_icon" android:gravity="center" />\n    </item>\n</layer-list>\n',
              encoding="utf-8",
          )

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/apois_black" />\n    <foreground android:drawable="@drawable/apois_icon" />\n</adaptive-icon>\n'
          (anydpi / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")

          package_path = Path("android/app/src/main/java").joinpath(*expected_package.split("."))
          if not package_path.exists():
              raise SystemExit(f"Expected Android package directory not found: {package_path}")

          print(f"Configured {expected_package} versionCode={version_code} versionName={version_name}")

      - name: Sync web bundle and native plugins into Android
        run: npx cap sync android

      - name: Validate Capacitor native plugin wiring
        shell: bash
        run: |
          set -euo pipefail
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -s "$PLUGINS"
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            test -s android/app/google-services.json
            grep -qi 'pushnotifications' "$PLUGINS"
          fi

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare mandatory production signing
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            KS_B64="$ANDROID_COURIER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
          else
            KS_B64="$ANDROID_CUSTOMER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
          fi
          printf '%s' "$KS_B64" | base64 --decode > android/apois-release.keystore
          test -s android/apois-release.keystore
          keytool -list -keystore android/apois-release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed production APK and AAB
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            STORE_PASSWORD="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_COURIER_KEY_PASSWORD"
          else
            STORE_PASSWORD="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_CUSTOMER_KEY_PASSWORD"
          fi
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/apois-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-signed.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-signed.aab

      - name: Locate Android release tools and artifacts
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=android/app/build/outputs/apk/release/app-release-signed.apk
          RELEASE_AAB=android/app/build/outputs/bundle/release/app-release-signed.aab
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT_PATH"
          test -x "$APKSIGNER_PATH"
          echo "AAPT_PATH=$AAPT_PATH" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$APKSIGNER_PATH" >> "$GITHUB_ENV"

      - name: Validate Android package and version
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=android/app/build/outputs/apk/release/app-release-signed.apk
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            EXPECTED_PACKAGE="br.com.apois.entregador"
          else
            EXPECTED_PACKAGE="br.com.apois.cliente"
          fi

          "$AAPT_PATH" dump badging "$DEBUG_APK" | tee /tmp/apois-debug-badging.txt
          "$AAPT_PATH" dump badging "$RELEASE_APK" | tee /tmp/apois-release-badging.txt
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/apois-debug-badging.txt
          grep -Fq "package: name='$EXPECTED_PACKAGE'" /tmp/apois-release-badging.txt
          grep -Fq "versionCode='${GITHUB_RUN_NUMBER}'" /tmp/apois-release-badging.txt
          grep -Fq "versionName='1.0.${GITHUB_RUN_NUMBER}'" /tmp/apois-release-badging.txt
          echo "APOIS_ANDROID_IDENTITY_OK package=$EXPECTED_PACKAGE versionCode=$GITHUB_RUN_NUMBER versionName=1.0.$GITHUB_RUN_NUMBER"

      - name: Validate Android permissions
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=android/app/build/outputs/apk/release/app-release-signed.apk
          "$AAPT_PATH" dump permissions "$RELEASE_APK" | tee /tmp/apois-release-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/apois-release-permissions.txt
          grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' /tmp/apois-release-permissions.txt
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' /tmp/apois-release-permissions.txt
          ! grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/apois-release-permissions.txt
          ! grep -Fq 'android.permission.MANAGE_EXTERNAL_STORAGE' /tmp/apois-release-permissions.txt
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            grep -Fq 'android.permission.POST_NOTIFICATIONS' /tmp/apois-release-permissions.txt
            grep -Fq 'android.permission.VIBRATE' /tmp/apois-release-permissions.txt
          fi
          echo "APOIS_ANDROID_PERMISSIONS_OK"

      - name: Validate APK signature and certificate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=android/app/build/outputs/apk/release/app-release-signed.apk
          "$APKSIGNER_PATH" verify --verbose --print-certs "$RELEASE_APK" | tee /tmp/apois-apksigner.txt
          grep -Fq 'certificate SHA-256 digest:' /tmp/apois-apksigner.txt
          awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' /tmp/apois-apksigner.txt | tr -d '\r[:space:]' > /tmp/apois-signer-sha256.txt
          test -s /tmp/apois-signer-sha256.txt
          grep -Eq '^[0-9a-fA-F]{64}$' /tmp/apois-signer-sha256.txt
          echo "APOIS_ANDROID_APK_SIGNATURE_OK sha256=$(cat /tmp/apois-signer-sha256.txt)"

      - name: Validate AAB signature
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_AAB=android/app/build/outputs/bundle/release/app-release-signed.aab
          jarsigner -verify -verbose -certs "$RELEASE_AAB" | tee /tmp/apois-jarsigner.txt
          echo "APOIS_ANDROID_AAB_SIGNATURE_OK"

      - name: Validate Android release SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/bundle/release/app-release-signed.aab \
            | tee /tmp/apois-release-sha256.txt
          test "$(wc -l < /tmp/apois-release-sha256.txt)" -eq 3
          echo "APOIS_ANDROID_HASHES_OK"

      - name: Write artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/artifact-manifest-${APOIS_MOBILE_PRODUCT}.txt"
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            PACKAGE_ID="br.com.apois.entregador"
            PUSH_CONFIGURED="true"
          else
            PACKAGE_ID="br.com.apois.cliente"
            PUSH_CONFIGURED="false"
          fi
          {
            echo "product=${APOIS_MOBILE_PRODUCT}"
            echo "head_sha=${GITHUB_SHA}"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "version_name=1.0.${GITHUB_RUN_NUMBER}"
            echo "package_id=${PACKAGE_ID}"
            echo "native_push_configured=${PUSH_CONFIGURED}"
            echo "signed=true"
            echo "signer_certificate_sha256=$(cat /tmp/apois-signer-sha256.txt)"
            for FILE in \
              android/app/build/outputs/apk/debug/app-debug.apk \
              android/app/build/outputs/apk/release/app-release-signed.apk \
              android/app/build/outputs/bundle/release/app-release-signed.aab; do
              echo "file=$FILE"
              echo "bytes=$(stat -c %s "$FILE")"
              echo "sha256=$(sha256sum "$FILE" | awk '{print $1}')"
            done
          } > "$MANIFEST"
          cat "$MANIFEST"

      - name: Remove decoded secrets
        if: always()
        run: rm -f android/apois-release.keystore android/app/google-services.json

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apois-${{ matrix.product }}-android-release
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/bundle/release/app-release-signed.aab
            android/artifact-manifest-${{ matrix.product }}.txt
