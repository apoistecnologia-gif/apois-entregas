name: Mobile Android

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-android.yml"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "public/favicon.png"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        product:
          - courier
          - customer
    env:
      APOIS_MOBILE_PRODUCT: ${{ matrix.product }}
      APOIS_MOBILE_BUILD: "1"
      VITE_APOIS_PRODUCT_MODE: ${{ matrix.product }}
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      ANDROID_COURIER_KEYSTORE_BASE64: ${{ secrets.ANDROID_COURIER_KEYSTORE_BASE64 }}
      ANDROID_COURIER_STORE_PASSWORD: ${{ secrets.ANDROID_COURIER_STORE_PASSWORD }}
      ANDROID_COURIER_KEY_ALIAS: ${{ secrets.ANDROID_COURIER_KEY_ALIAS }}
      ANDROID_COURIER_KEY_PASSWORD: ${{ secrets.ANDROID_COURIER_KEY_PASSWORD }}
      ANDROID_CUSTOMER_KEYSTORE_BASE64: ${{ secrets.ANDROID_CUSTOMER_KEYSTORE_BASE64 }}
      ANDROID_CUSTOMER_STORE_PASSWORD: ${{ secrets.ANDROID_CUSTOMER_STORE_PASSWORD }}
      ANDROID_CUSTOMER_KEY_ALIAS: ${{ secrets.ANDROID_CUSTOMER_KEY_ALIAS }}
      ANDROID_CUSTOMER_KEY_PASSWORD: ${{ secrets.ANDROID_CUSTOMER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Validate production runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            KS_B64="$ANDROID_COURIER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
            KEY_PASS="$ANDROID_COURIER_KEY_PASSWORD"
          else
            KS_B64="$ANDROID_CUSTOMER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
            KEY_PASS="$ANDROID_CUSTOMER_KEY_PASSWORD"
          fi

          SIGNING_CONFIGURED=false
          if [ -n "$KS_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            SIGNING_CONFIGURED=true
          fi

          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
            test "$VITE_SUPABASE_PUBLISHABLE_KEY" != "ci-placeholder"
            test -n "$VITE_GOOGLE_MAPS_BROWSER_KEY"
            test "$VITE_GOOGLE_MAPS_BROWSER_KEY" != "ci-placeholder"
            test -n "$VITE_GOOGLE_MAPS_MAP_ID"
            test "$VITE_GOOGLE_MAPS_MAP_ID" != "ci-placeholder"
          fi

      - name: Build product web bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            bun run build:courier
          else
            bun run build:customer
          fi

      - name: Render Capacitor entry from built app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            PRODUCT_PATH="/courier"
            EXPECTED_TITLE="APOIS Entregador"
          else
            PRODUCT_PATH="/"
            EXPECTED_TITLE="APOIS Cliente"
          fi

          HOST=127.0.0.1 PORT=4173 node .output/server/index.mjs > /tmp/apois-mobile-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "http://127.0.0.1:4173${PRODUCT_PATH}" -o .output/public/index.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/apois-mobile-server.log
              exit 1
            fi
            sleep 1
          done

          test -s .output/public/index.html
          grep -qi '<html' .output/public/index.html
          grep -qi '<script' .output/public/index.html
          grep -Fq "$EXPECTED_TITLE" .output/public/index.html

      - name: Install Capacitor runtime for packaging
        run: npm install --no-save @capacitor/core@8.4.2 @capacitor/cli@8.4.2 @capacitor/android@8.4.2

      - name: Create Android native project
        run: npx cap add android

      - name: Configure Android identity, version, permissions and branding
        shell: python
        run: |
          from pathlib import Path
          import re

          product = "courier" if Path("capacitor.config.ts").exists() and __import__("os").environ["APOIS_MOBILE_PRODUCT"] == "courier" else "customer"
          app_name = "APOIS Entregador" if product == "courier" else "APOIS Cliente"
          expected_package = "br.com.apois.entregador" if product == "courier" else "br.com.apois.cliente"

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          )
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              text = text.replace(marker, marker + permissions, 1)
          if "android:usesCleartextTraffic" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="false"', 1)
          manifest.write_text(text, encoding="utf-8")

          strings = Path("android/app/src/main/res/values/strings.xml")
          strings_text = strings.read_text(encoding="utf-8")
          strings_text = re.sub(r'(<string name="app_name">).*?(</string>)', rf'\1{app_name}\2', strings_text)
          strings_text = re.sub(r'(<string name="title_activity_main">).*?(</string>)', rf'\1{app_name}\2', strings_text)
          strings.write_text(strings_text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          gradle_text = re.sub(r"versionCode\s+\d+", "versionCode 1", gradle_text, count=1)
          gradle_text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding="utf-8")

          res = Path("android/app/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          icon_source = Path("public/favicon.png")
          if not icon_source.exists():
              raise SystemExit("public/favicon.png is required for Android branding")
          (drawable / "apois_icon.png").write_bytes(icon_source.read_bytes())

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "colors.xml"
          colors.write_text(
              '''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="apois_black">#000000</color>\n    <color name="apois_gold">#F6B900</color>\n</resources>\n''',
              encoding="utf-8",
          )

          for png in res.glob("drawable*/splash.png"):
              png.unlink()
          (drawable / "splash.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:drawable="@color/apois_black" />\n    <item android:gravity="center">\n        <bitmap android:src="@drawable/apois_icon" android:gravity="center" />\n    </item>\n</layer-list>\n''',
              encoding="utf-8",
          )

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/apois_black" />\n    <foreground android:drawable="@drawable/apois_icon" />\n</adaptive-icon>\n'''
          (anydpi / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")

          java_root = Path("android/app/src/main/java")
          package_path = java_root.joinpath(*expected_package.split("."))
          if not package_path.exists():
              raise SystemExit(f"Expected Android package directory not found: {package_path}")

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Validate native Android package and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          ! grep -q 'android.permission.CAMERA' "$MANIFEST"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$MANIFEST"
          ! grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$MANIFEST"

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare production signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            KS_B64="$ANDROID_COURIER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
            KEY_PASS="$ANDROID_COURIER_KEY_PASSWORD"
          else
            KS_B64="$ANDROID_CUSTOMER_KEYSTORE_BASE64"
            STORE_PASS="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
            KEY_PASS="$ANDROID_CUSTOMER_KEY_PASSWORD"
          fi

          if [ -n "$KS_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 --decode > android/apois-release.keystore
            keytool -list -keystore android/apois-release.keystore -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            STORE_PASSWORD="$ANDROID_COURIER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_COURIER_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_COURIER_KEY_PASSWORD"
          else
            STORE_PASSWORD="$ANDROID_CUSTOMER_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_CUSTOMER_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_CUSTOMER_KEY_PASSWORD"
          fi
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/apois-release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-signed.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-signed.aab

      - name: Build unsigned release AAB when signing secrets are absent
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: |
          ./gradlew bundleRelease
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/app-release-unsigned.aab

      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            test -s android/app/build/outputs/apk/release/app-release-signed.apk
            test -s android/app/build/outputs/bundle/release/app-release-signed.aab
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release-signed.apk
            jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab >/tmp/apois-jarsigner.txt 2>&1
            grep -qi 'jar verified' /tmp/apois-jarsigner.txt
          else
            test -s android/app/build/outputs/bundle/release/app-release-unsigned.aab
            jarsigner -verify android/app/build/outputs/bundle/release/app-release-unsigned.aab >/tmp/apois-jarsigner.txt 2>&1 || true
            grep -qi 'jar is unsigned' /tmp/apois-jarsigner.txt
          fi

      - name: Write artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/artifact-manifest-${APOIS_MOBILE_PRODUCT}.txt"
          {
            echo "product=${APOIS_MOBILE_PRODUCT}"
            echo "head_sha=${GITHUB_SHA}"
            echo "version_code=1"
            echo "version_name=1.0.0"
            if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
              echo "package_id=br.com.apois.entregador"
            else
              echo "package_id=br.com.apois.cliente"
            fi
            echo "signed=${{ steps.signing.outputs.signed }}"
            for FILE in \
              android/app/build/outputs/apk/debug/app-debug.apk \
              android/app/build/outputs/apk/release/app-release-signed.apk \
              android/app/build/outputs/bundle/release/app-release-signed.aab \
              android/app/build/outputs/bundle/release/app-release-unsigned.aab; do
              if [ -f "$FILE" ]; then
                echo "file=$FILE"
                echo "bytes=$(stat -c %s "$FILE")"
                echo "sha256=$(sha256sum "$FILE" | awk '{print $1}')"
              fi
            done
          } > "$MANIFEST"
          cat "$MANIFEST"

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/apois-release.keystore

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apois-${{ matrix.product }}-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/bundle/release/app-release-signed.aab
            android/app/build/outputs/bundle/release/app-release-unsigned.aab
            android/artifact-manifest-${{ matrix.product }}.txt
