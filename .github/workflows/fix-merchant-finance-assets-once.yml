name: One-time merchant finance and asset audit fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-merchant-finance-assets-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: python3 .github/scripts/fix_merchant_audit.py
      - run: bunx prettier --write src/routes/merchant.tsx
      - run: bun run typecheck
      - name: Commit audited merchant fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx
          git commit -m "fix(merchant): retire Asaas UI and harden finance uploads"
          git push origin HEAD:main
