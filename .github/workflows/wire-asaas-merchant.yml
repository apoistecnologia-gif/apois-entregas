name: Wire Asaas Merchant Finance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wire-asaas-merchant.yml"

permissions:
  contents: write

jobs:
  wire:
    if: "github.event.head_commit.message != 'feat(merchant): wire Asaas finance flow'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Wire merchant finance
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/routes/merchant.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const importNeedle = 'import { MerchantSubscriptionGate } from "@/components/MerchantSubscriptionGate";\n';
          const importLine = 'import { MerchantAsaasOnboarding } from "@/components/MerchantAsaasOnboarding";\n';
          if (!text.includes(importLine)) {
            if (!text.includes(importNeedle)) throw new Error('Merchant import anchor not found');
            text = text.replace(importNeedle, importNeedle + importLine);
          }

          const oldPayout = `    const { error } = await rpc("request_payout", {\n      _wallet_id: wallet.id,\n      _amount: amount,\n      _idempotency_key: attemptKey,\n    });\n    setBusyAction(null);\n    if (error) return toast.error(error.message || "Não foi possível solicitar o saque.");\n    clearPayoutAttemptKey("merchant", wallet.id, attemptKey);\n    setPayoutDraft((current) => ({ ...current, amount: "" }));\n    toast.success("Saque solicitado.");\n    if (merchant?.id) await loadOperations(merchant.id);`;
          const newPayout = `    const { data: payoutId, error } = await rpc("request_payout", {\n      _wallet_id: wallet.id,\n      _amount: amount,\n      _idempotency_key: attemptKey,\n    });\n    if (error || !payoutId) {\n      setBusyAction(null);\n      return toast.error(error?.message || "Não foi possível solicitar o saque.");\n    }\n    const { data: transferData, error: transferError } = await supabase.functions.invoke(\n      "asaas-payout",\n      { body: { payoutId } },\n    );\n    setBusyAction(null);\n    if (transferError || transferData?.error) {\n      toast.error(\n        transferData?.error ||\n          transferError?.message ||\n          "O saque foi reservado, mas o PIX ainda não pôde ser enviado.",\n      );\n      if (merchant?.id) await loadOperations(merchant.id);\n      return;\n    }\n    clearPayoutAttemptKey("merchant", wallet.id, attemptKey);\n    setPayoutDraft((current) => ({ ...current, amount: "" }));\n    toast.success(\n      transferData?.status === "paid"\n        ? "Saque enviado por PIX com sucesso."\n        : "Saque enviado ao Asaas e em processamento.",\n    );\n    if (merchant?.id) await loadOperations(merchant.id);`;
          if (!text.includes(newPayout)) {
            if (!text.includes(oldPayout)) throw new Error('Payout function anchor not found');
            text = text.replace(oldPayout, newPayout);
          }

          const financeNeedle = '      {activeTab === "finance" && (\n        <div className="space-y-6">\n';
          const financeReplacement = '      {activeTab === "finance" && (\n        <div className="space-y-6">\n          <MerchantAsaasOnboarding merchant={merchant} />\n';
          if (!text.includes('<MerchantAsaasOnboarding merchant={merchant} />')) {
            if (!text.includes(financeNeedle)) throw new Error('Finance render anchor not found');
            text = text.replace(financeNeedle, financeReplacement);
          }

          fs.writeFileSync(path, text);
          NODE
          bunx prettier --write src/routes/merchant.tsx src/components/MerchantAsaasOnboarding.tsx
      - name: Commit merchant wiring
        run: |
          if git diff --quiet; then
            echo "No merchant wiring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx src/components/MerchantAsaasOnboarding.tsx
          git commit -m "feat(merchant): wire Asaas finance flow"
          git push origin main
