name: One-shot merchant order kanban

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merchant-kanban.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build operational order board
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Format and commit changes
        run: |
          npx prettier@3.9.6 src/routes/merchant.tsx --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx
          git commit -m "feat(merchant): add operational order kanban"
          git push
