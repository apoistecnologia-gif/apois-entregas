name: Patch Customer Payment Details

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-customer-payment-details.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python .github/scripts/patch-customer-payment-details.py
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bunx prettier --write 'src/routes/pedido/$orderId/index.tsx' supabase/functions/create-pix-charge/index.ts
      - name: Validate
        run: |
          bun run typecheck
          bun run lint
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/pedido/$orderId/index.tsx' supabase/functions/create-pix-charge/index.ts
          git commit -m "fix(customer): render OpenPix QR reliably and preserve order details"
          git pull --rebase origin main
          git push origin HEAD:main

# Triggered after Android homologation exposed sandbox QR rendering and order relation loading issues.
