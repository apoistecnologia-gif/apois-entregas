name: Patch Final Homologation UX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-final-homologation-ux.yml"
      - ".github/scripts/patch-final-homologation-ux.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply customer and courier homologation fixes
        run: python .github/scripts/patch-final-homologation-ux.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format touched files
        run: bunx prettier --write src/routes/checkout.tsx 'src/routes/pedido/$orderId/index.tsx' src/components/CourierRouteMap.tsx
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx 'src/routes/pedido/$orderId/index.tsx' src/components/CourierRouteMap.tsx
          git commit -m "fix(homologation): payment redirect customer PIN and courier map"
          git push origin HEAD:main
