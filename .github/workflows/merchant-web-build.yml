name: Merchant Web Build
# Audited production redeploy after merchant location hardening and operational UX feedback.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/merchant-web-build.yml"
      - "src/**"
      - "scripts/build-product.mjs"
      - "scripts/apply-merchant-ux-feedback.py"
      - "vite.config.ts"
      - "vercel.json"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APOIS_PRODUCT_MODE: merchant
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || 'ci-placeholder' }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID || 'ci-placeholder' }}
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_MxPK6zSoXIjac5egZRYmBXVhKTs6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply merchant operational UX feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-merchant-ux-feedback.py
          if ! git diff --quiet -- src/routes/merchant.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/merchant.tsx
            git commit -m "fix(merchant): surface operational action feedback"
            git push origin HEAD:main
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build isolated merchant product
        run: bun run build:merchant

      - name: Validate merchant Nitro build
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public/assets
          test -f .output/server/index.mjs
          MERCHANT_CHUNK="$(find .output/public/assets -maxdepth 1 -type f -name 'merchant-*.js' -print -quit)"
          if [ -z "$MERCHANT_CHUNK" ]; then
            echo "ERROR: merchant route chunk was not generated"
            exit 1
          fi
          echo "Merchant chunk: $MERCHANT_CHUNK"
          echo "APOIS_ENTREGAS_MERCHANT_BUILD_OK"

      - name: Upload merchant Nitro prebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: apois-entregas-merchant-prebuilt
          path: .output
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "ERROR: GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production bundle
        env:
          APOIS_VERCEL_BUILD: "1"
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Detach Git metadata for Hobby CLI deployment
        shell: bash
        run: rm -rf .git

      - name: Deploy merchant panel to Vercel production
        run: bunx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      - name: Gate Merchant production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://parceiros.apoisbrasil.com.br"

          for attempt in $(seq 1 20); do
            LOGIN_STATUS="$(curl -sS -o /tmp/apois-merchant-login.html -w '%{http_code}' "$BASE/login")"
            MERCHANT_STATUS="$(curl -sS -o /tmp/apois-merchant-workspace.html -w '%{http_code}' "$BASE/merchant")"

            if [ "$LOGIN_STATUS" = "200" ] && [ "$MERCHANT_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Merchant route gate failed: login=$LOGIN_STATUS merchant=$MERCHANT_STATUS" >&2
              exit 1
            fi
            sleep 3
          done

          test -s /tmp/apois-merchant-login.html
          test -s /tmp/apois-merchant-workspace.html
          grep -qi '<html' /tmp/apois-merchant-login.html
          grep -qi '<html' /tmp/apois-merchant-workspace.html
          ! grep -Fqi 'DEPLOYMENT_NOT_FOUND' /tmp/apois-merchant-login.html
          ! grep -Fqi 'DEPLOYMENT_NOT_FOUND' /tmp/apois-merchant-workspace.html
          ! grep -Fqi 'Internal Server Error' /tmp/apois-merchant-login.html
          ! grep -Fqi 'Internal Server Error' /tmp/apois-merchant-workspace.html
          ! grep -Fqi 'APOIS Administração' /tmp/apois-merchant-login.html
          ! grep -Fqi 'Administração | APOIS ENTREGA' /tmp/apois-merchant-workspace.html
          echo "APOIS_MERCHANT_PRODUCTION_ROUTES_OK login=$LOGIN_STATUS merchant=$MERCHANT_STATUS"
