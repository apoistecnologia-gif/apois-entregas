name: Fix courier alert once

on:
  push:
    paths:
      - ".github/workflows/fix-courier-alert-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Harden courier foreground alert
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/CourierOfferOverlay.tsx')
          s = path.read_text(encoding='utf-8')

          old = '''    const context = audioContextRef.current;
              if (!context || !audioUnlockedRef.current) return;
              if (context.state === "suspended") void context.resume();

              const startAt = context.currentTime + 0.03;'''.replace('              ', '    ')
          new = '''    let context = audioContextRef.current;
              if (!context) {
                const audioWindow = window as WindowWithWebkitAudioContext;
                const AudioContextCtor = audioWindow.AudioContext || audioWindow.webkitAudioContext;
                if (!AudioContextCtor) return;
                context = new AudioContextCtor();
                audioContextRef.current = context;
              }
              if (context.state === "suspended") {
                void context.resume().then(() => {
                  audioUnlockedRef.current = context?.state === "running";
                });
                return;
              }
              if (context.state !== "running") return;
              audioUnlockedRef.current = true;

              const startAt = context.currentTime + 0.03;'''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('pulse alert block not found')
          s = s.replace(old, new, 1)

          old = '''    const poll = window.setInterval(refresh, 2500);

              return () => {
                window.clearInterval(poll);
                void supabase.removeChannel(offersChannel);
                void supabase.removeChannel(availabilityChannel);
              };'''.replace('              ', '    ')
          new = '''    const poll = window.setInterval(refresh, 1000);
              const onForeground = () => {
                if (document.visibilityState === "visible") refresh();
              };
              window.addEventListener("focus", refresh);
              document.addEventListener("visibilitychange", onForeground);

              return () => {
                window.clearInterval(poll);
                window.removeEventListener("focus", refresh);
                document.removeEventListener("visibilitychange", onForeground);
                void supabase.removeChannel(offersChannel);
                void supabase.removeChannel(availabilityChannel);
              };'''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('poll block not found')
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {
              stopAlert();
              if (!offerId) return;
              pulseAlert();
              alertTimerRef.current = window.setInterval(pulseAlert, 2800);
              return stopAlert;
            }, [offerId, pulseAlert, stopAlert]);'''.replace('            ', '  ')
          new = '''  useEffect(() => {
              stopAlert();
              if (!offerId) return;
              void callRpc("ack_courier_offer_seen", {
                _offer_id: offerId,
                _channel: "courier_offer_overlay",
              });
              pulseAlert();
              window.setTimeout(pulseAlert, 220);
              alertTimerRef.current = window.setInterval(pulseAlert, 2800);
              return stopAlert;
            }, [offerId, pulseAlert, stopAlert]);'''.replace('            ', '  ')
          if old not in s:
              raise SystemExit('offer alert effect not found')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/mobile-android.yml')
          w = wf.read_text(encoding='utf-8')
          old = '''              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n'
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\\n'
          )'''
          new = '''              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\\n'
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\\n'
          )'''
          if old not in w:
              raise SystemExit('manifest permission block not found')
          w = w.replace(old, new, 1)

          old = '''          if not package_path.exists():
              raise SystemExit(f"Expected Android package directory not found: {package_path}")
'''
          new = '''          if not package_path.exists():
              raise SystemExit(f"Expected Android package directory not found: {package_path}")

          if product == "courier":
              main_activity = package_path / "MainActivity.java"
              main_activity.write_text(
                  f'''package {expected_package};

import android.os.Bundle;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {{
    @Override
    protected void onCreate(Bundle savedInstanceState) {{
        super.onCreate(savedInstanceState);
        if (getBridge() != null && getBridge().getWebView() != null) {{
            getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
        }}
    }}
}}
''',
                  encoding="utf-8",
              )
'''
          if old not in w:
              raise SystemExit('package validation block not found')
          w = w.replace(old, new, 1)

          old = '''          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"'''
          new = '''          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.VIBRATE' "$MANIFEST"
          ! grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"'''
          if old not in w:
              raise SystemExit('manifest validation block not found')
          w = w.replace(old, new, 1)
          wf.write_text(w, encoding='utf-8')
          PY

      - uses: oven-sh/setup-bun@v2

      - name: Validate courier alert fix
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/components/CourierOfferOverlay.tsx
          bun run typecheck
          bun run build:courier

      - name: Commit fix and rebuild courier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-courier-alert-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierOfferOverlay.tsx .github/workflows/mobile-android.yml .github/workflows/fix-courier-alert-once.yml
          git commit -m "fix(courier): make incoming delivery alert reliable"
          git push origin HEAD:main
          gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main -f product=courier
