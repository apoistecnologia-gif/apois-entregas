name: Reconcile Webhook Production Source

on:
  push:
    paths:
      - ".github/workflows/reconcile-webhook-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Keep webhook source aligned with deployed v16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/mercadopago-webhook/index.ts')
          t=p.read_text()
          block='''  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    console.error("mercadopago-webhook payment environment mismatch", {\n      edgeEnvironment: environment,\n      databaseEnvironment,\n    });\n    return response(503, { error: "payment_environment_mismatch" });\n  }\n\n'''
          if block not in t: raise SystemExit('webhook environment block not found')
          p.write_text(t.replace(block,'',1))
          PY
      - name: Verify and commit
        run: |
          bunx prettier --write supabase/functions/mercadopago-webhook/index.ts
          bun run typecheck
          bun run test
          bun run build
          bun run lint
          bun run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mercadopago-webhook/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(payments): align webhook with deployed environment guard"
          git push
