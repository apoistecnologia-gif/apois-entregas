name: Cleanup courier final once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-courier-final-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APOIS_PRODUCT: courier
      VITE_APOIS_PRODUCT_MODE: courier
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
      VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Remove temporary courier audit files
        run: |
          rm -f .github/workflows/courier-final-audit-once.yml
          rm -f .github/workflows/cleanup-courier-final-once.yml
      - name: Install
        run: bun install --frozen-lockfile
      - name: Repository safety audit
        run: bun run audit:repo
      - name: Final courier quality
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          APOIS_PRODUCT=courier bun run build:courier
      - name: Commit and push cleanup safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove temporary courier audit files"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            bun run audit:repo
            bun run typecheck
            bun run test
            bun run lint
            bun run format:check
            APOIS_PRODUCT=courier bun run build:courier
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
