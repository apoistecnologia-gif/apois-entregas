name: Complete support attachments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-support-attachments.yml
      - .github/scripts/complete-support-attachments.py

permissions:
  contents: write

concurrency:
  group: complete-support-attachments
  cancel-in-progress: false

jobs:
  complete-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/complete-support-attachments.py
      - run: bunx prettier 'src/routes/perfil/ajuda/chamado/$ticketId.tsx' src/routes/admin.tsx src/components/AdminSupportPanel.tsx supabase/functions/customer-support/index.ts --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit and safely integrate concurrent main updates
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/complete-support-attachments.yml .github/scripts/complete-support-attachments.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(support): complete secure attachment flow"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              bun run format
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore: format after concurrent main merge"
              fi
              bun run build
              bun run typecheck
              bun run test
              bun run format:check
              bun run lint
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying safely (${attempt}/3)."
          done

          echo "Could not push after three safe retries."
          exit 1
