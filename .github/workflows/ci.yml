name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
  VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Repository safety audit
        run: bun run audit:repo
      - name: Build and generate routes
        run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check

  product-builds:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        product:
          - customer
          - courier
          - merchant
          - admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.product }} product
        run: bun run build:${{ matrix.product }}
      - name: Verify isolated product output
        shell: bash
        run: |
          set -euo pipefail
          test -d .output/public
          test -f .output/server/index.mjs
          node scripts/verify-product-isolation.mjs "${{ matrix.product }}"
