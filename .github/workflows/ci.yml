name: Validate APOIS Entregas

on:
  push:
    branches:
      - agent/apois-entregas-completo
  pull_request:

permissions:
  contents: read

jobs:
  customer-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        if: matrix.check == 'lint'
        run: bun run lint

      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: bunx tsc --noEmit

      - name: Build
        if: matrix.check == 'build'
        run: bun run build
