name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate routes
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Capture lint report
        if: always()
        run: bunx eslint . --format json --output-file lint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Lint
        run: bun run lint
