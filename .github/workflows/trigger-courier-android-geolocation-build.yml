name: Trigger Courier Android Geolocation Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-courier-android-geolocation-build.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch courier Android build
        env:
          GH_TOKEN: ${{ github.token }}
        # Triggered after final active-route map UX correction.
        run: gh workflow run mobile-android.yml --repo "${{ github.repository }}" --ref main -f product=courier
