name: Add merchant reports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-merchant-reports.yml
      - .github/scripts/add-merchant-reports.py

permissions:
  contents: write

concurrency:
  group: add-merchant-reports
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply merchant reports
        run: python .github/scripts/add-merchant-reports.py
      - name: Format repository
        run: bun run format
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit and safely integrate concurrent main updates
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          git config user.name "franciel046631"
          git config user.email "franciellopes22@gmail.com"
          rm -f .github/scripts/add-merchant-reports.py .github/workflows/add-merchant-reports.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(merchant): add operational reports"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              bun run format
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore: format after concurrent main merge"
              fi
              bun run build
              bun run typecheck
              bun run test
              bun run format:check
              bun run lint
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying safely (${attempt}/3)."
          done

          echo "Could not push after three safe retries."
          exit 1
