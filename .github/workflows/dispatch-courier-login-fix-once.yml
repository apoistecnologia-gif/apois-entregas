name: Dispatch Courier Login Fix Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-courier-login-fix-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Build updated courier Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main --field product=courier
