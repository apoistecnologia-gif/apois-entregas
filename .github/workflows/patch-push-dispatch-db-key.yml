name: Patch Push Dispatch DB Key

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-push-dispatch-db-key.yml"
      - ".github/scripts/patch-push-dispatch-db-key.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch dispatcher auth
        run: python .github/scripts/patch-push-dispatch-db-key.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/dispatch-push-outbox/index.ts
          git commit -m "fix(push): validate dispatcher key against database runtime secret"
          git push origin HEAD:main
