name: Fix Checkout Order Route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-checkout-order-route.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/fix-checkout-order-route.py
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/checkout.tsx
      - run: bun run typecheck
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/checkout.tsx
          git commit -m "fix(customer): use typed order details route after payment"
          git pull --rebase origin main
          git push origin HEAD:main
