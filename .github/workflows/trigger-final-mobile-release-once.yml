name: Trigger Final Mobile Release Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-final-mobile-release-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Mobile Android for both products on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-android.yml/dispatches \
            -f ref=main \
            -f inputs[product]=both
          echo "APOIS_FINAL_MOBILE_DISPATCH_OK"
