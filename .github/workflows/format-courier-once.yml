name: Format courier visual changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-courier-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format courier files
        run: |
          bunx prettier --write \
            src/routes/login.tsx \
            src/routes/courier.tsx \
            src/components/CourierPanels.tsx \
            src/components/CourierRouteMap.tsx \
            src/components/CourierPremiumViews.tsx \
            src/components/CourierCompletionSupport.tsx
          rm .github/workflows/format-courier-once.yml
      - name: Commit formatting and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/login.tsx src/routes/courier.tsx src/components/CourierPanels.tsx src/components/CourierRouteMap.tsx src/components/CourierPremiumViews.tsx src/components/CourierCompletionSupport.tsx .github/workflows/format-courier-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(courier): format premium visual implementation"
          git push origin HEAD:main
