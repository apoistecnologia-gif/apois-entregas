name: Inspect Admin Vercel Routing Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-admin-vercel-routing-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN missing" >&2; exit 1; }

      - name: Link Admin Vercel project
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Inspect live project routing rules
        shell: bash
        run: |
          set +e
          echo '=== VERCEL ROUTES LIST PRODUCTION EXPANDED ==='
          bunx vercel routes list --production --expand --token "$VERCEL_TOKEN"
          echo "routes-list-exit=$?"
          echo '=== VERCEL ROUTES EXPORT ==='
          bunx vercel routes export --token "$VERCEL_TOKEN" > /tmp/routes-export.txt 2>&1
          ROUTES_EXPORT_EXIT=$?
          cat /tmp/routes-export.txt
          echo "routes-export-exit=$ROUTES_EXPORT_EXIT"
          echo '=== VERCEL REDIRECTS LIST ==='
          bunx vercel redirects list --per-page 100 --token "$VERCEL_TOKEN"
          echo "redirects-list-exit=$?"
          echo '=== VERCEL ROUTES VERSIONS ==='
          bunx vercel routes list-versions --token "$VERCEL_TOKEN"
          echo "routes-versions-exit=$?"
          exit 0
