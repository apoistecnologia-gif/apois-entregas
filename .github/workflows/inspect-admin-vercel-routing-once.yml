name: Remove Stale Admin Vercel Root Route Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-admin-vercel-routing-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_shDkxHdc4ARgsiLdRaLSz0zA
      VERCEL_PROJECT_ID: prj_KjPKn2tXBIqxqCNzRxInuVXLLxNO
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STALE_ROUTE_ID: e06005be-c489-41a0-9ec4-8d2d6de41b8c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN missing" >&2; exit 1; }

      - name: Link Admin Vercel project
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Verify stale route identity
        shell: bash
        run: |
          set -euo pipefail
          bunx vercel routes inspect "$STALE_ROUTE_ID" --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/stale-route.txt
          grep -Eq 'Source:[[:space:]]+/$' /tmp/stale-route.txt
          grep -Eq 'Destination:[[:space:]]+/admin/login$' /tmp/stale-route.txt
          grep -Eq 'HTTP Status:[[:space:]]+307$' /tmp/stale-route.txt
          echo 'APOIS_ADMIN_STALE_ROUTE_CONFIRMED'

      - name: Delete only the stale root redirect
        run: bunx vercel routes delete "$STALE_ROUTE_ID" --yes --token "$VERCEL_TOKEN"

      - name: Review staged routing diff
        shell: bash
        run: |
          set -euo pipefail
          bunx vercel routes list --diff --expand --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/routes-diff.txt
          echo 'APOIS_ADMIN_ROUTE_DELETE_STAGED'

      - name: Publish routing repair
        run: bunx vercel routes publish --yes --token "$VERCEL_TOKEN"

      - name: Verify no live project route remains
        shell: bash
        run: |
          set -euo pipefail
          bunx vercel routes list --production --expand --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/routes-live.txt
          if grep -Fq '/admin/login' /tmp/routes-live.txt; then
            echo 'Stale /admin/login project route is still live' >&2
            exit 1
          fi
          echo 'APOIS_ADMIN_PROJECT_ROUTES_CLEAN'

      - name: Validate Admin root after route repair
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://admin.apoisbrasil.com.br'
          for attempt in $(seq 1 20); do
            ROOT_STATUS="$(curl -sS -o /tmp/admin-root.html -w '%{http_code}' "$BASE/")"
            LOGIN_STATUS="$(curl -sS -o /tmp/admin-login.html -w '%{http_code}' "$BASE/login")"
            ADMIN_STATUS="$(curl -sS -o /tmp/admin-workspace.html -w '%{http_code}' "$BASE/admin")"
            if [ "$ROOT_STATUS" = '200' ] && [ "$LOGIN_STATUS" = '200' ] && [ "$ADMIN_STATUS" = '200' ]; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Admin route repair failed: root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS" >&2
              exit 1
            fi
            sleep 3
          done
          grep -Fq '<title>APOIS Administração</title>' /tmp/admin-root.html
          grep -Fq 'Abrindo o acesso correto' /tmp/admin-root.html
          ! grep -Fq 'Seu delivery do seu jeito' /tmp/admin-root.html
          echo "APOIS_ADMIN_ROOT_REPAIRED root=$ROOT_STATUS login=$LOGIN_STATUS admin=$ADMIN_STATUS"
