name: Merchant location hardening once

on:
  push:
    paths:
      - ".github/workflows/merchant-location-hardening-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Apply merchant location patch
        run: |
          bun install --frozen-lockfile
          python scripts/merchant-location-hardening.py
          bunx prettier --write src/components/GoogleMapsAddressSelector.tsx src/routes/merchant.tsx
      - name: Validate merchant product
        run: |
          bun run typecheck
          bun run test
          bun run build:merchant
      - name: Commit validated patch
        run: |
          rm .github/workflows/merchant-location-hardening-once.yml
          rm scripts/merchant-location-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GoogleMapsAddressSelector.tsx src/routes/merchant.tsx .github/workflows/merchant-location-hardening-once.yml scripts/merchant-location-hardening.py
          git commit -m "fix(merchant): persist address and coordinates atomically"
          git push origin HEAD:main
