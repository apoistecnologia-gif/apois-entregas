name: Apply Monthly PIX Webhook

on:
  push:
    paths:
      - ".github/workflows/apply-monthly-webhook.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download monthly PIX webhook artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/monthly-webhook
          gh run download 31361850605 -n monthly-webhook-file -D /tmp/monthly-webhook
          cp /tmp/monthly-webhook/index.ts supabase/functions/mercadopago-webhook/index.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate webhook formatting
        run: bunx prettier --check supabase/functions/mercadopago-webhook/index.ts
      - name: Commit monthly PIX webhook reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mercadopago-webhook/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(billing): reconcile merchant monthly PIX by webhook"
          git push
