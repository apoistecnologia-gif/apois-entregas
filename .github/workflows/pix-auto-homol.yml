name: One-shot Mercado Pago refund homologation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pix-auto-homol.yml

jobs:
  homologate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Mercado Pago refund flow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 150 \
            --request POST \
            'https://sbvhdgyuuperszlsllji.supabase.co/functions/v1/apois-pix-auto-homol-8f4c3e9a' \
            --output /tmp/refund-homol.json || {
              cat /tmp/refund-homol.json 2>/dev/null || true
              exit 1
            }
          cat /tmp/refund-homol.json
          jq -e '
            .success == true and
            .refundStatus == "completed" and
            .paymentStatus == "refunded" and
            .orderPaymentStatus == "refunded" and
            (.providerStatus == "refunded" or .providerStatusDetail == "refunded") and
            .realPaymentUsed == false and
            .simulatorUsed == false
          ' /tmp/refund-homol.json >/dev/null
