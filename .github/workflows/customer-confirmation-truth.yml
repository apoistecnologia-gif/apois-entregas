name: Customer payment confirmation truth gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/customer-confirmation-truth.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prevent false paid confirmation on deep links
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/pedido/confirmado.tsx")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'import { CheckCircle2, ArrowRight, XCircle } from "lucide-react";',
              'import { CheckCircle2, ArrowRight, Clock3, XCircle } from "lucide-react";',
              1,
          )

          old = '''  const isRefunded = order.status === "refunded" || order.payment_status === "refunded";
  const isCancelled = order.status === "cancelled";
  const isUnavailable = isRefunded || isCancelled;
  const fulfillmentStarted = ['''
          new = '''  const isRefunded = order.status === "refunded" || order.payment_status === "refunded";
  const isCancelled = order.status === "cancelled";
  const isUnavailable = isRefunded || isCancelled;
  const isPaid = order.payment_status === "paid";
  const isPendingPayment = !isUnavailable && !isPaid;
  const fulfillmentStarted = ['''
          if old not in text:
              raise SystemExit("confirmation state anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const title = isRefunded
    ? "Pagamento reembolsado"
    : isCancelled
      ? "Pedido cancelado"
      : "Pagamento confirmado ✓";
  const description = isRefunded
    ? "O pagamento deste pedido foi reembolsado. Consulte os detalhes para acompanhar o registro do estorno."
    : isCancelled
      ? "Este pedido foi cancelado e não seguirá para preparo ou entrega."
      : fulfillmentStarted
        ? "O pagamento foi confirmado e o pedido já avançou no fluxo do estabelecimento."
        : "O pagamento foi confirmado e o pedido foi registrado. Acompanhe a próxima atualização em Meus Pedidos.";'''
          new = '''  const title = isRefunded
    ? "Pagamento reembolsado"
    : isCancelled
      ? "Pedido cancelado"
      : isPendingPayment
        ? "Pagamento em processamento"
        : "Pagamento confirmado ✓";
  const description = isRefunded
    ? "O pagamento deste pedido foi reembolsado. Consulte os detalhes para acompanhar o registro do estorno."
    : isCancelled
      ? "Este pedido foi cancelado e não seguirá para preparo ou entrega."
      : isPendingPayment
        ? "Ainda aguardamos a confirmação do PIX. Não feche um novo pedido para tentar pagar novamente: acompanhe o status deste pedido."
        : fulfillmentStarted
          ? "O pagamento foi confirmado e o pedido já avançou no fluxo do estabelecimento."
          : "O pagamento foi confirmado e o pedido foi registrado. Acompanhe a próxima atualização em Meus Pedidos.";'''
          if old not in text:
              raise SystemExit("confirmation title anchor missing")
          text = text.replace(old, new, 1)

          old = '''      <div
        className={`mb-6 flex h-20 w-20 items-center justify-center rounded-full ${
          isUnavailable
            ? "bg-red-500/10 text-red-400"
            : "bg-primary/20 text-primary shadow-[0_0_30px_rgba(255,215,0,0.3)]"
        }`}
      >
        {isUnavailable ? <XCircle className="h-12 w-12" /> : <CheckCircle2 className="h-12 w-12" />}
      </div>'''
          new = '''      <div
        className={`mb-6 flex h-20 w-20 items-center justify-center rounded-full ${
          isUnavailable
            ? "bg-red-500/10 text-red-400"
            : isPendingPayment
              ? "bg-amber-500/10 text-amber-300"
              : "bg-primary/20 text-primary shadow-[0_0_30px_rgba(255,215,0,0.3)]"
        }`}
      >
        {isUnavailable ? (
          <XCircle className="h-12 w-12" />
        ) : isPendingPayment ? (
          <Clock3 className="h-12 w-12" />
        ) : (
          <CheckCircle2 className="h-12 w-12" />
        )}
      </div>'''
          if old not in text:
              raise SystemExit("confirmation icon anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and verify
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bunx prettier src/routes/pedido/confirmado.tsx --write
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/customer-confirmation-truth.yml
          rm -f .github/workflows/hygiene-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): avoid false payment confirmation"
          git push
