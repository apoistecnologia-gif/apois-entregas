name: One-time courier start offline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-courier-start-offline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply startup availability fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/courier.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import { useCallback, useEffect, useMemo, useState } from "react";', 'import { useCallback, useEffect, useMemo, useRef, useState } from "react";', 1)
          needle = '  const [currentPosition, setCurrentPosition] = useState<CourierPosition | null>(null);\n'
          repl = needle + '  const startupAvailabilityHandledRef = useRef(false);\n'
          if needle not in s:
              raise SystemExit('state insertion target not found')
          s = s.replace(needle, repl, 1)
          old = '''        if (courierRow.status === "approved" && courierRow.is_active)\n          await loadCourierOperations(courierRow.id);'''
          new = '''        if (courierRow.status === "approved" && courierRow.is_active) {\n          if (!startupAvailabilityHandledRef.current) {\n            startupAvailabilityHandledRef.current = true;\n            const activeDeliveryRes = await from("delivery_jobs")\n              .select("id")\n              .eq("courier_id", courierRow.id)\n              .in("status", [\n                "accepted",\n                "arriving_pickup",\n                "at_pickup",\n                "picked_up",\n                "on_the_way",\n                "arrived_destination",\n              ])\n              .limit(1)\n              .maybeSingle();\n\n            if (!activeDeliveryRes.data) {\n              const { error: offlineError } = await rpc("set_courier_online", {\n                _is_online: false,\n              });\n              if (offlineError)\n                console.warn("courier startup offline reset failed", offlineError.message);\n              setCurrentPosition(null);\n            }\n          }\n          await loadCourierOperations(courierRow.id);\n        }'''
          if old not in s:
              raise SystemExit('loadAll target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - run: bunx prettier --write src/routes/courier.tsx
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "fix(courier): start offline unless delivery is active"
          git push origin HEAD:main
