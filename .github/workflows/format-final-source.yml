name: Format final source files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-final-source.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format source files
        run: |
          bunx prettier \
            src/components/CourierLocationTracker.tsx \
            src/components/CourierRouteMap.tsx \
            src/components/CustomerDeliveryMap.tsx \
            'src/routes/chamado-suporte.$ticketId.tsx' \
            src/routes/configuracoes-estabelecimento.tsx \
            --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/format-final-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format integrated production features"
          git push
