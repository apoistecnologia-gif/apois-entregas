name: Full source audit once

on:
  push:
    paths:
      - ".github/workflows/full-source-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Repository security audit
        run: bun run audit:repo
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build customer
        run: bun run build:customer
      - name: Build merchant
        run: bun run build:merchant
      - name: Build courier
        run: bun run build:courier
      - name: Build admin
        run: bun run build:admin
