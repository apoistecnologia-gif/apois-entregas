name: One-time Android release gate audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-mobile-release-gates-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Android release workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mobile-android.yml')
          text = path.read_text()
          text = text.replace('          bun-version: latest', '          bun-version: 1.3.14', 1)

          old = '''          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ]; then
            if [ "$SIGNING_CONFIGURED" != "true" ]; then
              echo "Courier release signing is mandatory." >&2
              exit 1
            fi
            if [ -z "$FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 is required for native courier calls." >&2
              exit 1
            fi
          fi

          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
            test "$VITE_SUPABASE_PUBLISHABLE_KEY" != "ci-placeholder"
            test -n "$VITE_GOOGLE_MAPS_BROWSER_KEY"
            test "$VITE_GOOGLE_MAPS_BROWSER_KEY" != "ci-placeholder"
            test -n "$VITE_GOOGLE_MAPS_MAP_ID"
            test "$VITE_GOOGLE_MAPS_MAP_ID" != "ci-placeholder"
          fi'''
          new = '''          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "$APOIS_MOBILE_PRODUCT production signing is mandatory." >&2
            exit 1
          fi

          if [ "$APOIS_MOBILE_PRODUCT" = "courier" ] && [ -z "$FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 is required for native courier calls." >&2
            exit 1
          fi

          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test "$VITE_SUPABASE_PUBLISHABLE_KEY" != "ci-placeholder"
          test -n "$VITE_GOOGLE_MAPS_BROWSER_KEY"
          test "$VITE_GOOGLE_MAPS_BROWSER_KEY" != "ci-placeholder"
          test -n "$VITE_GOOGLE_MAPS_MAP_ID"
          test "$VITE_GOOGLE_MAPS_MAP_ID" != "ci-placeholder"'''
          if old not in text:
              raise SystemExit('release configuration block not found')
          text = text.replace(old, new, 1)

          old_version = '''          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          gradle_text = re.sub(r"versionCode\\s+\\d+", "versionCode 1", gradle_text, count=1)
          gradle_text = re.sub(r'versionName\\s+"[^\"]+"', 'versionName "1.0.0"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding="utf-8")'''
          new_version = '''          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          version_code = int(os.environ["GITHUB_RUN_NUMBER"])
          version_name = f"1.0.{version_code}"
          gradle_text = re.sub(r"versionCode\\s+\\d+", f"versionCode {version_code}", gradle_text, count=1)
          gradle_text = re.sub(r'versionName\\s+"[^\"]+"', f'versionName "{version_name}"', gradle_text, count=1)
          gradle.write_text(gradle_text, encoding="utf-8")'''
          if old_version not in text:
              raise SystemExit('Android version block not found')
          text = text.replace(old_version, new_version, 1)
          path.write_text(text)
          PY
      - name: Commit audited release gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mobile-android.yml
          git commit -m "fix(android): require signed releases and monotonic versions"
          git push origin HEAD:main
