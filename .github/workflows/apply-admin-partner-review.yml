name: Apply Admin Partner Review UI

on:
  push:
    paths:
      - ".github/workflows/apply-admin-partner-review.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply patch
        run: node scripts/apply-admin-partner-review.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- src/routes/admin.tsx; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.tsx
          git commit -m 'feat(admin): add full merchant review workspace'
          git push origin HEAD:main
