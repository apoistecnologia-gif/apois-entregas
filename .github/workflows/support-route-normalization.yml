name: Normalize support conversation route

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/support-route-normalization.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Normalize help conversation link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/perfil/ajuda.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'navigate({ to: `/perfil/ajuda/chamado/${ticket.id}` })',
              'navigate({ to: `/chamado-suporte/${ticket.id}` })',
          )
          path.write_text(text, encoding="utf-8")

          nested = Path("src/routes/perfil/ajuda/chamado/$ticketId.tsx")
          if nested.exists():
              nested.unlink()
          PY
      - name: Format and verify
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bunx prettier src/routes/perfil/ajuda.tsx 'src/routes/chamado-suporte.$ticketId.tsx' --write
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit verified route and cleanup
        run: |
          rm -f .github/workflows/support-route-normalization.yml
          rm -f .github/workflows/feature-wiring-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): normalize support conversation routing"
          git push
