name: Fix React hook dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-react-hook-dependencies.yml
      - .github/scripts/fix-react-hook-dependencies.py

permissions:
  contents: write

concurrency:
  group: fix-react-hook-dependencies
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/fix-react-hook-dependencies.py
      - run: bunx prettier src/components/AdminCoveragePanel.tsx src/components/CourierRouteMap.tsx src/components/MerchantCouponsPanel.tsx src/components/MerchantGrowthPanels.tsx src/components/MerchantProductEditor.tsx src/routes/buscar.tsx --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-react-hook-dependencies.yml .github/scripts/fix-react-hook-dependencies.py
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(ui): eliminate stale hook dependencies"
          git push origin HEAD:main
