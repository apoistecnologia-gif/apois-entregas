name: Courier final audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/courier-final-audit-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APOIS_PRODUCT: courier
      VITE_APOIS_PRODUCT_MODE: courier
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
      VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Courier incompleteness scan
        shell: bash
        run: |
          set -euo pipefail
          echo '--- courier scoped markers ---'
          rg -n -i 'TODO|FIXME|HACK|TEMP|PLACEHOLDER|MOCK|NOT_IMPLEMENTED|console\.log|throw new Error\(["'"']Not implemented|href=["'"']#|onClick=\{\(\) => \{\}\}' \
            src/routes/courier.tsx \
            src/routes/login.tsx \
            src/routes/register.tsx \
            src/routes/redefinir-senha.tsx \
            src/components/Courier*.tsx || true
          echo '--- incoming overlay references ---'
          rg -n 'CourierIncomingOfferOverlay' src || true
          echo '--- offer overlay references ---'
          rg -n 'CourierOfferOverlay' src || true
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Courier build
        run: APOIS_PRODUCT=courier bun run build:courier
