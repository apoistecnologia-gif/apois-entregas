name: Audit courier push source once
# retry after native push type fix

on:
  push:
    paths:
      - ".github/workflows/audit-courier-push-source-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2

      - name: Patch source and lockfile
        run: |
          bun install
          python scripts/courier-push-patch.py
          bunx prettier --write src/lib/courier-push.ts src/routes/courier.tsx src/components/CourierOfferOverlay.tsx package.json

      - name: Validate source integration
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build:courier

      - name: Commit audited source
        run: |
          rm .github/workflows/audit-courier-push-source-once.yml
          rm scripts/courier-push-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/lib/courier-push.ts src/routes/courier.tsx src/components/CourierOfferOverlay.tsx .github/workflows/audit-courier-push-source-once.yml scripts/courier-push-patch.py
          git commit -m "feat(courier): require native alerts before going online"
          git push origin HEAD:main
