name: Audit courier push source once

on:
  push:
    paths:
      - ".github/workflows/audit-courier-push-source-once.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2

      - name: Update lockfile and courier push integration
        shell: bash
        run: |
          bun install
          python - <<'PY'
          from pathlib import Path

          push = Path('src/lib/courier-push.ts')
          s = push.read_text(encoding='utf-8')
          old = '''import { Capacitor } from "@capacitor/core";
          import {
            PushNotifications,
            type PluginListenerHandle,
            type PushNotificationSchema,
          } from "@capacitor/push-notifications";
          '''.replace('          ', '')
          new = '''import { Capacitor, type PluginListenerHandle } from "@capacitor/core";
          import { PushNotifications, type PushNotificationSchema } from "@capacitor/push-notifications";
          '''.replace('          ', '')
          if old in s:
              s = s.replace(old, new, 1)
          push.write_text(s, encoding='utf-8')

          route = Path('src/routes/courier.tsx')
          s = route.read_text(encoding='utf-8')
          import_anchor = 'import { clearPayoutAttemptKey, getPayoutAttemptKey } from "@/lib/payout-attempt";\n'
          import_addition = '''import {
            ensureCourierPushRegistration,
            installCourierPushListeners,
            isNativeCourierAndroid,
            removeCourierPushRegistration,
          } from "@/lib/courier-push";
          '''.replace('          ', '')
          if import_addition not in s:
              if import_anchor not in s:
                  raise SystemExit('courier import anchor not found')
              s = s.replace(import_anchor, import_anchor + import_addition, 1)

          bootstrap_anchor = '  useEffect(() => {\n    void loadAll();\n  }, [loadAll]);\n'
          bootstrap_addition = '''

          useEffect(() => {
            if (!courier?.id || courier.status !== "approved" || !courier.is_active) return;
            void installCourierPushListeners().then(() => ensureCourierPushRegistration(false));
          }, [courier?.id, courier?.is_active, courier?.status]);'''.replace('          ', '')
          if 'installCourierPushListeners().then' not in s:
              if bootstrap_anchor not in s:
                  raise SystemExit('courier bootstrap anchor not found')
              s = s.replace(bootstrap_anchor, bootstrap_anchor.rstrip('\n') + bootstrap_addition + '\n', 1)

          old_logout = '''  const logout = async () => {
            if (availability?.is_online) await rpc("set_courier_online", { _is_online: false });
            await supabase.auth.signOut();
            navigate({ to: "/login", replace: true });
          };
          '''.replace('          ', '')
          new_logout = '''  const logout = async () => {
            if (activeJob) {
              toast.error("Conclua a entrega ativa antes de sair da conta.");
              return;
            }
            if (availability?.is_online) {
              const { error } = await rpc("set_courier_online", { _is_online: false });
              if (error) {
                toast.error(error.message || "Não foi possível ficar offline antes de sair.");
                return;
              }
            }
            await removeCourierPushRegistration();
            await supabase.auth.signOut();
            navigate({ to: "/login", replace: true });
          };
          '''.replace('          ', '')
          if 'Conclua a entrega ativa antes de sair da conta.' not in s:
              if old_logout not in s:
                  raise SystemExit('courier logout block not found')
              s = s.replace(old_logout, new_logout, 1)

          online_anchor = '    if (target) {\n      if (!navigator.geolocation) {'
          online_new = '''    if (target) {
            if (isNativeCourierAndroid()) {
              setBusy("online");
              const pushState = await ensureCourierPushRegistration(true);
              if (pushState.status !== "registered") {
                setBusy(null);
                const message =
                  pushState.status === "permission-denied"
                    ? "Ative as notificações para ficar online e receber chamadas de entrega."
                    : pushState.status === "permission-required"
                      ? "Autorize as notificações para receber chamadas de entrega."
                      : pushState.status === "failed"
                        ? `Não foi possível ativar as chamadas de entrega: ${pushState.message}`
                        : "As chamadas nativas de entrega não estão disponíveis neste dispositivo.";
                toast.error(message);
                return;
              }
            }
            if (!navigator.geolocation) {'''.replace('          ', '')
          if 'const pushState = await ensureCourierPushRegistration(true);' not in s:
              if online_anchor not in s:
                  raise SystemExit('courier online block not found')
              s = s.replace(online_anchor, online_new, 1)
          route.write_text(s, encoding='utf-8')

          overlay = Path('src/components/CourierOfferOverlay.tsx')
          s = overlay.read_text(encoding='utf-8')
          if '"apois:courier-push"' not in s:
              focus_anchor = '    window.addEventListener("focus", refresh);\n    document.addEventListener("visibilitychange", onForeground);'
              focus_new = '    window.addEventListener("focus", refresh);\n    window.addEventListener("apois:courier-push", refresh);\n    document.addEventListener("visibilitychange", onForeground);'
              cleanup_anchor = '      window.removeEventListener("focus", refresh);\n      document.removeEventListener("visibilitychange", onForeground);'
              cleanup_new = '      window.removeEventListener("focus", refresh);\n      window.removeEventListener("apois:courier-push", refresh);\n      document.removeEventListener("visibilitychange", onForeground);'
              if focus_anchor not in s or cleanup_anchor not in s:
                  raise SystemExit('courier overlay foreground block not found')
              s = s.replace(focus_anchor, focus_new, 1).replace(cleanup_anchor, cleanup_new, 1)
          overlay.write_text(s, encoding='utf-8')
          PY

          bunx prettier --write src/lib/courier-push.ts src/routes/courier.tsx src/components/CourierOfferOverlay.tsx package.json

      - name: Validate source integration
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build:courier

      - name: Commit audited source
        run: |
          rm .github/workflows/audit-courier-push-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/lib/courier-push.ts src/routes/courier.tsx src/components/CourierOfferOverlay.tsx .github/workflows/audit-courier-push-source-once.yml
          git commit -m "feat(courier): require native alerts before going online"
          git push origin HEAD:main
