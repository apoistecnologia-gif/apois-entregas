name: One-time courier upload feedback fix

on: push

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'trigger courier upload feedback fix v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/one-time-courier-upload-feedback-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "fix(courier): clarify automatic document upload and review"
          git push origin HEAD:main
