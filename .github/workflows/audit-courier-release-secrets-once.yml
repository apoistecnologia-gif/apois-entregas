name: Audit courier release secrets once

on:
  push:
    paths:
      - ".github/workflows/audit-courier-release-secrets-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_JSON: ${{ secrets.FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 }}
      KS: ${{ secrets.ANDROID_COURIER_KEYSTORE_BASE64 }}
      STORE_PASS: ${{ secrets.ANDROID_COURIER_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_COURIER_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_COURIER_KEY_PASSWORD }}
      MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
      MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          }
          check FIREBASE_COURIER_GOOGLE_SERVICES_JSON_BASE64 "$FIREBASE_JSON"
          check ANDROID_COURIER_KEYSTORE_BASE64 "$KS"
          check ANDROID_COURIER_STORE_PASSWORD "$STORE_PASS"
          check ANDROID_COURIER_KEY_ALIAS "$KEY_ALIAS"
          check ANDROID_COURIER_KEY_PASSWORD "$KEY_PASS"
          check VITE_GOOGLE_MAPS_BROWSER_KEY "$MAPS_KEY"
          check VITE_GOOGLE_MAPS_MAP_ID "$MAP_ID"
          if [ -z "$FIREBASE_JSON" ]; then
            exit 2
          fi
