name: Merchant settings integration gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merchant-settings-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Add settings shortcut to merchant workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/merchant.tsx")
          text = path.read_text(encoding="utf-8")
          marker = 'Configurações do estabelecimento'
          if marker not in text:
              start = text.find("<WorkspaceShell")
              if start < 0:
                  raise SystemExit("WorkspaceShell not found in merchant route")
              end = text.find(">", start)
              if end < 0:
                  raise SystemExit("WorkspaceShell opening tag is incomplete")
              insertion = '''
        <button
          type="button"
          onClick={() => window.location.assign("/configuracoes-estabelecimento")}
          className="fixed right-4 top-4 z-[80] rounded-xl border border-primary/20 bg-black/90 px-3 py-2 text-xs font-black text-primary shadow-xl backdrop-blur lg:right-6 lg:top-5"
          aria-label="Configurações do estabelecimento"
        >
          Configurações
        </button>'''
              text = text[: end + 1] + insertion + text[end + 1 :]
              path.write_text(text, encoding="utf-8")
          PY
      - name: Format changed files
        run: bunx prettier src/routes/merchant.tsx src/routes/configuracoes-estabelecimento.tsx --write
      - name: Verify
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit and clean temporary workflows
        run: |
          rm -f .github/workflows/merchant-settings-integration.yml
          rm -f .github/workflows/full-green-gate.yml
          rm -f .github/workflows/continuation-gate.yml
          rm -f .github/workflows/courier-live-route-integration.yml
          rm -f .github/workflows/customer-support-conversation-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(merchant): connect profile and opening hours settings"
          git push
