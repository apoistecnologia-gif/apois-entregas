name: SENATRAN — corrigir formatação do branch de segurança

on:
  push:
    branches:
      - security/senatran-q12-guards-20261123
    paths:
      - .github/workflows/senatran-format-branch.yml

permissions:
  contents: write

jobs:
  format-safety-branch:
    if: github.ref == 'refs/heads/security/senatran-q12-guards-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Instalar dependências do lockfile sem alterá-lo
        run: bun install --frozen-lockfile
      - name: Formatar arquivos rastreados segundo Prettier da APOIS
        shell: bash
        run: |
          set -euo pipefail
          bun run format
          # Alguns arquivos compactados precisam de mais de uma passagem do formatador.
          for pass in 1 2 3 4; do
            if bun run format:check; then
              echo "Prettier consistente apos passagem ${pass}."
              break
            fi
            bunx prettier --write \
              supabase/functions/merchant-mercadopago-oauth/index.ts \
              supabase/functions/merchant-mercadopago-webhook/index.ts \
              supabase/functions/process-superapp-refund/index.ts
          done
      - name: Conferir lint e formatação antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          bun run format:check
          bun run lint
          echo "APOIS_FORMAT_AND_LINT_OK=true"
      - name: Publicar somente a formatação na branch de segurança
        shell: bash
        env:
          SAFE_BRANCH: security/senatran-q12-guards-20261123
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi
          echo "WORKFLOW_FORMAT_PATCH_BEGIN"
          git diff --cached -- .github/workflows || true
          echo "WORKFLOW_FORMAT_PATCH_END"
          # GitHub Actions GITHUB_TOKEN cannot write workflow files: leave them
          # to the GitHub connector with workflow-file permissions.
          git restore --staged -- .github/workflows
          git restore -- .github/workflows
          if git diff --cached --quiet; then
            echo "Nao ha alteracoes de codigo fora dos workflows."
            exit 0
          fi
          echo "Arquivos alterados (sem workflows):"
          git diff --cached --stat | tail -n 65
          git commit -m "style(ci): aplicar Prettier no codigo sem alterar workflows"
          git push origin "HEAD:refs/heads/${SAFE_BRANCH}"
