name: Reconcile delivery quote migrations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-delivery-quote-migrations.yml
      - .github/scripts/reconcile-delivery-quote-migrations.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/reconcile-delivery-quote-migrations.py
      - run: bunx prettier supabase/MIGRATION_RECONCILIATION.md --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit reconciliation and remove one-shot files
        run: |
          rm .github/workflows/reconcile-delivery-quote-migrations.yml
          rm .github/scripts/reconcile-delivery-quote-migrations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(db): reconcile delivery quote migrations"
          git push
