name: One-shot private route guard fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/route-guard-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Disable SSR for browser-authenticated customer routes
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              Path("src/routes/inicio.tsx"): 'export const Route = createFileRoute("/inicio")({\n',
              Path("src/routes/buscar.tsx"): 'export const Route = createFileRoute("/buscar")({\n',
              Path("src/routes/apois-plus.tsx"): 'export const Route = createFileRoute("/apois-plus")({\n',
          }

          for path, marker in targets.items():
              text = path.read_text(encoding="utf-8")
              route_block = text.split(marker, 1)[1][:200] if marker in text else ""
              if "ssr: false" in route_block:
                  continue
              if marker not in text:
                  raise SystemExit(f"route marker not found: {path}")
              text = text.replace(marker, marker + "  ssr: false,\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- src/routes/inicio.tsx src/routes/buscar.tsx src/routes/apois-plus.tsx; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/inicio.tsx src/routes/buscar.tsx src/routes/apois-plus.tsx
          git commit -m "fix(customer): preserve auth on hard reload routes"
          git push
