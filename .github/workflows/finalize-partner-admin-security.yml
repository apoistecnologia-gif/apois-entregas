name: Finalize partner admin and redirect hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-partner-admin-security.yml
      - .github/scripts/finalize-partner-admin-security.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply hardening
        run: python .github/scripts/finalize-partner-admin-security.py
      - name: Format changed source
        run: bunx prettier src/routes/admin.tsx src/routes/login.tsx README.md supabase/MIGRATION_RECONCILIATION.md --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit integration and remove one-shot files
        run: |
          rm .github/workflows/finalize-partner-admin-security.yml
          rm .github/scripts/finalize-partner-admin-security.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: harden partner approval and redirects"
          git push
