name: Format Release Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-release-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format release files
        run: bunx prettier --write AGENTS.md lint-report-final.json src/routes/README.md supabase/functions/mercadopago-credential-diagnostic/index.ts README.md

      - name: Verify formatting
        run: bun run format:check

      - name: Remove one-shot workflow
        run: rm .github/workflows/format-release-once.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy release format check"
          git push origin HEAD:main
