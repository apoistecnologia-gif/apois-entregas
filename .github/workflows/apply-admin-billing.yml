name: Apply Admin Billing

on:
  push:
    paths:
      - ".github/workflows/apply-admin-billing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download validated admin billing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/admin-billing
          gh run download 31362344580 -n admin-billing-file -D /tmp/admin-billing
          cp /tmp/admin-billing/admin.tsx src/routes/admin.tsx
      - name: Commit admin billing panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(admin): monitor merchant monthly billing"
          git push
