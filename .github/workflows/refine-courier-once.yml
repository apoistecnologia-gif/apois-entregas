name: Final courier UX polish once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-courier-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply final courier UX polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          courier = Path('src/routes/courier.tsx')
          s = courier.read_text()

          def must_replace(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} target not found')
              s = s.replace(old, new, 1)

          s, n = re.subn(
              r'\n  const audioContextRef = useRef<AudioContext \| null>\(null\);.*?\n  const loadCourierOperations = useCallback',
              '\n  const loadCourierOperations = useCallback',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('duplicate route offer alert target not found')

          s, n = re.subn(
              r'\n  useEffect\(\(\) => \{\n    const shouldAlert = Boolean\(availability\?\.is_online && !activeJob && offers\.length > 0\);.*?\n  useEffect\(\(\) => \{\n    if \(!courier\?\.id \|\| courier\.status !== "approved"\) return;',
              '\n  useEffect(() => {\n    if (!courier?.id || courier.status !== "approved") return;',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('duplicate offer alert effects target not found')

          s = s.replace('      ensureOfferAudioContext();\n', '', 1)
          s = s.replace('    stopOfferAlert();\n', '', 2)

          must_replace('<h1 className="font-black">Carteira</h1>', '<h1 className="font-black">Meus ganhos</h1>', 'finance title')
          must_replace(
              '<div className="rounded-3xl bg-primary p-6 text-black">\n          <p className="text-xs font-black uppercase">Disponível para saque</p>\n          <p className="mt-2 text-4xl font-black">{money(wallet?.available_balance)}</p>\n          <p className="mt-2 text-xs opacity-70">',
              '<div className="rounded-3xl border border-primary/40 bg-[linear-gradient(145deg,rgba(250,204,21,0.12),#090909_62%)] p-6 text-white shadow-[0_20px_55px_rgba(0,0,0,0.5)]">\n          <p className="text-xs font-black uppercase tracking-[0.16em] text-primary">Saldo disponível</p>\n          <p className="mt-2 text-4xl font-black text-primary">{money(wallet?.available_balance)}</p>\n          <p className="mt-2 text-xs text-zinc-500">',
              'finance balance card',
          )
          must_replace(
              '''              <Button
                className="w-full"
                disabled={!payoutAccount || busy === "payout"}
                onClick={onRequestPayout}
              >
                Solicitar
              </Button>''',
              '''              <Button
                className="h-12 w-full rounded-xl font-black"
                disabled={!payoutAccount || busy === "payout"}
                onClick={onRequestPayout}
              >
                Solicitar saque
              </Button>
              <p className="text-[11px] leading-4 text-zinc-500">
                A solicitação entra em processamento após a reserva do saldo. O app não promete transferência instantânea.
              </p>''',
              'payout disclaimer',
          )

          s = s.replace('<CourierBottomNav\n          onHome={() => setHistoryOpen(false)}', '<CourierBottomNav\n          active="history"\n          onHome={() => setHistoryOpen(false)}', 1)
          s = s.replace('<CourierBottomNav\n          onHome={() => setProfileOpen(false)}', '<CourierBottomNav\n          active="profile"\n          onHome={() => setProfileOpen(false)}', 1)
          s = s.replace('<CourierBottomNav\n          onHome={() => setFinanceOpen(false)}', '<CourierBottomNav\n          active="finance"\n          onHome={() => setFinanceOpen(false)}', 1)
          s = s.replace('<CourierBottomNav\n        onHome={() => window.scrollTo', '<CourierBottomNav\n        active="home"\n        onHome={() => window.scrollTo', 1)
          courier.write_text(s)

          panels = Path('src/components/CourierPanels.tsx')
          p = panels.read_text()
          old = '''export function CourierBottomNav({
  onHome,
  onHistory,
  onFinance,
  onProfile,
}: {
  onHome: () => void;'''
          new = '''export function CourierBottomNav({
  active = "home",
  onHome,
  onHistory,
  onFinance,
  onProfile,
}: {
  active?: "home" | "history" | "finance" | "profile";
  onHome: () => void;'''
          if old not in p:
              raise SystemExit('bottom nav signature target not found')
          p = p.replace(old, new, 1)
          old = '''  const items = [
    { label: "Início", icon: House, onClick: onHome },
    { label: "Corridas", icon: Bike, onClick: onHistory },
    { label: "Ganhos", icon: WalletCards, onClick: onFinance },
    { label: "Perfil", icon: UserRound, onClick: onProfile },
  ];'''
          new = '''  const items = [
    { id: "home", label: "Início", icon: House, onClick: onHome },
    { id: "history", label: "Corridas", icon: Bike, onClick: onHistory },
    { id: "finance", label: "Ganhos", icon: WalletCards, onClick: onFinance },
    { id: "profile", label: "Perfil", icon: UserRound, onClick: onProfile },
  ] as const;'''
          if old not in p:
              raise SystemExit('bottom nav items target not found')
          p = p.replace(old, new, 1)
          old = '''            className="flex min-h-14 flex-col items-center justify-center gap-1 rounded-xl text-[10px] font-bold text-zinc-500 transition-colors active:bg-zinc-900 active:text-primary"
          >
            <item.icon className="h-5 w-5" />
            {item.label}'''
          new = '''            aria-current={active === item.id ? "page" : undefined}
            className={`relative flex min-h-14 flex-col items-center justify-center gap-1 rounded-xl text-[10px] font-bold transition-colors active:bg-zinc-900 ${
              active === item.id ? "text-primary" : "text-zinc-500"
            }`}
          >
            <item.icon className="h-5 w-5" />
            {item.label}
            {active === item.id ? (
              <span className="absolute bottom-0 h-0.5 w-7 rounded-full bg-primary" />
            ) : null}'''
          if old not in p:
              raise SystemExit('bottom nav active state target not found')
          panels.write_text(p.replace(old, new, 1))

          offer = Path('src/components/CourierOfferOverlay.tsx')
          o = offer.read_text()
          old = 'className="fixed inset-0 z-[1400] flex items-end justify-center bg-black/85 p-3 backdrop-blur-md"'
          new = 'className="fixed inset-x-0 top-0 bottom-[calc(4.75rem+env(safe-area-inset-bottom))] z-[1400] flex items-end justify-center bg-black/85 p-3 backdrop-blur-md"'
          if old not in o:
              raise SystemExit('offer overlay viewport target not found')
          offer.write_text(o.replace(old, new, 1))

          active = Path('src/components/CourierActiveDeliveryOverlay.tsx')
          a = active.read_text()
          old = 'className="pointer-events-none fixed inset-0 z-[1250] flex items-end justify-center p-3"'
          new = 'className="pointer-events-none fixed inset-x-0 top-0 bottom-[calc(4.75rem+env(safe-area-inset-bottom))] z-[1250] flex items-end justify-center p-3"'
          if old not in a:
              raise SystemExit('active overlay viewport target not found')
          active.write_text(a.replace(old, new, 1))
          PY
          bunx prettier --write src/routes/courier.tsx src/components/CourierPanels.tsx src/components/CourierOfferOverlay.tsx src/components/CourierActiveDeliveryOverlay.tsx src/routes/register.tsx
          rm -f scripts/refine-courier-once.py .github/workflows/refine-courier-once.yml
      - name: Validate package
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          APOIS_PRODUCT=courier bun run build:courier
      - name: Commit final courier polish and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(courier): finalize premium operational UX"
          git pull --rebase origin main
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          APOIS_PRODUCT=courier bun run build:courier
          git push
