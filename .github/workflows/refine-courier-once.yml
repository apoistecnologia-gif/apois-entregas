name: Final courier UX polish once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-courier-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply final courier UX polish
        run: |
          python3 scripts/finalize-courier-polish.py
          bunx prettier --write \
            src/routes/courier.tsx \
            src/routes/register.tsx \
            src/components/CourierPanels.tsx \
            src/components/CourierOfferOverlay.tsx \
            src/components/CourierActiveDeliveryOverlay.tsx
          rm -f \
            scripts/finalize-courier-polish.py \
            scripts/refine-courier-once.py \
            .github/workflows/refine-courier-once.yml
      - name: Validate package
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          APOIS_PRODUCT=courier bun run build:courier
      - name: Commit and push final courier polish safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(courier): finalize premium operational UX"

          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4"
            git fetch origin main
            git rebase origin/main

            bun run typecheck
            bun run test
            bun run lint
            bun run format:check
            APOIS_PRODUCT=courier bun run build:courier

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done

          echo "Unable to push after 4 race-safe attempts."
          exit 1
