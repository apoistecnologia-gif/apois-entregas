name: Refine courier lifecycle once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-courier-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply courier lifecycle refinements
        run: |
          python3 scripts/refine-courier-once.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/CourierActiveDeliveryOverlay.tsx')
          source = path.read_text()
          replacements = {
              'address.street': "address['street']",
              'address.address_line': "address['address_line']",
              'address.name': "address['name']",
              'address.number': "address['number']",
              'address.neighborhood': "address['neighborhood']",
              'address.city': "address['city']",
              'address.state': "address['state']",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source)
          PY
          bunx prettier --write src/routes/courier.tsx src/components/CourierActiveDeliveryOverlay.tsx
      - name: Validate courier changes
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo "No courier refinements required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx src/components/CourierActiveDeliveryOverlay.tsx
          git commit -m "feat(courier): refine secure delivery lifecycle"
          git pull --rebase origin main
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          git push
