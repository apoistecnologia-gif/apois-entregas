name: Refine courier lifecycle once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-courier-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply courier lifecycle refinements
        run: |
          python3 scripts/refine-courier-once.py
          bunx prettier --write src/routes/courier.tsx
      - name: Validate courier changes
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo "No courier refinements required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "feat(courier): refine offer privacy and delivery lifecycle"
          git pull --rebase origin main
          git push
