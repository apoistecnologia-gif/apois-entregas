name: One-time courier dark map polish

on:
  push:
    branches: [main]
    paths:
      - scripts/one-time-courier-dark-map.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply courier dark map polish
        run: python scripts/one-time-courier-dark-map.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierRouteMap.tsx
          git commit -m "feat(courier): use dark APOIS map styling"
          git push
