name: Patch Admin Merchant Dialog

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch-admin-merchant-dialog.py"
      - "src/components/AdminMerchantCreateDialog.tsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin route
        run: python3 .github/scripts/patch-admin-merchant-dialog.py
      - name: Format
        run: npx prettier --write src/routes/admin.tsx src/components/AdminMerchantCreateDialog.tsx
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.tsx src/components/AdminMerchantCreateDialog.tsx
          git commit -m "fix(admin): create owner and merchant in one form"
          git push origin HEAD:main
