name: Patch Final Homologation Round 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-final-homologation-round2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python .github/scripts/patch-final-homologation-round2.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bunx prettier --write src/routes/courier.tsx src/components/CourierRouteMap.tsx
      - name: Validate
        run: |
          bun run typecheck
          bun run lint
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx src/components/CourierRouteMap.tsx
          git commit -m "fix(courier): register push on fresh install and improve route camera"
          git pull --rebase origin main
          git push origin HEAD:main

# Triggered after production homologation found fresh-install FCM registration gap.
