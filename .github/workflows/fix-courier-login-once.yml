name: Fix Courier Login Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-courier-login-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lift courier login and repair onboarding back action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          login = Path('src/routes/login.tsx')
          text = login.read_text()
          replacements = {
              'pb-[max(env(safe-area-inset-bottom),1.5rem)] pt-12': 'pb-[max(env(safe-area-inset-bottom),1.5rem)] pt-2',
              'flex min-h-[17rem] flex-col items-center justify-end text-center': 'flex min-h-[8.5rem] flex-col items-center justify-end text-center',
              '<section className="mt-4 rounded-[2rem] border border-primary/25': '<section className="mt-1 rounded-[2rem] border border-primary/25',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected login fragment not found: {old}')
              text = text.replace(old, new, 1)
          login.write_text(text)

          courier = Path('src/routes/courier.tsx')
          text = courier.read_text()
          old = 'onBack={() => navigate({ to: "/perfil" })}'
          new = 'onBack={() => void logout()}'
          if old not in text:
              raise SystemExit('Expected courier onboarding back action not found')
          text = text.replace(old, new, 1)
          courier.write_text(text)

          views = Path('src/components/CourierPremiumViews.tsx')
          text = views.read_text()
          old = '← Voltar'
          new = '← Voltar ao login'
          if old not in text:
              raise SystemExit('Expected onboarding back label not found')
          text = text.replace(old, new, 1)
          views.write_text(text)
          PY

      - name: Format changed files
        run: npx prettier --write src/routes/login.tsx src/routes/courier.tsx src/components/CourierPremiumViews.tsx

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-courier-login-once.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/login.tsx src/routes/courier.tsx src/components/CourierPremiumViews.tsx .github/workflows/fix-courier-login-once.yml
          git commit -m "fix(courier): lift login and restore onboarding exit"
          git push origin HEAD:main
