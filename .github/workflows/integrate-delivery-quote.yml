# One-shot integration: consume and self-remove after verification.
name: Integrate delivery coverage quote

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-delivery-quote.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire server delivery eligibility into checkout
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/routes/checkout.tsx')
          text = path.read_text(encoding='utf-8')

          config_type = '''type MerchantCheckoutConfig = {\n  delivery_fee: number | string | null;\n  minimum_order: number | string | null;\n  delivery_enabled: boolean;\n  pickup_enabled: boolean;\n  address_line: string | null;\n  neighborhood: string | null;\n  city: string | null;\n  state: string | null;\n};\n'''
          quote_type = '''\ntype DeliveryQuote = {\n  eligible: boolean;\n  reason: string;\n  zone_id: string | null;\n  delivery_fee: number | string;\n  minimum_order: number | string;\n  distance_km: number | string | null;\n};\n'''
          if 'type DeliveryQuote = {' not in text:
              if config_type not in text:
                  raise SystemExit('MerchantCheckoutConfig type anchor missing')
              text = text.replace(config_type, config_type + quote_type, 1)

          state_anchor = '  const [merchantConfig, setMerchantConfig] = useState<MerchantCheckoutConfig | null>(null);\n'
          if 'const [deliveryQuote, setDeliveryQuote]' not in text:
              if state_anchor not in text:
                  raise SystemExit('merchant config state anchor missing')
              text = text.replace(
                  state_anchor,
                  state_anchor + '  const [deliveryQuote, setDeliveryQuote] = useState<DeliveryQuote | null>(null);\n  const [deliveryQuoteLoading, setDeliveryQuoteLoading] = useState(false);\n',
                  1,
              )

          totals_anchor = '''  const subtotal = totalPrice;\n  const deliveryFee =\n    fulfillmentType === "delivery"\n      ? Number(merchantConfig?.delivery_fee ?? merchant?.deliveryFee ?? 0)\n      : 0;\n  const discount = Number(appliedCoupon?.discount_amount ?? 0);\n  const total = Math.max(0, subtotal + deliveryFee - discount);\n  const minimumOrder = Number(merchantConfig?.minimum_order ?? 0);\n  const minimumOrderMissing = Math.max(0, minimumOrder - subtotal);\n'''
          totals_new = '''  useEffect(() => {\n    if (fulfillmentType !== "delivery") {\n      setDeliveryQuote(null);\n      setDeliveryQuoteLoading(false);\n      return;\n    }\n    if (!merchant?.id || !address) {\n      setDeliveryQuote(null);\n      setDeliveryQuoteLoading(false);\n      return;\n    }\n\n    let disposed = false;\n    setDeliveryQuoteLoading(true);\n    const loadQuote = async () => {\n      const { data, error } = await (supabase.rpc as any)("preview_delivery_quote", {\n        p_merchant_id: merchant.id,\n        p_delivery_address: address,\n      });\n      if (disposed) return;\n      setDeliveryQuoteLoading(false);\n      if (error) {\n        console.error("Erro ao validar área de entrega:", error);\n        setDeliveryQuote({\n          eligible: false,\n          reason: "validation_failed",\n          zone_id: null,\n          delivery_fee: 0,\n          minimum_order: merchantConfig?.minimum_order ?? 0,\n          distance_km: null,\n        });\n        return;\n      }\n      const quote = Array.isArray(data) ? data[0] : null;\n      setDeliveryQuote(quote ? (quote as DeliveryQuote) : null);\n    };\n    void loadQuote();\n    return () => {\n      disposed = true;\n    };\n  }, [address, fulfillmentType, merchant?.id, merchantConfig?.minimum_order]);\n\n  const subtotal = totalPrice;\n  const deliveryFee =\n    fulfillmentType === "delivery"\n      ? Number(\n          deliveryQuote?.eligible\n            ? deliveryQuote.delivery_fee\n            : merchantConfig?.delivery_fee ?? merchant?.deliveryFee ?? 0,\n        )\n      : 0;\n  const discount = Number(appliedCoupon?.discount_amount ?? 0);\n  const total = Math.max(0, subtotal + deliveryFee - discount);\n  const minimumOrder = Number(\n    fulfillmentType === "delivery" && deliveryQuote?.eligible\n      ? deliveryQuote.minimum_order\n      : merchantConfig?.minimum_order ?? 0,\n  );\n  const minimumOrderMissing = Math.max(0, minimumOrder - subtotal);\n  const deliveryEligible =\n    fulfillmentType === "pickup" || Boolean(address && deliveryQuote?.eligible === true);\n'''
          if 'preview_delivery_quote' not in text:
              if totals_anchor not in text:
                  raise SystemExit('checkout totals anchor missing')
              text = text.replace(totals_anchor, totals_new, 1)

          address_check = '''      if (fulfillmentType === "delivery" && !address)\n        throw new Error("Selecione um endereço de entrega antes de continuar.");\n'''
          if 'Aguarde a validação da área de entrega.' not in text:
              if address_check not in text:
                  raise SystemExit('address validation anchor missing')
              text = text.replace(
                  address_check,
                  address_check
                  + '''      if (fulfillmentType === "delivery" && deliveryQuoteLoading)\n        throw new Error("Aguarde a validação da área de entrega.");\n      if (fulfillmentType === "delivery" && deliveryQuote?.eligible !== true)\n        throw new Error("Este endereço está fora da área de entrega disponível.");\n''',
                  1,
              )

          pickup_switch = '''                setFulfillmentType("pickup");\n                sessionStorage.removeItem(CHECKOUT_ATTEMPT_STORAGE_KEY);\n'''
          if 'setFulfillmentType("pickup");\n                setDeliveryQuote(null);' not in text:
              if pickup_switch not in text:
                  raise SystemExit('pickup switch anchor missing')
              text = text.replace(
                  pickup_switch,
                  '''                setFulfillmentType("pickup");\n                setDeliveryQuote(null);\n                sessionStorage.removeItem(CHECKOUT_ATTEMPT_STORAGE_KEY);\n''',
                  1,
              )

          summary_anchor = '''          {discount > 0 ? (\n            <div className="flex justify-between text-emerald-400">\n'''
          if 'Validando área e taxa de entrega...' not in text:
              if summary_anchor not in text:
                  raise SystemExit('summary discount anchor missing')
              quote_notice = '''          {fulfillmentType === "delivery" && address ? (\n            <div\n              role="status"\n              className={`rounded-xl p-3 text-xs ${\n                deliveryQuoteLoading\n                  ? "bg-zinc-900 text-zinc-400"\n                  : deliveryQuote?.eligible\n                    ? "bg-emerald-500/10 text-emerald-300"\n                    : "bg-red-500/10 text-red-300"\n              }`}\n            >\n              {deliveryQuoteLoading\n                ? "Validando área e taxa de entrega..."\n                : deliveryQuote?.eligible\n                  ? `${deliveryQuote.zone_id ? "Endereço dentro da zona de entrega" : "Endereço atendido"}${\n                      deliveryQuote.distance_km !== null\n                        ? ` · ${Number(deliveryQuote.distance_km).toFixed(1).replace(".", ",")} km`\n                        : ""\n                    }`\n                  : deliveryQuote?.reason === "outside_served_city"\n                    ? "Este estabelecimento não entrega na cidade deste endereço."\n                    : deliveryQuote?.reason === "outside_delivery_zone" ||\n                        deliveryQuote?.reason === "outside_default_radius"\n                      ? "Este endereço está fora da área de entrega disponível."\n                      : deliveryQuote?.reason === "coordinates_required"\n                        ? "Atualize este endereço pelo mapa para validar a área de entrega."\n                        : "Não foi possível validar a área de entrega agora."}\n            </div>\n          ) : null}\n'''
              text = text.replace(summary_anchor, quote_notice + summary_anchor, 1)

          old_disabled = '''          disabled={\n            isProcessing || minimumOrderMissing > 0 || (fulfillmentType === "delivery" && !address)\n          }\n'''
          if '!deliveryEligible' not in text:
              if old_disabled not in text:
                  raise SystemExit('checkout submit disabled anchor missing')
              text = text.replace(
                  old_disabled,
                  '          disabled={isProcessing || minimumOrderMissing > 0 || deliveryQuoteLoading || !deliveryEligible}\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')

          edge = Path('supabase/functions/create-order/index.ts')
          edge_text = edge.read_text(encoding='utf-8')
          edge_anchor = '''  if (normalized.includes("delivery is unavailable")) {\n'''
          edge_case = '''  if (normalized.includes("delivery address unavailable")) {\n    return {\n      status: 409,\n      code: "DELIVERY_ADDRESS_UNAVAILABLE",\n      error: "Este endereço está fora da área de entrega disponível.",\n    };\n  }\n'''
          if 'DELIVERY_ADDRESS_UNAVAILABLE' not in edge_text:
              if edge_anchor not in edge_text:
                  raise SystemExit('create-order delivery error anchor missing')
              edge_text = edge_text.replace(edge_anchor, edge_case + edge_anchor, 1)
          edge.write_text(edge_text, encoding='utf-8')
          PY
          bunx prettier src/routes/checkout.tsx supabase/functions/create-order/index.ts --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit integration and remove workflow
        run: |
          rm .github/workflows/integrate-delivery-quote.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(checkout): enforce delivery coverage quote"
          git push
