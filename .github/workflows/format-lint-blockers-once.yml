name: Format lint blockers once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-lint-blockers-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply Prettier to known lint blockers
        run: |
          bunx prettier --write \
            src/components/CourierIncomingOfferOverlay.tsx \
            src/components/MerchantOrderControlCenter.tsx \
            src/components/MerchantOrderSoundWatcher.tsx \
            supabase/functions/openpix-payout/index.ts \
            supabase/functions/openpix-webhook/index.ts \
            supabase/functions/sync-payment-status/index.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierIncomingOfferOverlay.tsx \
            src/components/MerchantOrderControlCenter.tsx \
            src/components/MerchantOrderSoundWatcher.tsx \
            supabase/functions/openpix-payout/index.ts \
            supabase/functions/openpix-webhook/index.ts \
            supabase/functions/sync-payment-status/index.ts
          git commit -m "style: format lint blockers"
          git push
