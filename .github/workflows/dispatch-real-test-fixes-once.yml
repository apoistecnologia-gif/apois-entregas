name: Dispatch Real Test Fixes Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-real-test-fixes-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy merchant alert fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merchant-web-build.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Build updated courier Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-android.yml --repo "$GITHUB_REPOSITORY" --ref main --field product=courier
