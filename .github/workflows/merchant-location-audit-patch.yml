name: Merchant location audit patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !startsWith(github.event.head_commit.message, 'fix(merchant): allow precise map location') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Patch merchant location flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/merchant.tsx')
          text = p.read_text(encoding='utf-8')

          old_import = 'import { MerchantAsaasOnboarding } from "@/components/MerchantAsaasOnboarding";'
          new_import = old_import + '\nimport { GoogleMapsAddressSelector } from "@/components/GoogleMapsAddressSelector";'
          if old_import not in text:
              raise SystemExit('Merchant import marker missing')
          text = text.replace(old_import, new_import, 1)

          marker = '  const uploadMerchantAsset = async (kind: "logo" | "cover", file: File) => {'
          function = '''  const saveMerchantMappedLocation = async (address: {\n    street: string;\n    number: string;\n    neighborhood: string;\n    city: string;\n    state: string;\n    postal_code: string;\n    latitude?: number | null;\n    longitude?: number | null;\n  }) => {\n    if (!merchant?.id || address.latitude == null || address.longitude == null) return;\n    const mappedAddressLine = [address.street, address.number].filter(Boolean).join(", ");\n    setBusyAction("merchant-map-location");\n    try {\n      const { error } = await from("merchants")\n        .update({\n          latitude: address.latitude,\n          longitude: address.longitude,\n          address_line: mappedAddressLine || merchant.address_line,\n          neighborhood: address.neighborhood || merchant.neighborhood,\n          city: address.city || merchant.city,\n          state: address.state || merchant.state,\n          updated_at: new Date().toISOString(),\n        })\n        .eq("id", merchant.id);\n      if (error) throw error;\n      toast.success("Ponto exato da loja atualizado no mapa.");\n      await loadAll(true);\n    } catch (error: any) {\n      toast.error(error?.message || "Não foi possível salvar o ponto da loja.");\n    } finally {\n      setBusyAction(null);\n    }\n  };\n\n'''
          if marker not in text:
              raise SystemExit('Merchant function marker missing')
          text = text.replace(marker, function + marker, 1)

          button_marker = '''            <Button\n              type="button"\n              variant="outline"\n              onClick={captureMerchantLocation}'''
          map_ui = '''            <div className="rounded-2xl border border-zinc-900 bg-black p-3">\n              <p className="mb-3 text-xs leading-relaxed text-zinc-500">\n                Pesquise o endereço da loja ou marque o ponto exato no mapa. Isso evita que um GPS\n                capturado fora do estabelecimento deixe o cálculo de entrega incorreto.\n              </p>\n              <GoogleMapsAddressSelector\n                initialCenter={\n                  merchant.latitude != null && merchant.longitude != null\n                    ? { lat: Number(merchant.latitude), lng: Number(merchant.longitude) }\n                    : undefined\n                }\n                onAddressSelected={(address) => void saveMerchantMappedLocation(address)}\n              />\n            </div>\n            <Button\n              type="button"\n              variant="outline"\n              onClick={captureMerchantLocation}'''
          if button_marker not in text:
              raise SystemExit('Merchant location UI marker missing')
          text = text.replace(button_marker, map_ui, 1)
          p.write_text(text, encoding='utf-8')
      - name: Format and validate
        run: |
          bunx prettier --write src/routes/merchant.tsx
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/merchant.tsx
          git commit -m "fix(merchant): allow precise map location"
          git push origin HEAD:main
