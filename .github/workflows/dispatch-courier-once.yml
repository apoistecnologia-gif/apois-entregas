name: Dispatch Courier Android Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-courier-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-courier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch courier Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mobile-android.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field product=courier
