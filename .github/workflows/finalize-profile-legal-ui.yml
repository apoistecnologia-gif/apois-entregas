name: Finalize profile and legal UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-profile-legal-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire legal links and profile avatar
        run: |
          python <<'PY'
          from pathlib import Path

          register = Path('src/routes/register.tsx')
          text = register.read_text(encoding='utf-8')
          old = '''            <label htmlFor="terms" className="text-[11px] text-zinc-400 leading-snug">\n              Aceito os <span className="text-primary font-bold">Termos de Uso</span> e a{" "}\n              <span className="text-primary font-bold">Política de Privacidade</span>.\n            </label>'''
          new = '''            <label htmlFor="terms" className="text-[11px] text-zinc-400 leading-snug">\n              Aceito os{" "}\n              <Link to="/termos" target="_blank" className="text-primary font-bold hover:underline">\n                Termos de Uso\n              </Link>{" "}\n              e a{" "}\n              <Link\n                to="/privacidade"\n                target="_blank"\n                className="text-primary font-bold hover:underline"\n              >\n                Política de Privacidade\n              </Link>\n              .\n            </label>'''
          if new not in text:
              if old not in text:
                  raise SystemExit('registration legal label anchor not found')
              text = text.replace(old, new, 1)
          register.write_text(text, encoding='utf-8')

          profile = Path('src/routes/perfil/index.tsx')
          text = profile.read_text(encoding='utf-8')
          old = '''          <div className="mb-4 flex h-20 w-20 items-center justify-center rounded-full border-2 border-primary bg-zinc-900 shadow-[0_0_15px_rgba(255,215,0,0.3)]">\n            <User className="h-10 w-10 text-primary" />\n          </div>'''
          new = '''          <div className="mb-4 flex h-20 w-20 items-center justify-center overflow-hidden rounded-full border-2 border-primary bg-zinc-900 shadow-[0_0_15px_rgba(255,215,0,0.3)]">\n            {profile?.avatar_url ? (\n              <img\n                src={profile.avatar_url}\n                alt="Foto de perfil"\n                className="h-full w-full object-cover"\n              />\n            ) : (\n              <User className="h-10 w-10 text-primary" />\n            )}\n          </div>'''
          if new not in text:
              if old not in text:
                  raise SystemExit('profile avatar anchor not found')
              text = text.replace(old, new, 1)
          profile.write_text(text, encoding='utf-8')
          PY
          bunx prettier \
            src/routes/register.tsx \
            src/routes/perfil/index.tsx \
            src/routes/perfil/dados-pessoais.tsx \
            src/routes/perfil/legal.tsx \
            src/routes/termos.tsx \
            src/routes/privacidade.tsx \
            --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit integration and remove workflow
        run: |
          rm .github/workflows/finalize-profile-legal-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profile): finish identity and legal experience"
          git push
