name: One-time customer address UX patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-customer-address-confirm.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer address confirmation UX
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/routes/enderecos.tsx")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              '  const [loadError, setLoadError] = useState<string | null>(null);',
              '  const [loadError, setLoadError] = useState<string | null>(null);\n  const [selectedAddressId, setSelectedAddressId] = useState<string | null>(null);\n  const [isConfirming, setIsConfirming] = useState(false);',
          )

          s = s.replace(
              '      setAddresses((data ?? []) as CustomerAddress[]);',
              '      const nextAddresses = (data ?? []) as CustomerAddress[];\n      setAddresses(nextAddresses);\n      setSelectedAddressId((current) => {\n        if (current && nextAddresses.some((address) => address.id === current)) return current;\n        return nextAddresses.find((address) => address.is_default)?.id ?? nextAddresses[0]?.id ?? null;\n      });',
          )

          old = '''  const handleSetDefault = async (id: string) => {\n    setIsLoading(true);\n    const { error } = await (supabase.rpc as any)("set_default_customer_address", {\n      _address_id: id,\n    });\n\n    if (error) {\n      console.error("Error setting default address:", error);\n      toast.error("Erro ao definir endereço padrão");\n      await fetchAddresses();\n      return;\n    }\n\n    toast.success("Endereço padrão atualizado");\n    navigate({ to: "/inicio" });\n  };'''
          new = '''  const handleConfirmAddress = async () => {\n    if (!selectedAddressId || isConfirming) return;\n    setIsConfirming(true);\n\n    const selectedAddress = addresses.find((address) => address.id === selectedAddressId);\n    if (!selectedAddress) {\n      setIsConfirming(false);\n      toast.error("Selecione um endereço para continuar");\n      return;\n    }\n\n    if (!selectedAddress.is_default) {\n      const { error } = await (supabase.rpc as any)("set_default_customer_address", {\n        _address_id: selectedAddressId,\n      });\n\n      if (error) {\n        console.error("Error setting default address:", error);\n        setIsConfirming(false);\n        toast.error("Não foi possível confirmar este endereço");\n        return;\n      }\n    }\n\n    toast.success("Endereço confirmado");\n    await navigate({ to: "/sacola" });\n    setIsConfirming(false);\n  };'''
          if old not in s:
              raise SystemExit("handleSetDefault block not found")
          s = s.replace(old, new)

          s = s.replace(
              '                  onClick={() => !addr.is_default && void handleSetDefault(addr.id)}',
              '                  onClick={() => setSelectedAddressId(addr.id)}',
          )
          s = s.replace(
              '                    addr.is_default\n                      ? "border-primary/70 bg-zinc-950 shadow-[0_0_20px_-8px_hsl(var(--primary)/0.5)]"',
              '                    selectedAddressId === addr.id\n                      ? "border-primary/70 bg-zinc-950 shadow-[0_0_20px_-8px_hsl(var(--primary)/0.5)]"',
          )
          s = s.replace(
              '                      addr.is_default ? "border-primary" : "border-zinc-600"',
              '                      selectedAddressId === addr.id ? "border-primary" : "border-zinc-600"',
          )
          s = s.replace(
              '                    {addr.is_default ? (\n                      <span className="block h-3 w-3 rounded-full bg-primary" />\n                    ) : null}',
              '                    {selectedAddressId === addr.id ? (\n                      <span className="block h-3 w-3 rounded-full bg-primary" />\n                    ) : null}',
          )

          marker = '''        <div className="mt-8">\n          <Button\n            type="button"\n            onClick={() => navigate({ to: "/enderecos/novo" })}'''
          replacement = '''        {addresses.length > 0 ? (\n          <div className="mt-8">\n            <Button\n              type="button"\n              disabled={!selectedAddressId || isConfirming}\n              onClick={() => void handleConfirmAddress()}\n              className="flex h-14 w-full items-center justify-center rounded-2xl bg-primary text-base font-extrabold text-black shadow-[0_8px_30px_-10px_hsl(var(--primary)/0.8)] hover:bg-primary/90 disabled:opacity-50"\n            >\n              {isConfirming ? (\n                <>\n                  <Loader2 className="mr-2 h-5 w-5 animate-spin" />\n                  Confirmando...\n                </>\n              ) : (\n                "Confirmar endereço"\n              )}\n            </Button>\n            <p className="mt-2 text-center text-xs text-zinc-500">\n              Ao confirmar, você volta para a sacola com este endereço selecionado.\n            </p>\n          </div>\n        ) : null}\n\n        <div className="mt-4">\n          <Button\n            type="button"\n            onClick={() => navigate({ to: "/enderecos/novo" })}'''
          if marker not in s:
              raise SystemExit("add address button marker not found")
          s = s.replace(marker, replacement)
          p.write_text(s, encoding="utf-8")

          p = Path("src/routes/checkout.tsx")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'Atualize este endereço pelo mapa para validar a área de entrega.',
              'Precisamos localizar este endereço com precisão para calcular a entrega. Toque em Alterar, edite o endereço e marque o ponto no mapa.',
          )
          p.write_text(s, encoding="utf-8")

      - name: Validate patch
        run: |
          grep -q 'Confirmar endereço' src/routes/enderecos.tsx
          grep -q 'volta para a sacola' src/routes/enderecos.tsx
          grep -q 'Precisamos localizar este endereço com precisão' src/routes/checkout.tsx

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/enderecos.tsx src/routes/checkout.tsx
          git commit -m "fix(customer): confirm delivery address before returning to cart"
          git push origin HEAD:main
