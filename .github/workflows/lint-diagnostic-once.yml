name: Lint Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint-diagnostic-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture report
        run: bunx eslint . --format json --output-file lint-report-final.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: lint-report-final
          path: lint-report-final.json
          retention-days: 1
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/lint-diagnostic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot lint diagnostic"
          git push origin HEAD:main
