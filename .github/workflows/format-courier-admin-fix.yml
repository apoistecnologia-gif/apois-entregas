name: Format Courier Admin Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-courier-admin-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format changed source files
        run: bunx prettier --write src/components/CourierRouteMap.tsx src/routes/admin.tsx
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierRouteMap.tsx src/routes/admin.tsx
          git commit -m "style: format courier route and admin merchant flow"
          git push origin HEAD:main
