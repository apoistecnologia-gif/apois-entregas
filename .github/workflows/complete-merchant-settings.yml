name: Complete merchant settings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-merchant-settings.yml
      - .github/scripts/complete-merchant-settings.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/complete-merchant-settings.py
      - run: bunx prettier src/routes/merchant.tsx --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit change and remove one-shot files
        run: |
          rm .github/workflows/complete-merchant-settings.yml
          rm .github/scripts/complete-merchant-settings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(merchant): complete business settings and location"
          git push
