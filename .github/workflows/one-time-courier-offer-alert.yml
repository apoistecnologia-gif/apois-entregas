name: One-time courier offer alert

on:
  push:
    branches: [main]
    paths:
      - scripts/one-time-courier-offer-alert.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: python scripts/one-time-courier-offer-alert.py
      - run: bunx prettier --write src/routes/courier.tsx
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "feat(courier): add audible offer alerts"
          git push origin HEAD:main
