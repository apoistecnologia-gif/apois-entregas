name: Complete fee rule UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-fee-rule-ui.yml
      - .github/scripts/complete-fee-rule-ui.py

permissions:
  contents: write

jobs:
  complete-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/complete-fee-rule-ui.py
      - run: bunx prettier src/routes/checkout.tsx src/routes/admin.tsx --write
      - name: Full verification
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit verified implementation and remove one-shot files
        run: |
          rm .github/workflows/complete-fee-rule-ui.yml
          rm .github/scripts/complete-fee-rule-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(finance): expose fee rules in checkout and admin"
          git push
