name: Refresh Bun Lock Geolocation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-bun-lock-geolocation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: lock native geolocation dependency"
          git push origin HEAD:main
