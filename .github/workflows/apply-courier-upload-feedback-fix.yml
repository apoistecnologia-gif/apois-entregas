name: Apply courier upload feedback fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-courier-upload-feedback-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch courier upload feedback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/courier.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'toast.success("Documento enviado.");'
          new = 'toast.success("Documento enviado com sucesso. Seu cadastro ficará em análise até a aprovação.");'
          if old not in text:
              raise SystemExit('upload success toast not found')
          text = text.replace(old, new, 1)

          old = '''        <h1 className="mt-1 text-2xl font-black uppercase text-primary">
          {courier.status.replaceAll("_", " ")}
        </h1>'''
          new = '''        <h1 className="mt-1 text-2xl font-black uppercase text-primary">
          {courier.status === "under_review"
            ? "EM ANÁLISE"
            : courier.status === "rejected"
              ? "CADASTRO RECUSADO"
              : courier.status === "approved"
                ? "APROVADO"
                : courier.status.replaceAll("_", " ")}
        </h1>
        <p className="mt-3 text-sm leading-relaxed text-zinc-500">
          Os documentos são enviados automaticamente assim que você seleciona o arquivo. Depois do
          envio, seu cadastro permanece em análise até a aprovação da APOIS.
        </p>'''
          if old not in text:
              raise SystemExit('courier status block not found')
          text = text.replace(old, new, 1)

          old = '''                  {doc?.status ?? "Não enviado"}'''
          new = '''                  {doc?.status === "approved"
                    ? "APROVADO"
                    : doc?.status === "rejected"
                      ? "RECUSADO"
                      : doc?.status === "pending"
                        ? "ENVIADO"
                        : "NÃO ENVIADO"}'''
          if old not in text:
              raise SystemExit('document status label not found')
          text = text.replace(old, new, 1)

          old = '''              {doc?.rejection_reason ? (
                <p className="mt-2 text-xs text-red-300">{doc.rejection_reason}</p>
              ) : null}
              <div className="mt-3 flex items-center gap-2 text-xs text-zinc-500">
                <Upload className="h-4 w-4" /> Selecionar arquivo
              </div>
              <input
                type="file"
                accept="image/jpeg,image/png,image/webp,application/pdf"
                className="mt-2 w-full text-xs text-zinc-600"
                disabled={busy === `doc:${item.type}`}
                onChange={(e) => {
                  const file = e.target.files?.[0];
                  if (file) void onUpload(item.type, file);
                }}
              />'''
          new = '''              {doc?.status === "pending" ? (
                <p className="mt-2 rounded-xl bg-primary/5 px-3 py-2 text-xs leading-relaxed text-zinc-400">
                  Arquivo enviado com sucesso e aguardando análise. Se precisar corrigir o documento,
                  você pode selecionar outro arquivo abaixo para substituí-lo.
                </p>
              ) : null}
              {doc?.rejection_reason ? (
                <p className="mt-2 text-xs text-red-300">{doc.rejection_reason}</p>
              ) : null}
              {doc?.status !== "approved" ? (
                <>
                  <div className="mt-3 flex items-center gap-2 text-xs text-zinc-500">
                    <Upload className="h-4 w-4" />
                    {busy === `doc:${item.type}`
                      ? "Enviando arquivo..."
                      : doc
                        ? "Substituir arquivo"
                        : "Selecionar arquivo para envio automático"}
                  </div>
                  <input
                    type="file"
                    accept="image/jpeg,image/png,image/webp,application/pdf"
                    className="mt-2 w-full text-xs text-zinc-600"
                    disabled={busy === `doc:${item.type}`}
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      const input = e.currentTarget;
                      if (file) {
                        void onUpload(item.type, file).finally(() => {
                          input.value = "";
                        });
                      }
                    }}
                  />
                </>
              ) : (
                <p className="mt-3 text-xs font-bold text-emerald-400">
                  Documento aprovado. Nenhuma ação necessária.
                </p>
              )}'''
          if old not in text:
              raise SystemExit('document upload block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "fix(courier): clarify automatic document upload and review"
          git push origin HEAD:main
