name: Continuation integration gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/continuation-gate.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reconcile latest customer and courier integration
        run: |
          python - <<'PY'
          from pathlib import Path

          courier = Path("src/routes/courier.tsx")
          text = courier.read_text(encoding="utf-8")

          import_line = 'import { CourierRouteMap, type CourierPosition } from "@/components/CourierRouteMap";\n'
          payout_anchor = 'import { clearPayoutAttemptKey, getPayoutAttemptKey } from "@/lib/payout-attempt";\n'
          if import_line not in text:
              if payout_anchor not in text:
                  raise SystemExit("courier route-map import anchor missing")
              text = text.replace(payout_anchor, payout_anchor + import_line, 1)

          state_anchor = '  const [availability, setAvailability] = useState<any>(null);\n'
          state_block = (
              '  const [availability, setAvailability] = useState<any>(null);\n'
              '  const [currentPosition, setCurrentPosition] = useState<CourierPosition | null>(null);\n'
              '  const [locationError, setLocationError] = useState<string | null>(null);\n'
          )
          if 'const [currentPosition, setCurrentPosition]' not in text:
              if state_anchor not in text:
                  raise SystemExit("courier position state anchor missing")
              text = text.replace(state_anchor, state_block, 1)

          send_anchor = '  const sendLocation = useCallback((position: GeolocationPosition) => {\n'
          if send_anchor in text and 'setCurrentPosition(nextPosition);' not in text:
              next_lines = (
                  send_anchor
                  + '    const nextPosition: CourierPosition = {\n'
                  + '      lat: position.coords.latitude,\n'
                  + '      lng: position.coords.longitude,\n'
                  + '      accuracy: Number.isFinite(position.coords.accuracy) ? position.coords.accuracy : null,\n'
                  + '      heading:\n'
                  + '        position.coords.heading !== null && Number.isFinite(position.coords.heading)\n'
                  + '          ? position.coords.heading\n'
                  + '          : null,\n'
                  + '      speed:\n'
                  + '        position.coords.speed !== null && Number.isFinite(position.coords.speed)\n'
                  + '          ? position.coords.speed\n'
                  + '          : null,\n'
                  + '      recordedAt: Date.now(),\n'
                  + '    };\n'
                  + '    setCurrentPosition(nextPosition);\n'
                  + '    setLocationError(null);\n'
              )
              text = text.replace(send_anchor, next_lines, 1)

          # Upgrade watcher error callback if it is still the no-op version.
          old_watch = '''    const watchId = navigator.geolocation.watchPosition(
      sendLocation,
      () => undefined,
      { enableHighAccuracy: true, maximumAge: 10_000, timeout: 15_000 },
    );'''
          new_watch = '''    const watchId = navigator.geolocation.watchPosition(
      sendLocation,
      (error) => {
        setCurrentPosition(null);
        setLocationError(
          error.code === error.PERMISSION_DENIED
            ? "Ative a permissão de localização para receber corridas próximas."
            : "Não foi possível obter sua localização. Verifique o GPS.",
        );
      },
      { enableHighAccuracy: true, maximumAge: 10_000, timeout: 15_000 },
    );'''
          if old_watch in text:
              text = text.replace(old_watch, new_watch, 1)

          # Clear location when courier goes offline if not already done.
          offline_anchor = '    if (!availability?.is_online || !navigator.geolocation) return;\n'
          offline_replacement = '''    if (!availability?.is_online) {
      setCurrentPosition(null);
      setLocationError(null);
      return;
    }
    if (!navigator.geolocation) {
      setCurrentPosition(null);
      setLocationError("Este dispositivo não disponibiliza localização.");
      return;
    }
'''
          if offline_anchor in text:
              text = text.replace(offline_anchor, offline_replacement, 1)

          # Pass currentPosition into ActiveDelivery.
          active_anchor = '''          <ActiveDelivery
            job={activeJob}
            busy={busy === "delivery" || busy === "support"}'''
          active_replacement = '''          <ActiveDelivery
            job={activeJob}
            currentPosition={currentPosition}
            busy={busy === "delivery" || busy === "support"}'''
          if active_anchor in text and 'currentPosition={currentPosition}' not in text.split(active_anchor, 1)[0][-250:]:
              text = text.replace(active_anchor, active_replacement, 1)

          sig_anchor = '''function ActiveDelivery({
  job,
  busy,'''
          sig_replacement = '''function ActiveDelivery({
  job,
  currentPosition,
  busy,'''
          if sig_anchor in text:
              text = text.replace(sig_anchor, sig_replacement, 1)

          map_anchor = '      <div className="mt-5 space-y-3">\n        <AddressRow\n'
          if '<CourierRouteMap job={job} currentPosition={currentPosition} />' not in text:
              if map_anchor not in text:
                  raise SystemExit("active-delivery map anchor missing")
              text = text.replace(
                  map_anchor,
                  '      <CourierRouteMap job={job} currentPosition={currentPosition} />\n' + map_anchor,
                  1,
              )

          # Show online GPS status if not yet present.
          status_anchor = '''          {activeJob && availability?.is_online ? (
            <p className="mt-3 text-xs text-zinc-500">
              Finalize a entrega atual antes de ficar offline.
            </p>
          ) : null}
        </section>'''
          status_replacement = '''          {activeJob && availability?.is_online ? (
            <p className="mt-3 text-xs text-zinc-500">
              Finalize a entrega atual antes de ficar offline.
            </p>
          ) : null}
          {availability?.is_online ? (
            <div
              role={locationError ? "alert" : "status"}
              className={`mt-3 rounded-xl border px-3 py-2 text-[11px] font-bold ${
                locationError
                  ? "border-red-500/20 bg-red-500/5 text-red-300"
                  : currentPosition
                    ? "border-emerald-500/20 bg-emerald-500/5 text-emerald-300"
                    : "border-amber-500/20 bg-amber-500/5 text-amber-300"
              }`}
            >
              {locationError
                ? locationError
                : currentPosition
                  ? "Localização ativa para receber corridas próximas."
                  : "Obtendo sua localização para receber corridas..."}
            </div>
          ) : null}
        </section>'''
          if status_anchor in text and 'Localização ativa para receber corridas próximas.' not in text:
              text = text.replace(status_anchor, status_replacement, 1)

          courier.write_text(text, encoding="utf-8")

          help_path = Path("src/routes/perfil/ajuda.tsx")
          help_text = help_path.read_text(encoding="utf-8")
          if 'Ver conversa' not in help_text:
              anchor = '''                  <p className="mt-3 line-clamp-2 text-xs leading-relaxed text-zinc-500">
                    {ticket.description}
                  </p>'''
              replacement = anchor + '''
                  <button
                    type="button"
                    onClick={() => navigate({ to: `/perfil/ajuda/chamado/${ticket.id}` })}
                    className="mt-3 text-xs font-black text-primary"
                  >
                    Ver conversa
                  </button>'''
              if anchor not in help_text:
                  raise SystemExit("help conversation link anchor missing")
              help_text = help_text.replace(anchor, replacement, 1)
              help_path.write_text(help_text, encoding="utf-8")

          duplicate_tracker = Path("src/components/CourierLocationTracker.tsx")
          if duplicate_tracker.exists():
              duplicate_tracker.unlink()

          for temp in [
              ".github/workflows/courier-live-route-integration.yml",
              ".github/workflows/customer-support-conversation-link.yml",
          ]:
              candidate = Path(temp)
              if candidate.exists():
                  candidate.unlink()
          PY
      - name: Format touched files
        run: |
          bunx prettier src/routes/courier.tsx src/components/CourierRouteMap.tsx src/routes/perfil/ajuda.tsx 'src/routes/perfil/ajuda/chamado/$ticketId.tsx' --write
      - name: Full verification gate
        env:
          VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
        run: |
          bun run build
          bun run typecheck
          bun run test
          bun run format:check
          bun run lint
      - name: Commit reconciled state and remove one-shot workflows
        run: |
          rm -f .github/workflows/continuation-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: reconcile customer support and courier live route"
          git push
