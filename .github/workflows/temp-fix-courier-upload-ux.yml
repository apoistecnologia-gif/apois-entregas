name: Temporary courier upload UX patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: temporary courier upload UX patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch courier document upload UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/courier.tsx')
          text = path.read_text(encoding='utf-8')

          upload_pattern = re.compile(r'''  const uploadDocument = async \(documentType: string, file: File\) => \{.*?^  \};\n\n  const toggleOnline''', re.M | re.S)
          upload_replacement = '''  const uploadDocument = async (documentType: string, file: File) => {
    if (!courier?.id || !user?.id) return false;
    setBusy(`doc:${documentType}`);
    try {
      const extension = file.name.split(".").pop()?.toLowerCase() || "bin";
      const path = `${user.id}/${documentType}-${Date.now()}.${extension}`;
      const upload = await supabase.storage
        .from("courier-documents")
        .upload(path, file, { upsert: false });
      if (upload.error) throw upload.error;
      const existing = documents.find((doc) => doc.document_type === documentType);
      const write = existing
        ? await from("courier_documents")
            .update({ storage_path: path, status: "pending" })
            .eq("id", existing.id)
        : await from("courier_documents").insert({
            courier_id: courier.id,
            document_type: documentType,
            storage_path: path,
            status: "pending",
          });
      if (write.error) throw write.error;
      toast.success("Documento enviado para análise.");
      await loadAll(true);
      return true;
    } catch (error: any) {
      toast.error(error?.message || "Falha ao enviar documento.");
      return false;
    } finally {
      setBusy(null);
    }
  };

  const toggleOnline'''
          text, count_upload = upload_pattern.subn(upload_replacement, text, count=1)
          if count_upload != 1:
              raise SystemExit(f'uploadDocument patch count={count_upload}')

          review_pattern = re.compile(r'''function CourierReviewState\(\{.*?^\}\n\nfunction OfferCard''', re.M | re.S)
          review_replacement = '''function CourierReviewState({
  courier,
  documents,
  busy,
  onUpload,
  onRefresh,
  refreshing,
  onLogout,
}: any) {
  const [selectedFiles, setSelectedFiles] = useState<Record<string, File | null>>({});
  const required = [
    ...(courier.vehicle_type === "bicicleta"
      ? []
      : [
          { type: "cnh", label: "CNH" },
          { type: "documento_veiculo", label: "Documento do veículo" },
        ]),
    { type: "foto_perfil", label: "Foto do entregador" },
  ];
  const courierStatusLabel =
    courier.status === "under_review"
      ? "EM ANÁLISE"
      : courier.status === "rejected"
        ? "CADASTRO RECUSADO"
        : courier.status.replaceAll("_", " ");
  const documentStatusLabel = (status?: string) =>
    status === "approved"
      ? "APROVADO"
      : status === "rejected"
        ? "RECUSADO"
        : status === "pending"
          ? "ENVIADO"
          : "NÃO ENVIADO";

  return (
    <div className="min-h-dvh bg-black p-4 text-white">
      <div className="flex items-center justify-between pt-3">
        <p className="font-black text-primary">APOIS ENTREGADOR</p>
        <button type="button" onClick={onLogout} className="text-sm font-bold text-red-400">
          Sair
        </button>
      </div>
      <div className="mt-8 rounded-3xl border border-zinc-900 bg-zinc-950 p-5">
        <FileCheck2 className="h-9 w-9 text-primary" />
        <p className="mt-4 text-xs font-black uppercase text-zinc-500">Situação</p>
        <h1 className="mt-1 text-2xl font-black uppercase text-primary">{courierStatusLabel}</h1>
        {courier.rejection_reason ? (
          <p className="mt-3 rounded-xl bg-red-500/10 p-3 text-sm text-red-300">
            {courier.rejection_reason}
          </p>
        ) : null}
        <button
          type="button"
          onClick={onRefresh}
          className="mt-4 flex items-center gap-2 text-sm font-bold text-zinc-400"
        >
          <RefreshCw className={`h-4 w-4 ${refreshing ? "animate-spin" : ""}`} /> Atualizar situação
        </button>
      </div>
      <div className="mt-4 space-y-3">
        {required.map((item) => {
          const doc = documents.find((row: any) => row.document_type === item.type);
          const selectedFile = selectedFiles[item.type] ?? null;
          const isUploading = busy === `doc:${item.type}`;
          return (
            <div
              key={item.type}
              className="block rounded-2xl border border-zinc-900 bg-zinc-950 p-4"
            >
              <div className="flex items-center justify-between gap-3">
                <span className="font-bold">{item.label}</span>
                <span
                  className={`text-[10px] font-black uppercase ${doc?.status === "approved" ? "text-emerald-400" : doc?.status === "rejected" ? "text-red-400" : "text-primary"}`}
                >
                  {documentStatusLabel(doc?.status)}
                </span>
              </div>
              {doc?.status === "pending" ? (
                <p className="mt-2 text-xs text-zinc-500">
                  Arquivo recebido e aguardando análise. Você pode substituir o arquivo abaixo se necessário.
                </p>
              ) : null}
              {doc?.rejection_reason ? (
                <p className="mt-2 text-xs text-red-300">{doc.rejection_reason}</p>
              ) : null}
              {doc?.status !== "approved" ? (
                <>
                  <div className="mt-3 flex items-center gap-2 text-xs text-zinc-500">
                    <Upload className="h-4 w-4" />
                    {doc ? "Selecionar novo arquivo" : "Selecionar arquivo"}
                  </div>
                  <input
                    type="file"
                    accept="image/jpeg,image/png,image/webp,application/pdf"
                    className="mt-2 w-full text-xs text-zinc-600"
                    disabled={isUploading}
                    onChange={(e) => {
                      const file = e.target.files?.[0] ?? null;
                      setSelectedFiles((current) => ({ ...current, [item.type]: file }));
                    }}
                  />
                  {selectedFile ? (
                    <p className="mt-2 truncate text-xs text-zinc-400">
                      Selecionado: {selectedFile.name}
                    </p>
                  ) : null}
                  <Button
                    type="button"
                    disabled={!selectedFile || isUploading}
                    className="mt-3 h-11 w-full rounded-xl font-black uppercase"
                    onClick={async () => {
                      if (!selectedFile) return;
                      const sent = await onUpload(item.type, selectedFile);
                      if (sent) {
                        setSelectedFiles((current) => ({ ...current, [item.type]: null }));
                      }
                    }}
                  >
                    {isUploading ? (
                      <Loader2 className="mr-2 h-4 w-4 animate-spin" />
                    ) : (
                      <Upload className="mr-2 h-4 w-4" />
                    )}
                    {isUploading ? "Enviando..." : doc ? "Enviar novo arquivo" : "Enviar documento"}
                  </Button>
                </>
              ) : (
                <p className="mt-3 text-xs font-bold text-emerald-400">Documento aprovado.</p>
              )}
            </div>
          );
        })}
      </div>
      <p className="mt-5 text-center text-xs text-zinc-600">
        Após a aprovação, o botão Online e as ofertas de entrega serão liberados automaticamente.
      </p>
    </div>
  );
}

function OfferCard'''
          text, count_review = review_pattern.subn(review_replacement, text, count=1)
          if count_review != 1:
              raise SystemExit(f'CourierReviewState patch count={count_review}')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/courier.tsx
          git commit -m "fix(courier): make document upload explicit and localized"
          git push origin HEAD:main
