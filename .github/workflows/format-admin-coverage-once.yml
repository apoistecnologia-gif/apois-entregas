name: One-time format AdminCoveragePanel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-admin-coverage-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/AdminCoveragePanel.tsx
      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/AdminCoveragePanel.tsx; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminCoveragePanel.tsx
          git commit -m "style(admin): format coverage controls"
          git push origin HEAD:main
