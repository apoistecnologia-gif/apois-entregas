name: Trigger Customer Android Final Homologation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-customer-android-final-homologation.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch customer Android build
        env:
          GH_TOKEN: ${{ github.token }}
        # Triggered after local Pix QR, typed payment redirect and resilient order details fixes.
        run: gh workflow run mobile-android.yml --repo "${{ github.repository }}" --ref main -f product=customer
