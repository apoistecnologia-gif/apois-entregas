name: Finalize courier polish once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-courier-polish-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APOIS_PRODUCT: courier
      VITE_APOIS_PRODUCT_MODE: courier
      VITE_SUPABASE_URL: https://sbvhdgyuuperszlsllji.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tmNxPNALqBcWiEdD7_eWOw_mk0qRkJa
      VITE_GOOGLE_MAPS_BROWSER_KEY: ci-placeholder
      VITE_GOOGLE_MAPS_MAP_ID: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Apply final courier polish
        run: |
          python3 .github/courier_final_polish_patch.py
          bunx prettier --write src/routes/courier.tsx src/components/CourierPanels.tsx
      - name: Courier incompleteness scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('src/routes/courier.tsx'),
              Path('src/routes/login.tsx'),
              Path('src/routes/register.tsx'),
              Path('src/routes/redefinir-senha.tsx'),
          ] + sorted(Path('src/components').glob('Courier*.tsx'))
          patterns = {
              'TODO': re.compile(r'\bTODO\b', re.I),
              'FIXME': re.compile(r'\bFIXME\b', re.I),
              'HACK': re.compile(r'\bHACK\b', re.I),
              'TEMP': re.compile(r'\bTEMP\b', re.I),
              'PLACEHOLDER': re.compile(r'\bPLACEHOLDER\b', re.I),
              'MOCK': re.compile(r'\bMOCK\b', re.I),
              'NOT_IMPLEMENTED': re.compile(r'NOT_IMPLEMENTED', re.I),
              'console.log': re.compile(r'console\.log\s*\('),
              'Not implemented error': re.compile(r'throw\s+new\s+Error\s*\(\s*[\"\']Not implemented[\"\']'),
              'href=#': re.compile(r'href\s*=\s*[\"\']#[\"\']'),
              'empty onClick': re.compile(r'onClick\s*=\s*\{\s*\(\)\s*=>\s*\{\s*\}\s*\}'),
          }
          found = []
          for path in paths:
              if not path.exists():
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for label, regex in patterns.items():
                      if regex.search(line):
                          found.append((str(path), lineno, label, line.strip()))
          print('COURIER_SCAN_BEGIN')
          if found:
              for item in found:
                  print(f'{item[0]}:{item[1]} [{item[2]}] {item[3]}')
          else:
              print('NO_INCOMPLETENESS_MARKERS')
          print('COURIER_SCAN_END')
          PY
      - name: Validate courier package
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run format:check
          APOIS_PRODUCT=courier bun run build:courier
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/courier_final_polish_patch.py
          rm -f .github/workflows/finalize-courier-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(courier): finalize mobile resilience and polish"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            bun run typecheck
            bun run test
            bun run lint
            bun run format:check
            APOIS_PRODUCT=courier bun run build:courier
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
