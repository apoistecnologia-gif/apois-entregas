name: One-time format courier polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-format-courier-polish.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/CourierPanels.tsx src/components/CourierRouteMap.tsx src/routes/courier.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CourierPanels.tsx src/components/CourierRouteMap.tsx src/routes/courier.tsx
          git commit -m "style(courier): format dark map polish"
          git push origin HEAD:main
