name: Cleanup Unreleased UI

on:
  push:
    paths:
      - ".github/workflows/cleanup-unreleased-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Remove unreleased dead actions from production navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          inicio = Path('src/routes/inicio.tsx')
          text = inicio.read_text()
          text = text.replace('  Crown,\n', '', 1)
          block = '''        {/* Banner APOIS+ */}\n        <button\n          type="button"\n          onClick={() => navigate({ to: "/apois-plus" })}\n          className="grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 rounded-2xl border border-primary/30 bg-gradient-to-r from-primary/10 via-zinc-950 to-black px-3 py-4 text-left shadow-[0_10px_30px_-18px_rgba(255,215,0,0.7)] transition-transform active:scale-[0.99]"\n        >\n          <span className="grid h-14 w-14 shrink-0 place-items-center rounded-full bg-primary/10 ring-1 ring-primary/30">\n            <Crown className="h-7 w-7 text-primary" />\n          </span>\n          <span className="min-w-0">\n            <span className="block truncate text-[17px] font-bold text-white">\n              Seja <span className="text-primary">APOIS+</span>\n            </span>\n            <span className="block truncate text-[13px] text-zinc-400">\n              Conheça os benefícios que estão chegando\n            </span>\n          </span>\n          <ChevronRight className="h-5 w-5 shrink-0 text-primary" />\n        </button>\n'''
          if block not in text: raise SystemExit('APOIS+ home banner marker not found')
          inicio.write_text(text.replace(block, '', 1))

          profile = Path('src/routes/perfil/index.tsx')
          text = profile.read_text()
          item = '      { icon: Star, label: "APOIS+", path: "/apois-plus", highlight: true },\n'
          if item not in text: raise SystemExit('APOIS+ profile item marker not found')
          text = text.replace(item, '', 1).replace('  Star,\n', '', 1)
          profile.write_text(text)

          bag = Path('src/routes/sacola.tsx')
          text = bag.read_text()
          text = text.replace('  CreditCard,\n', '', 1)
          old = '''              <div className="grid grid-cols-3 gap-3">\n                <div className="flex flex-col items-center justify-center gap-2 rounded-xl border border-primary bg-primary/5 py-4 text-primary shadow-[0_0_15px_rgba(255,215,0,0.15)] ring-1 ring-primary/30">\n                  <div className="relative">\n                    <CircleDollarSign className="h-6 w-6" />\n                    <div className="absolute -bottom-1 -right-1 flex h-3 w-3 items-center justify-center rounded-full bg-primary ring-2 ring-black">\n                      <div className="h-1.5 w-1.5 rounded-full bg-black" />\n                    </div>\n                  </div>\n                  <span className="text-[12px] font-bold">Pix</span>\n                </div>\n\n                <button\n                  type="button"\n                  disabled\n                  className="flex cursor-not-allowed flex-col items-center justify-center gap-2 rounded-xl border border-zinc-900 bg-zinc-950 py-4 text-zinc-700 opacity-60"\n                  aria-label="Cartão indisponível"\n                >\n                  <CreditCard className="h-6 w-6" />\n                  <span className="text-[12px] font-bold">Cartão</span>\n                  <span className="text-[9px] font-black uppercase">Em breve</span>\n                </button>\n\n                <button\n                  type="button"\n                  disabled\n                  className="flex cursor-not-allowed flex-col items-center justify-center gap-2 rounded-xl border border-zinc-900 bg-zinc-950 py-4 text-zinc-700 opacity-60"\n                  aria-label="Dinheiro indisponível"\n                >\n                  <CircleDollarSign className="h-6 w-6" />\n                  <span className="text-[12px] font-bold">Dinheiro</span>\n                  <span className="text-[9px] font-black uppercase">Em breve</span>\n                </button>\n              </div>'''
          new = '''              <div className="rounded-xl border border-primary bg-primary/5 p-4 text-primary shadow-[0_0_15px_rgba(255,215,0,0.15)] ring-1 ring-primary/30">\n                <div className="flex items-center gap-3">\n                  <CircleDollarSign className="h-6 w-6" />\n                  <div>\n                    <p className="text-sm font-bold">PIX</p>\n                    <p className="text-[11px] text-zinc-400">Pagamento disponível e confirmado automaticamente.</p>\n                  </div>\n                </div>\n              </div>'''
          if old not in text: raise SystemExit('bag payment placeholders marker not found')
          bag.write_text(text.replace(old,new,1))

          checkout = Path('src/routes/checkout.tsx')
          text = checkout.read_text()
          text = text.replace('  CreditCard,\n', '', 1)
          old = '''\n            <div className="flex items-center gap-3 rounded-xl border border-zinc-900 p-3 opacity-30 grayscale">\n              <div className="flex h-8 w-8 items-center justify-center rounded-full bg-zinc-800">\n                <CreditCard className="h-4 w-4 text-zinc-500" />\n              </div>\n              <div className="flex-1">\n                <p className="text-sm font-bold">Cartão de Crédito</p>\n                <p className="text-[10px] font-bold uppercase text-zinc-500">Em breve</p>\n              </div>\n            </div>'''
          if old not in text: raise SystemExit('checkout card placeholder marker not found')
          checkout.write_text(text.replace(old, '', 1))

          plus = Path('src/routes/apois-plus.tsx')
          text = plus.read_text()
          text = text.replace(
              'import { ArrowLeft, Crown, Check, ChevronRight, Zap, ShoppingBag, Gift } from "lucide-react";',
              'import { ArrowLeft, Crown, Zap, ShoppingBag, Gift, Tag } from "lucide-react";',
              1,
          )
          old = '''          <button\n            disabled\n            className="w-full bg-zinc-900 border border-zinc-800 text-zinc-600 font-bold py-4 rounded-2xl cursor-not-allowed"\n          >\n            Quero entrar na fila\n          </button>\n'''
          if old not in text: raise SystemExit('APOIS+ dead CTA marker not found')
          text = text.replace(old, '', 1)
          text = text.replace('\n// Fixed missing import in benefits array\nimport { Tag } from "lucide-react";\n', '\n', 1)
          plus.write_text(text)
          PY
      - name: Format and verify
        run: |
          bunx prettier --write src/routes/inicio.tsx src/routes/perfil/index.tsx src/routes/sacola.tsx src/routes/checkout.tsx src/routes/apois-plus.tsx
          bun run typecheck
          bun run test
          bun run build
          bun run lint
          bun run format:check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/inicio.tsx src/routes/perfil/index.tsx src/routes/sacola.tsx src/routes/checkout.tsx src/routes/apois-plus.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(ux): hide unreleased production actions"
          git push
