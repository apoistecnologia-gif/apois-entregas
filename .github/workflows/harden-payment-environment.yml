name: Harden Payment Environment

on:
  push:
    paths:
      - ".github/workflows/harden-payment-environment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Bind Mercado Pago functions to the database payment environment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Merchant monthly billing
          path = Path('supabase/functions/merchant-subscription/index.ts')
          text = path.read_text()
          old = '''  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";'''
          new = '''  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";\n  const paymentMode = testMode ? "test" : "production";'''
          if old not in text: raise SystemExit('merchant environment marker not found')
          text = text.replace(old,new,1)
          old = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: userData, error: userError } = await admin.auth.getUser(jwt);'''
          new = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    console.error("merchant-subscription payment environment mismatch", {\n      edgeEnvironment: environment,\n      databaseEnvironment,\n    });\n    return json(request, 503, { error: "payment_environment_mismatch" });\n  }\n\n  const { data: userData, error: userError } = await admin.auth.getUser(jwt);'''
          if old not in text: raise SystemExit('merchant admin marker not found')
          text = text.replace(old,new,1)
          old = '''  if (paymentsError) return json(request, 500, { error: "subscription_payment_lookup_failed" });\n\n  const reconcilePayment = async (paymentRow: any) => {'''
          new = '''  if (paymentsError) return json(request, 500, { error: "subscription_payment_lookup_failed" });\n\n  const currentEnvironmentPayments = (paymentRows ?? []).filter((row: any) => {\n    const key = text(row.idempotency_key);\n    return Boolean(key?.includes(`:pix:${paymentMode}:attempt:`));\n  });\n\n  const reconcilePayment = async (paymentRow: any) => {'''
          if old not in text: raise SystemExit('merchant payment filter marker not found')
          text = text.replace(old,new,1)
          text = text.replace(
            '''  const latestProviderPayment = (paymentRows ?? []).find((row: any) =>\n    Boolean(row.provider_authorized_payment_id),\n  );''',
            '''  const latestProviderPayment = currentEnvironmentPayments.find((row: any) =>\n    Boolean(row.provider_authorized_payment_id),\n  );''',
            1,
          )
          old = '''  const accessAllowed = Boolean(\n    subscription.current_period_end &&\n    new Date(subscription.current_period_end).getTime() > Date.now(),\n  );'''
          new = '''  const subscriptionEnvironment = isRecord(subscription.metadata)\n    ? text(subscription.metadata.environment)\n    : null;\n  const accessAllowed = Boolean(\n    subscriptionEnvironment === environment &&\n      subscription.last_payment_status === "approved" &&\n      subscription.current_period_end &&\n      new Date(subscription.current_period_end).getTime() > Date.now(),\n  );'''
          if old not in text: raise SystemExit('merchant access marker not found')
          text = text.replace(old,new,1)
          text = text.replace('''  const activePending = (paymentRows ?? []).find((row: any) => {''','''  const activePending = currentEnvironmentPayments.find((row: any) => {''',1)
          text = text.replace('''  const expiredIds = (paymentRows ?? [])\n    .filter(''','''  const expiredIds = currentEnvironmentPayments\n    .filter(''',1)
          old = '''  const attemptNumber = (paymentRows?.length ?? 0) + 1;\n  const mode = testMode ? "test" : "prod";\n  const idempotencyKey = `mercadopago:merchant-subscription:${subscription.id}:pix:${mode}:attempt:${attemptNumber}`;'''
          new = '''  const attemptNumber = currentEnvironmentPayments.length + 1;\n  const idempotencyKey = `mercadopago:merchant-subscription:${subscription.id}:pix:${paymentMode}:attempt:${attemptNumber}`;'''
          if old not in text: raise SystemExit('merchant idempotency marker not found')
          text = text.replace(old,new,1)
          old = '''    accessAllowed: Boolean(\n      subscription.current_period_end &&\n      new Date(subscription.current_period_end).getTime() > Date.now(),\n    ),'''
          new = '''    accessAllowed: Boolean(\n      isRecord(subscription.metadata) &&\n        text(subscription.metadata.environment) === environment &&\n        subscription.last_payment_status === "approved" &&\n        subscription.current_period_end &&\n        new Date(subscription.current_period_end).getTime() > Date.now(),\n    ),'''
          if old not in text: raise SystemExit('merchant final access marker not found')
          text = text.replace(old,new,1)
          path.write_text(text)

          # Customer PIX charge
          path = Path('supabase/functions/create-pix-charge/index.ts')
          text = path.read_text()
          old = '''  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";'''
          new = '''  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";\n  const paymentMode = testMode ? "test" : "prod";'''
          if old not in text: raise SystemExit('pix environment marker not found')
          text = text.replace(old,new,1)
          old = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: order, error: orderError } = await admin'''
          new = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    console.error("create-pix-charge payment environment mismatch", {\n      edgeEnvironment: environment,\n      databaseEnvironment,\n    });\n    return response(503, {\n      error: "Ambiente de pagamentos temporariamente inconsistente.",\n      code: "PAYMENT_ENVIRONMENT_MISMATCH",\n    });\n  }\n\n  const { data: order, error: orderError } = await admin'''
          if old not in text: raise SystemExit('pix admin marker not found')
          text = text.replace(old,new,1)
          old = '''  const latest = attempts?.[0] ?? null;'''
          new = '''  const currentEnvironmentAttempts = (attempts ?? []).filter((attempt: any) =>\n    text(attempt.idempotency_key)?.includes(`:pix:${paymentMode}:attempt:`),\n  );\n  const latest = currentEnvironmentAttempts[0] ?? null;'''
          if old not in text: raise SystemExit('pix latest marker not found')
          text = text.replace(old,new,1)
          old = '''  const attemptNumber = (attempts?.length ?? 0) + 1;\n  const idempotencyKey = `mercadopago:order:${order.id}:pix:${testMode ? "test" : "prod"}:attempt:${attemptNumber}`;'''
          new = '''  const attemptNumber = currentEnvironmentAttempts.length + 1;\n  const idempotencyKey = `mercadopago:order:${order.id}:pix:${paymentMode}:attempt:${attemptNumber}`;'''
          if old not in text: raise SystemExit('pix idempotency marker not found')
          text = text.replace(old,new,1)
          path.write_text(text)

          # Authenticated customer reconciliation
          path = Path('supabase/functions/sync-payment-status/index.ts')
          text = path.read_text()
          start = text.index('function accessTokenForOrder(')
          end = text.index('\n\nDeno.serve', start)
          text = text[:start] + text[end+2:]
          old = '''  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n  const apiBase ='''
          new = '''  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";\n  const accessToken = testMode\n    ? Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_TEST")?.trim() ||\n      Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN")?.trim()\n    : Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim();\n  const apiBase ='''
          if old not in text: raise SystemExit('sync environment marker not found')
          text = text.replace(old,new,1)
          old = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n\n  const { data: order, error: orderError } = await admin'''
          new = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    return response(503, {\n      error: "Ambiente de pagamentos temporariamente inconsistente.",\n      code: "PAYMENT_ENVIRONMENT_MISMATCH",\n    });\n  }\n\n  const { data: order, error: orderError } = await admin'''
          if old not in text: raise SystemExit('sync admin marker not found')
          text = text.replace(old,new,1)
          old = '''  const accessToken = accessTokenForOrder(payment.provider_charge_id);\n  if (!accessToken) {'''
          new = '''  const sandboxPayment = /^ORDTST/i.test(payment.provider_charge_id);\n  if ((testMode && !sandboxPayment) || (!testMode && sandboxPayment)) {\n    return response(409, {\n      error: "Este pagamento pertence a outro ambiente do gateway.",\n      code: "PAYMENT_ENVIRONMENT_MISMATCH",\n    });\n  }\n  if (!accessToken) {'''
          if old not in text: raise SystemExit('sync token marker not found')
          text = text.replace(old,new,1)
          path.write_text(text)

          # Refund processing
          path = Path('supabase/functions/process-refund/index.ts')
          text = path.read_text()
          start = text.index('function accessTokenForOrder(')
          end = text.index('\n\nDeno.serve', start)
          text = text[:start] + text[end+2:]
          old = '''  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n  const apiBase ='''
          new = '''  const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");\n  const environment = (Deno.env.get("MERCADO_PAGO_ENVIRONMENT") ?? "test").trim().toLowerCase();\n  const testMode = environment !== "production";\n  const accessToken = testMode\n    ? Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_TEST")?.trim() ||\n      Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN")?.trim()\n    : Deno.env.get("MERCADO_PAGO_ACCESS_TOKEN_PRODUCTION")?.trim();\n  const apiBase ='''
          if old not in text: raise SystemExit('refund environment marker not found')
          text = text.replace(old,new,1)
          old = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n\n  const { data: refund, error: refundError } = await admin'''
          new = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    return response(503, {\n      error: "Ambiente de pagamentos temporariamente inconsistente.",\n      code: "PAYMENT_ENVIRONMENT_MISMATCH",\n    });\n  }\n\n  const { data: refund, error: refundError } = await admin'''
          if old not in text: raise SystemExit('refund admin marker not found')
          text = text.replace(old,new,1)
          old = '''  const accessToken = accessTokenForOrder(payment.provider_charge_id);\n  if (!accessToken) {'''
          new = '''  const sandboxPayment = /^ORDTST/i.test(payment.provider_charge_id);\n  if ((testMode && !sandboxPayment) || (!testMode && sandboxPayment)) {\n    return response(409, {\n      error: "Este pagamento pertence a outro ambiente do gateway.",\n      code: "PAYMENT_ENVIRONMENT_MISMATCH",\n    });\n  }\n  if (!accessToken) {'''
          if old not in text: raise SystemExit('refund token marker not found')
          text = text.replace(old,new,1)
          path.write_text(text)

          # Webhook must fail closed when Edge and DB environment diverge.
          path = Path('supabase/functions/mercadopago-webhook/index.ts')
          text = path.read_text()
          old = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n\n  if (notificationType === "subscription_preapproval") {'''
          new = '''  const admin = createClient(supabaseUrl, serviceRoleKey, {\n    auth: { persistSession: false, autoRefreshToken: false },\n  });\n  const { data: environmentSetting, error: environmentSettingError } = await admin\n    .from("platform_settings")\n    .select("value")\n    .eq("key", "mercado_pago_environment")\n    .maybeSingle();\n  const databaseEnvironment =\n    typeof environmentSetting?.value === "string"\n      ? environmentSetting.value.trim().toLowerCase()\n      : null;\n  if (\n    environmentSettingError ||\n    !["test", "production"].includes(databaseEnvironment ?? "") ||\n    databaseEnvironment !== environment\n  ) {\n    console.error("mercadopago-webhook payment environment mismatch", {\n      edgeEnvironment: environment,\n      databaseEnvironment,\n    });\n    return response(503, { error: "payment_environment_mismatch" });\n  }\n\n  if (notificationType === "subscription_preapproval") {'''
          if old not in text: raise SystemExit('webhook admin marker not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Format and verify
        run: |
          bunx prettier --write supabase/functions/merchant-subscription/index.ts supabase/functions/create-pix-charge/index.ts supabase/functions/sync-payment-status/index.ts supabase/functions/process-refund/index.ts supabase/functions/mercadopago-webhook/index.ts
          bun run typecheck
          bun run test
          bun run build
          bun run lint
          bun run format:check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/merchant-subscription/index.ts supabase/functions/create-pix-charge/index.ts supabase/functions/sync-payment-status/index.ts supabase/functions/process-refund/index.ts supabase/functions/mercadopago-webhook/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(payments): isolate Mercado Pago environments"
          git push
