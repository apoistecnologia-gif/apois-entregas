name: One-shot Prettier diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prettier-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Show exact formatting diff without committing source
        run: |
          bunx prettier src/routes/favoritos.tsx 'src/routes/pedido/$orderId/avaliar.tsx' --write
          git diff --no-color -- src/routes/favoritos.tsx 'src/routes/pedido/$orderId/avaliar.tsx'
